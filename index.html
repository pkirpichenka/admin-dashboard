  Дашборд администратора сети студий растяжки (Минск) — прототип

  Роли: Руководитель (все права) / Администратор с индивидуальным набором прав.
  Учётные записи с паролями; руководитель может делегировать управление и права доступа.
  Валюта: BYN (Br). Записи сохраняются между сессиями, выгрузка лога в Excel.
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap');

:root{
  --bg:#E7ECE6; --surface:#FFFFFF; --surface-2:#F3F6F2;
  --ink:#17261F; --ink-soft:#5C6E64; --ink-faint:#8A998F;
  --accent:#2E7D5B; --accent-deep:#1E5C41;
  --gold:#C58A2E; --gold-soft:#F6EAD2;
  --clay:#C05038; --clay-soft:#F7E1DA;
  --line:#D5DED6; --line-strong:#BCC8BD;
  --radius:14px; --shadow:0 1px 2px rgba(23,38,31,.06), 0 8px 24px rgba(23,38,31,.06);
  --fx:250ms cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box} html,body{margin:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%, rgba(46,125,91,.10), transparent 60%), var(--bg);
  color:var(--ink); font-family:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:1000px;margin:0 auto;padding:22px 20px 80px}

/* Header */
.top{display:flex;align-items:center;gap:14px;padding:16px 20px;margin:22px auto 0;max-width:1000px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mark{width:42px;height:42px;border-radius:12px;flex:0 0 auto;background:linear-gradient(150deg,var(--accent),var(--accent-deep));
  display:grid;place-items:center;color:#fff}
.mark svg{width:24px;height:24px}
.brand{line-height:1.15}
.brand .name{font-family:'Unbounded';font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--ink-faint);letter-spacing:.3px;text-transform:uppercase}
.top .spacer{flex:1}
.who{text-align:right;line-height:1.25}
.who .fio{font-weight:600;font-size:14px}
.who .role{font-size:12px;color:var(--ink-soft)}
.role-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px}
.role-admin{background:var(--surface-2);color:var(--accent-deep)}
.role-boss{background:var(--gold-soft);color:var(--gold)}

button{font-family:inherit;cursor:pointer}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;
  font-size:14px;font-weight:600;transition:var(--fx)}
.btn:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 10px}
.btn-ghost:hover{color:var(--clay);background:var(--clay-soft)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.card-head .idx{font-family:'Unbounded';font-weight:700;font-size:13px;color:var(--accent);width:26px;height:26px;
  border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.card-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
.card-head .hint{margin-left:auto;font-size:12px;color:var(--ink-faint)}
.card-body{padding:18px 20px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
label.field{display:block}
.field .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;letter-spacing:.2px}
.field .lbl small{color:var(--ink-faint);font-weight:500}
input,textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:var(--fx)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(46,125,91,.14)}
input[type="number"]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:52px;line-height:1.45}
.cur{position:relative}
.cur input{padding-right:38px}
.cur .sym{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-weight:600;pointer-events:none;font-size:13px}

.tape{background:linear-gradient(180deg,#fff, var(--surface-2));border:1px dashed var(--line-strong);border-radius:12px;
  padding:14px 16px;margin-bottom:16px;display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.tape .seg{display:flex;flex-direction:column;gap:2px;padding:4px 10px;min-width:110px}
.tape .seg .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.4px}
.tape .seg .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tape .op{align-self:center;color:var(--ink-faint);font-size:18px;font-weight:700}
.tape .seg.in .v{color:var(--gold)} .tape .seg.out .v{color:var(--clay)}
.tape .seg.exp{margin-left:auto;text-align:right;border-left:1px solid var(--line);padding-left:16px}
.tape .seg.exp .v{color:var(--accent-deep)}
.diff-chip{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.diff-ok{background:var(--surface-2);color:var(--accent)} .diff-bad{background:var(--clay-soft);color:var(--clay)}

.chg{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.chg select{width:130px;flex:0 0 auto} .chg .amt{width:150px;flex:0 0 auto} .chg .cmt{flex:1} .chg .x{flex:0 0 auto}
.add-row{display:inline-flex;align-items:center;gap:6px;margin-top:2px}

/* Clients dynamic */
.cl-block{margin-bottom:4px}
.cl-sep{border:none;border-top:1px solid var(--line);margin:20px 0}
.cl-row2{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cl-row2 .field{flex:1 1 170px;max-width:230px}
.cl-badge{font-size:13px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-weight:600;white-space:nowrap;margin-bottom:1px}
.cl-badge b{color:var(--accent-deep);font-variant-numeric:tabular-nums}
.cl-badge.warn{background:var(--clay-soft);border-color:var(--clay-soft)} .cl-badge.warn b{color:var(--clay)}
.cl-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cl-list:empty{margin-top:0}
.cl-item{display:flex;align-items:center;gap:8px}
.cl-item .ix{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--surface-2);color:var(--ink-soft);
  font-size:12px;font-weight:700;display:grid;place-items:center}
.cl-item .cl-note{flex:1}
.cl-toggle{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:var(--fx);white-space:nowrap}
.cl-toggle:hover{border-color:var(--gold)}
.cl-toggle.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.cl-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:var(--fx)}
.cl-toggle.on .dot{background:var(--gold)}
@media (max-width:640px){.cl-item .cl-toggle{padding:8px 10px}.cl-row2 .field{max-width:none}}

/* Morning cash compare + locks */
.fix-row{display:flex;gap:8px;align-items:stretch}
.fix-row .cur input{height:100%}
.fix-btn{flex:0 0 auto;white-space:nowrap}
.banner{background:var(--clay-soft);border:1px solid #E8B7AC;border-radius:12px;padding:12px 14px;margin-bottom:18px}
.banner .bt{font-weight:700;color:var(--clay);font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.banner .bi{display:flex;flex-wrap:wrap;gap:8px}
.banner .bchip{background:#fff;border:1px solid #E8B7AC;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--fx)}
.banner .bchip:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
.closed-badge{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;align-self:center}
.stat{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.stat-closed{background:var(--surface-2);color:var(--accent)}
.stat-open{background:var(--clay-soft);color:var(--clay)}
.mcmp{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.mcmp-k{color:var(--ink-faint)}
.mcmp .mok{color:var(--accent)} .mcmp .mbad{color:var(--clay)}
.lockchip{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:1px 8px;border-radius:999px;margin-left:4px}
.hintline{font-size:12px;color:var(--ink-faint)}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline;flex:0 0 auto}
.ent{color:var(--ink-faint);font-weight:600;font-size:10.5px}
input[readonly]{background:#EFF2EE;color:var(--ink-soft);cursor:not-allowed}

/* History */
.day{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.day-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:var(--fx)}
.day-head:hover{background:var(--surface-2)}
.day-date{font-weight:700;font-size:14px}
.day-date .dow{color:var(--ink-faint);font-weight:500;font-size:12px;margin-left:6px}
.st-tag{font-size:11px;font-weight:700;color:var(--accent-deep);background:var(--surface-2);border:1px solid var(--line);
  padding:2px 9px;border-radius:999px}
.day-by{margin-left:auto;font-size:12px;color:var(--ink-soft);text-align:right}
.day-by b{color:var(--ink);font-weight:600}
.chev{transition:transform var(--fx);color:var(--ink-faint)}
.day.open .chev{transform:rotate(90deg)}
.day-body{display:none;padding:4px 16px 16px;border-top:1px solid var(--line)}
.day.open .day-body{display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:10px 0}
.kv .item .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px}
.kv .item .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.notes{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.notes .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.empty{text-align:center;color:var(--ink-faint);padding:30px 16px;font-size:14px;border:1px dashed var(--line-strong);
  border-radius:12px;background:var(--surface-2)}

/* Tabs / studios / bar */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;
  margin-bottom:22px;box-shadow:var(--shadow);width:fit-content;max-width:100%;flex-wrap:wrap}
.tab{border:none;background:transparent;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-soft);transition:var(--fx)}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);box-shadow:0 10px 20px -16px rgba(31,42,36,.4)}
.topbar .top{margin-top:14px}
.tabsrow{max-width:1000px;margin:14px auto 0;padding:0 20px 14px}
.tabsrow .tabs{margin-bottom:0}
.tab:hover{color:var(--ink)} .tab.on{background:var(--accent);color:#fff}
.studios{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.st-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;text-align:left;
  cursor:pointer;transition:var(--fx);min-width:150px}
.st-btn:hover{border-color:var(--line-strong)}
.st-btn.on{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.st-btn.sched-hl{box-shadow:0 0 0 2px rgba(46,125,91,.35)}
.st-today{font-size:10px;font-weight:700;color:var(--accent-deep);background:var(--surface-2);padding:1px 7px;border-radius:999px;margin-left:4px}
.st-btn .t{font-weight:700;font-size:13px} .st-btn .a{font-size:12px;color:var(--ink-faint)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar .grow{flex:1}
.datepick{display:flex;align-items:center;gap:8px}
.datepick .lbl{margin:0;color:var(--ink-soft);font-weight:600;font-size:13px}
.section-title{font-family:'Unbounded';font-weight:600;font-size:14px;color:var(--ink-soft);letter-spacing:.4px;
  text-transform:uppercase;margin:26px 2px 12px}

/* User management */
.urow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;background:var(--surface);flex-wrap:wrap;box-shadow:var(--shadow)}
.u-main{min-width:150px}
.u-name{font-weight:700;display:flex;align-items:center;gap:8px}
.u-login{font-size:12.5px;color:var(--ink-faint)}
.u-ctl{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
.ctl-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);font-weight:600}
.st-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.st-on{background:var(--surface-2);color:var(--accent)} .st-off{background:var(--clay-soft);color:var(--clay)}
.badge-senior{background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;
  transition:var(--fx);border:none;flex:0 0 auto;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:var(--fx)}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(18px)}

/* Login / setup / modal */
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:30px 28px}
.login .mark{width:52px;height:52px;margin-bottom:16px}
.login h1{font-family:'Unbounded';font-weight:700;font-size:20px;margin:0 0 4px}
.login p.lead{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px}
.overlay{position:fixed;inset:0;background:rgba(23,38,31,.42);display:grid;place-items:start center;z-index:60;padding:20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:100%;max-width:390px;padding:24px;max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.modal h3{margin:0 0 4px;font-family:'Unbounded';font-size:17px}
.modal p{margin:0 0 16px;color:var(--ink-soft);font-size:13.5px}
.modal .field{margin-bottom:12px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;position:sticky;bottom:-24px;background:#fff;padding:10px 0 4px;z-index:3}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:500}
.chk input{width:auto}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;
  pointer-events:none;transition:var(--fx);z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)} .toast.err{background:var(--clay)}
.hidden{display:none !important}
.fade-in{animation:fade var(--fx) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}
  .chg{flex-wrap:wrap}.chg select,.chg .amt{width:calc(50% - 4px)}.chg .cmt{width:100%}
  .tape .seg.exp{margin-left:0}}

/* Итоги за день */
.daysum{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.ds-title{font-family:'Unbounded';font-weight:600;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px}
.ds-grid{display:flex;flex-wrap:wrap;gap:10px 20px;margin-bottom:8px}
.ds-grid:last-child{margin-bottom:0}
.ds-grid > div{display:flex;flex-direction:column;gap:1px}
.ds-grid span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px}
.ds-grid b{font-size:15px;font-variant-numeric:tabular-nums}
.ds-tot b{color:var(--accent-deep)}
.miss-row{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.cashnow{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.cn-title{font-family:'Unbounded';font-weight:600;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px}
.cn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cn-item{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cn-name{font-size:12.5px;font-weight:600;margin-bottom:2px}
.cn-val{font-family:'Unbounded';font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.cn-note{font-size:10.5px;color:var(--ink-faint);margin-top:2px;line-height:1.3}
.cn-note.stale{color:var(--gold)}
.cn-item.cn-shift{border-left:4px solid var(--accent)}
.cn-line{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-top:5px}
.cn-line:first-of-type{margin-top:2px}
.cn-ln.muted{color:var(--ink-faint);font-weight:500}
.hire-lbl{font-size:11px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:4px}

/* Маркетинг Flexico · из визуального прототипа, имена классов изолированы */
.mk-app{
  --fg:var(--ink);--muted:var(--ink-soft);--accent-fg:#fff;--accent-soft:var(--surface-2);
  --c-mash:#2F6FB5;--c-kuib:#E6A700;--c-tolb:#E2711D;
  --st-plan:#6B7872;--st-work:#B26B00;--st-live:#1F8A55;--st-done:#4F6AA8;--danger:var(--clay);
  --font-head:'Unbounded',system-ui,sans-serif;--font-body:'Golos Text',system-ui,sans-serif;
  max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
}
.mk-app *{box-sizing:border-box}
.mk-app button,.mk-app input,.mk-app select,.mk-app textarea{font:inherit;color:inherit}
.mk-app button{cursor:pointer}
.mk-app :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mk-app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mk-app h1,.mk-app h2,.mk-app h3{font-family:var(--font-head);margin:0;text-wrap:balance}
.mk-top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.mk-eyebrow{margin:0 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mk-app h1{font-size:26px;line-height:1.15;font-weight:700}
.mk-top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mk-notice{margin:0;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
.mk-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;line-height:1.2}
.mk-btn:hover{border-color:var(--muted)}
.mk-btn.mk-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.mk-btn.mk-danger{color:var(--danger)}
.mk-btn:disabled{opacity:.5;cursor:default}
.mk-app select,.mk-app input[type=text],.mk-app input[type=date],.mk-app input[type=number],.mk-app textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.mk-app select{width:auto}
.mk-app textarea{resize:vertical;min-height:70px}
.mk-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mk-tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.mk-tile .mk-k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mk-tile .mk-v{font-family:var(--font-head);font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mk-tile .mk-s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mk-tile .mk-v.mk-sm{font-size:15px;line-height:1.25}
.mk-filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.mk-seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mk-seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--muted)}
.mk-seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--fg)}
.mk-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.mk-sp{flex:1}
.mk-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.mk-card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mk-mainhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mk-mainhead h2{font-size:19px;font-weight:600;min-width:9ch}
.mk-mainhead .mk-btn{padding:5px 10px}
.mk-wk,.mk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mk-wk div{padding:7px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.mk-cell{min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.mk-cell:nth-child(7n){border-right:0}
.mk-cell.mk-out{background:var(--surface-2)}
.mk-cell.mk-out .mk-dn{color:var(--muted);opacity:.6}
.mk-cell.mk-sel{box-shadow:inset 0 0 0 2px var(--accent)}
.mk-dn{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.mk-cell.mk-today .mk-dn{background:var(--accent);color:var(--accent-fg)}
.mk-chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.mk-chip{position:relative;display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:5px;padding:2px 6px 2px 9px;font-size:11.5px;line-height:1.3;
  background:color-mix(in srgb,var(--tint,var(--muted)) 15%,var(--surface));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--stripe)}
.mk-chip[data-st=plan]{border-color:var(--line);border-style:dashed;border-left-color:transparent}
.mk-chip[data-st=done]{opacity:.55}
.mk-chip.mk-cont{opacity:.8}
.mk-more{font-size:11px;color:var(--muted);padding-left:4px}
.mk-dots{display:none;gap:3px;flex-wrap:wrap}
.mk-dots i{width:7px;height:7px;border-radius:50%;background:var(--stripe);display:block}
.mk-list{display:flex;flex-direction:column}
.mk-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.mk-row:hover{background:var(--surface-2)}
.mk-row .mk-t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mk-row .mk-d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.mk-empty{padding:28px 16px;color:var(--muted);text-align:center}
.mk-pill{display:inline-flex;align-items:center;gap:5px;border:1px solid currentColor;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.mk-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.mk-pill.mk-plan{color:var(--st-plan)}
.mk-pill.mk-work{color:var(--st-work)}
.mk-pill.mk-live{color:var(--st-live)}
.mk-pill.mk-done{color:var(--st-done)}
.mk-tag{display:inline-block;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.mk-sdot{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.mk-side{position:sticky;top:12px;padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 24px);overflow:auto}
.mk-side h2{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.mk-side .mk-sub{color:var(--muted);font-size:12.5px;text-transform:capitalize}
.mk-ev{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;overflow:hidden}
.mk-ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stripe)}
.mk-ev:hover{border-color:var(--muted)}
.mk-ev b{font-weight:600;overflow-wrap:anywhere}
.mk-ev .mk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mk-link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left;width:max-content}
.mk-kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 10px;margin:0;font-size:13px}
.mk-kv dt{color:var(--muted)}
.mk-kv dd{margin:0;overflow-wrap:anywhere}
.mk-sect{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.mk-sect h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--font-body)}
.mk-bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.mk-bar i{display:block;height:100%;background:var(--accent)}
.mk-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.mk-kpi label,.mk-fld label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.mk-chk{display:flex;gap:8px;align-items:flex-start}
.mk-chk input{margin-top:3px;accent-color:var(--accent)}
.mk-chk.mk-done span{color:var(--muted);text-decoration:line-through}
.mk-acts{display:flex;flex-wrap:wrap;gap:8px}
.mk-fld{display:flex;flex-direction:column;min-width:0}
.mk-frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk-studs{display:flex;flex-wrap:wrap;gap:6px 12px}
.mk-studs label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg);margin:0}
.mk-err{color:var(--danger);font-size:12.5px;min-height:1em}
.mk-ro{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
@media (max-width:960px){.mk-layout{grid-template-columns:minmax(0,1fr)}
.mk-side{position:static;max-height:none}
.mk-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.mk-chips{display:none}
.mk-dots{display:flex}
.mk-cell{min-height:56px;padding:4px}
.mk-row{grid-template-columns:minmax(0,1fr) auto}
.mk-row .mk-d{grid-column:1/-1}
.mk-app h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){.mk-app *{transition:none!important;animation:none!important}}

const CUR = 'BYN'; // белорусский рубль
const APP_VERSION = '14.11.2026-b'; try{ console.log('FAD version', APP_VERSION); }catch(e){}  // метка версии — видна в шапке, помогает проверить деплой


const APP_UPDATE_INTERVAL_MS = 5*60*1000;
const APP_RETURN_CHECK_MS = 10*60*1000;
let APP_REMOTE_VERSION = APP_VERSION;
let APP_UPDATE_AVAILABLE = false;
let APP_UPDATE_CHECKING = false;
let APP_HIDDEN_AT = 0;
let APP_REPORT_UNSAVED_CHECK = ()=>false;
const APP_DIRTY_REASONS = new Set();

function markAppDirty(reason){ if(reason) APP_DIRTY_REASONS.add(reason); }
function clearAppDirty(reason){
  if(reason) APP_DIRTY_REASONS.delete(reason);
  setTimeout(maybeApplyAppUpdate,0);
}
function appHasUnsavedWork(){
  try{ if(APP_REPORT_UNSAVED_CHECK && APP_REPORT_UNSAVED_CHECK()) return true; }catch(e){}
  if(APP_DIRTY_REASONS.size) return true;
  if(document.querySelector('.overlay')) return true;
  const a=document.activeElement;
  if(a && a!==document.body && a.matches && a.matches('input,textarea,select,[contenteditable="true"]')) return true;
  return false;
}
window.addEventListener('beforeunload',function(e){
  let reportDirty=false;
  try{ reportDirty=!!(APP_REPORT_UNSAVED_CHECK && APP_REPORT_UNSAVED_CHECK()); }catch(_){}
  if(reportDirty || APP_DIRTY_REASONS.size>0){e.preventDefault();e.returnValue='';}
});
function appUpdateBanner(){
  let b=document.getElementById('appUpdateBanner');
  if(!APP_UPDATE_AVAILABLE){ if(b) b.remove(); return; }
  if(!b){
    b=document.createElement('div');
    b.id='appUpdateBanner';
    b.className='app-update-banner';
    b.innerHTML=`<div class="aub-grow"><span id="aubText">Доступно обновление FAD</span><span class="aub-sub" id="aubSub">Обновится автоматически, когда данные будут сохранены.</span></div><button class="btn btn-sm" id="aubNow">Обновить сейчас</button>`;
    document.body.appendChild(b);
    b.querySelector('#aubNow').onclick=()=>{
      if(appHasUnsavedWork()){ toast('Сначала сохраните изменения — обновление подождёт',true); return; }
      reloadToLatestVersion();
    };
  }
  const t=b.querySelector('#aubText'), s=b.querySelector('#aubSub');
  if(t) t.textContent=`Доступно обновление FAD${APP_REMOTE_VERSION&&APP_REMOTE_VERSION!==APP_VERSION?' · '+APP_REMOTE_VERSION:''}`;
  if(s) s.textContent=appHasUnsavedWork()
    ? 'Есть несохранённые данные — обновление выполнится после сохранения.'
    : 'Обновление готово и будет применено автоматически.';
}
function reloadToLatestVersion(){
  if(!APP_UPDATE_AVAILABLE) return;
  try{
    const key='fad_last_update_reload';
    const now=Date.now();
    const prev=JSON.parse(sessionStorage.getItem(key)||'{}');
    if(prev.version===APP_REMOTE_VERSION && now-(prev.at||0)<30000) return;
    sessionStorage.setItem(key,JSON.stringify({version:APP_REMOTE_VERSION,at:now}));
  }catch(e){}
  const u=new URL(location.href);
  u.searchParams.set('__fad_update',(APP_REMOTE_VERSION||'latest')+'-'+Date.now());
  location.replace(u.toString());
}
function maybeApplyAppUpdate(){
  if(!APP_UPDATE_AVAILABLE) return;
  appUpdateBanner();
  if(appHasUnsavedWork()) return;
  setTimeout(()=>{
    if(APP_UPDATE_AVAILABLE && !appHasUnsavedWork()) reloadToLatestVersion();
  },250);
}
async function checkForAppUpdate(showStatus){
  if(APP_UPDATE_CHECKING) return;
  APP_UPDATE_CHECKING=true;
  try{
    const u=new URL(location.href);
    u.hash='';
    u.search='';
    u.searchParams.set('__fad_check',Date.now());
    const r=await fetch(u.toString(),{cache:'no-store',credentials:'same-origin',headers:{'Cache-Control':'no-cache'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    const m=html.match(/const\s+APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if(!m||!m[1]) throw new Error('version not found');
    APP_REMOTE_VERSION=m[1];
    if(APP_REMOTE_VERSION!==APP_VERSION){
      APP_UPDATE_AVAILABLE=true;
      appUpdateBanner();
      maybeApplyAppUpdate();
    }else{
      APP_UPDATE_AVAILABLE=false;
      appUpdateBanner();
      if(showStatus) toast('Установлена актуальная версия');
    }
  }catch(e){
    if(showStatus) toast('Не удалось проверить обновление',true);
  }finally{
    APP_UPDATE_CHECKING=false;
  }
}
function initSafeAutoUpdate(){
  try{
    const u=new URL(location.href);
    if(u.searchParams.has('__fad_update')){
      u.searchParams.delete('__fad_update');
      history.replaceState(null,'',u.pathname+(u.search?u.search:'')+u.hash);
    }
  }catch(e){}
  setTimeout(()=>checkForAppUpdate(false),10000);
  setInterval(()=>{ if(document.visibilityState==='visible') checkForAppUpdate(false); },APP_UPDATE_INTERVAL_MS);
  setInterval(()=>{ if(APP_UPDATE_AVAILABLE) maybeApplyAppUpdate(); },30000);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){ APP_HIDDEN_AT=Date.now(); return; }
    const away=APP_HIDDEN_AT?Date.now()-APP_HIDDEN_AT:0;
    APP_HIDDEN_AT=0;
    if(away>=APP_RETURN_CHECK_MS) checkForAppUpdate(false);
    else if(APP_UPDATE_AVAILABLE) maybeApplyAppUpdate();
  });
  document.addEventListener('focusout',()=>{ if(APP_UPDATE_AVAILABLE) setTimeout(maybeApplyAppUpdate,150); });
  window.addEventListener('online',()=>checkForAppUpdate(false));
}


/* ================= Numeric overflow guard 26.09.2026-n ================= */
let __numFitQueued=false;
function _numericFitCandidate(el){
  if(!el || !el.isConnected) return false;
  if(el.querySelector && el.querySelector('input,select,textarea,button')) return false;
  const t=(el.textContent||'').trim();
  if(!/\d/.test(t)) return false;
  /* Avoid shrinking ordinary prose/date labels; currencies and formula rows are allowed. */
  const letters=(t.match(/[A-Za-zА-Яа-яЁё]/g)||[]).length;
  if(letters>4 && !/\b(?:BYN|Br)\b/i.test(t)) return false;
  return true;
}
function fitNumericOverflow(root=document){
  const selector=[
    '.sumcard .sr b',
    '.sumcard .lr b',
    '.sumcard .sc-rev b',
    '.sumcard .sumcard-g b',
    '.cn-val',
    'table th','table td'
  ].join(',');
  const list=(root.matches && root.matches(selector))
    ? [root]
    : Array.from(root.querySelectorAll?root.querySelectorAll(selector):[]);
  list.forEach(el=>{
    if(!_numericFitCandidate(el)) return;
    if(!el.dataset.numFitInit){
      el.dataset.numFitInit='1';
      el.dataset.numFitInline=el.style.fontSize||'';
    }
    el.style.fontSize=el.dataset.numFitInline||'';
    el.classList.add('num-autofit');
    el.classList.remove('num-fit-wrap');
    if(el.clientWidth<=0) return;
    let size=parseFloat(getComputedStyle(el).fontSize)||13;
    const min=Math.max(8.5,Math.min(10,size*0.72));
    let guard=0;
    while(el.scrollWidth>el.clientWidth+1 && size>min && guard<20){
      size=Math.max(min,size-.5);
      el.style.fontSize=size+'px';
      guard++;
    }
    if(el.scrollWidth>el.clientWidth+1) el.classList.add('num-fit-wrap');
  });
}
function scheduleNumericFit(){
  if(__numFitQueued) return;
  __numFitQueued=true;
  requestAnimationFrame(()=>{
    __numFitQueued=false;
    fitNumericOverflow(document);
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',scheduleNumericFit,{once:true});
else scheduleNumericFit();
window.addEventListener('resize',scheduleNumericFit,{passive:true});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(scheduleNumericFit).catch(()=>{});
try{
  new MutationObserver(scheduleNumericFit).observe(document.documentElement,{subtree:true,childList:true,characterData:true});
}catch(e){}

const PERMISSION_KEYS = PERMISSION_DEFS.map(x=>x.key);
const SENIOR_PERMISSION_KEYS = ['reports.view_all','reports.view_totals','reports.period','reports.period_totals','reports.export','schedule.edit','schedule.approve','schedule.absences'];
function permObject(keys){ const o={}; (keys||[]).forEach(k=>o[k]=true); return o; }
const PERMISSION_PRESETS = {
  basic:{},
  senior:permObject(SENIOR_PERMISSION_KEYS),
  full:permObject(PERMISSION_KEYS)
};
function reportDaysValue(p){
  const raw=Number(p&&p['reports.days']);
  if(!Number.isFinite(raw)) return 0;
  return Math.max(0,Math.min(3650,Math.floor(raw)));
}
function reportAnchorDateValue(p){
  // Служебное поле для обратной совместимости с серверной миграцией.
  // Пользователь больше не задаёт конечную дату: окно всегда заканчивается сегодня.
  return reportDaysValue(p)>0?todayStr():'';
}
function normalizePermissions(p){
  const o={};
  PERMISSION_KEYS.forEach(k=>o[k]=!!(p&&p[k]));
  o['reports.days']=reportDaysValue(p);
  o['reports.anchor_date']=o['reports.days']>0?todayStr():'';
  if(o['reports.edit_closed']||o['reports.delete']||o['reports.view_totals']||o['reports.period']||o['reports.period_totals']||o['reports.export'])o['reports.view_all']=true;
  if(o['reports.period_totals']||o['reports.export'])o['reports.period']=true;
  if(o['admins.manage']||o['admins.permissions'])o['admins.view']=true;
  if(o['employees.manage'])o['employees.view']=true;
  if(o['calendar.manage'])o['calendar.view']=true;
  if(!o['reports.view_all']){o['reports.view_totals']=false;o['reports.period']=false;o['reports.period_totals']=false;o['reports.export']=false;o['reports.days']=0;o['reports.anchor_date']='';}
  if(!o['reports.period']){o['reports.period_totals']=false;o['reports.export']=false;}
  if(o['reports.days']<=0)o['reports.anchor_date']='';
  return o;
}
function legacyPermissions(s){
  const o=normalizePermissions((s&&s.permissions)||{});
  if(s&&s.senior) SENIOR_PERMISSION_KEYS.forEach(k=>o[k]=true);
  if(s&&s.canEdit) o['reports.edit_morning']=true;
  return o;
}
function can(key){
  if(!session) return false;
  if(session.role==='owner') return true;
  return !!((session.permissions||{})[key]);
}
function reportDaysLimit(){
  if(!session||session.role==='owner') return 0;
  return reportDaysValue(session.permissions||{});
}
function reportAnchorDate(){
  if(!session||session.role==='owner') return '';
  return reportDaysLimit()>0?todayStr():'';
}
function reportAccessRange(){
  const days=reportDaysLimit();
  if(days<=0)return {days:0,anchor:'',from:'',to:''};
  const anchor=todayStr();
  return {days,anchor,from:isoAddDays(anchor,-(days-1)),to:anchor};
}
function hasAnyPermission(){ return PERMISSION_KEYS.some(k=>can(k)); }
function permissionCount(p){ return PERMISSION_KEYS.filter(k=>!!(p&&p[k])).length; }
function permissionPresetName(p){
  const n=normalizePermissions(p);
  let base;
  if(PERMISSION_KEYS.every(k=>n[k])) base='Полный доступ';
  else {
    const on=PERMISSION_KEYS.filter(k=>n[k]);
    if(on.length===0) base='Обычный';
    else if(on.length===SENIOR_PERMISSION_KEYS.length && SENIOR_PERMISSION_KEYS.every(k=>n[k])) base='Старший';
    else base='Настроено · '+on.length;
  }
  if(n['reports.view_all']&&n['reports.days']>0){
    return `${base} · последние ${n['reports.days']} дн.`;
  }
  return base;
}

    session.permissions=normalizePermissions(PERMISSION_PRESETS.full); session.permissionsLoaded=true; persistSession(); return;

function auditSanitize(v,key){
  if(v==null) return v;
  const k=String(key||'').toLowerCase();
  if(k.includes('password')||k.includes('pass_hash')||k==='p_password'||k==='p_new_password'||k.includes('token')) return '[скрыто]';
  if(Array.isArray(v)) return v.map((x,i)=>auditSanitize(x,String(i)));
  if(typeof v==='object'){
    const o={}; Object.keys(v).forEach(kk=>{o[kk]=auditSanitize(v[kk],kk)}); return o;
  }
  return v;
}
function auditEntityKey(fn,args){
  args=args||{};
  if(fn.includes('report')) return [args.p_studio,args.p_date].filter(Boolean).join(' · ');
  if(fn.includes('admin')||fn.includes('set_home')||fn.includes('set_hire')||fn.includes('set_coffee')||fn.includes('set_active')||fn.includes('reset_password')) return args.p_login||'';
  if(fn==='app_bonus_transfer_branch')return String(args.p_employee_id||'');
  if(fn.includes('schedule')) return args.p_month||'';
  return '';
}
async function auditAction(action,entityType,entityKey,details,tokenOverride){
  const tok=tokenOverride||TOKEN;
  if(!tok||!sb) return null;
  try{
    const {data,error}=await sb.rpc('app_audit_write',{
      p_token:tok,p_action:String(action||'Действие'),
      p_entity_type:String(entityType||'other'),
      p_entity_key:entityKey==null?'':String(entityKey),
      p_details:auditSanitize(details||{},'details')
    });
    if(error) throw error;
    return data;
  }catch(e){ try{console.warn('audit log failed',e)}catch(_){} return null; }
}
function auditRpcSuccess(fn,args,data){
  if(fn==='app_audit_write'||fn==='app_list_audit_log') return;
  if(fn==='app_login') return; // вход фиксируется серверным триггером sessions
  if(fn==='app_bootstrap_owner'){
    const tok=data&&data.token;
    if(tok) void auditAction('Создан аккаунт руководителя','auth','',{},tok);
    return;
  }
  const meta=AUDIT_RPC_META[fn]; if(!meta) return;
  const clean=Object.assign({},args||{}); delete clean.p_token;
  void auditAction(meta.action,meta.entity,auditEntityKey(fn,args),clean);
}

const AUDIT_DETAIL_LABELS={
  before:'Было',after:'Стало',value:'Значение',amount:'Сумма',comment:'Комментарий',
  beforeComment:'Комментарий был',afterComment:'Комментарий стал',text:'Текст',

function auditHumanValue(v){
  if(v===null||v===undefined||v==='') return '—';
  if(typeof v==='boolean') return v?'Да':'Нет';
  if(Array.isArray(v)) return v.map(auditHumanValue).join('; ');
  if(typeof v==='object') return Object.entries(v).map(([k,x])=>`${AUDIT_DETAIL_LABELS[k]||k}: ${auditHumanValue(x)}`).join('; ');

function auditLegacyReportPairs(details){
  const p=details&&details.p_payload;
  if(!p||typeof p!=='object'||Array.isArray(p)) return null;
  const out=[], add=(k,v)=>{ if(v!==undefined&&v!==null&&v!=='') out.push([k,auditHumanValue(v)]); };
  add('Дата',p.date||details.p_date);
  add('Филиал',p.studioId||details.p_studio);
  add('Наличные на начало дня',p.cashStart==null?null:p.cashStart+' BYN');
  add('Наличные на конец дня',p.cashEnd==null?null:p.cashEnd+' BYN');
  add('Картой',p.cashless==null?null:p.cashless+' BYN');
  add('QR',p.allsports==null?null:p.allsports+' BYN');
  add('EPOS',p.epos==null?null:p.epos+' BYN');
  add('Пришло новых клиентов',p.newCame);
  add('Купили абонемент',p.newBought);
  add('Закончились абонементы',p.ended);
  add('Продлили абонементы',p.renewed);
  add('Причина расхождения между сменами',p.interNote);
  add('Комментарий к смене',p.comments);
  if(p.zReport!==undefined) add('Z-отчёт',p.zReport?'Да':'Нет');
  if(p.coffeeDone!==undefined) add('Кофе+снеки',p.coffeeDone?'Выполнено':'Не выполнено');
  if(p.status) add('Статус смены',p.status==='closed'?'Закрыта':'Открыта');
  (p.changes||[]).forEach((c,i)=>{
    const type=c.type==='in'?'Внесение наличных':'Выдача наличных';
    out.push([`${type} №${i+1}`,`${c.amount??'—'} BYN${c.comment?' · '+c.comment:''}`]);
  });
  (p.newList||[]).forEach((c,i)=>{
    if((c.note||'')||c.bought) out.push([`Новый клиент №${i+1}`,`${c.note||'—'} · абонемент: ${c.bought?'да':'нет'}`]);
  });
  (p.notRenewList||[]).forEach((c,i)=>{
    if(c.note) out.push([`Не продлил №${i+1}`,c.note]);
  });
  (p.checklist||[]).forEach((c,i)=>{
    out.push([`Чек-лист №${i+1}`,`${c.text||'Пункт'} · ${c.done?'выполнено':'не выполнено'}`]);
  });
  return out;
}
function auditDetailPairs(details,prefix){
  if(!prefix){
    const legacy=auditLegacyReportPairs(details);
    if(legacy) return legacy;
  }
  const out=[]; const obj=details&&typeof details==='object'?details:{};
  Object.entries(obj).forEach(([k,v])=>{
    const label=(prefix?prefix+' · ':'')+(AUDIT_DETAIL_LABELS[k]||k);
    if(v&&typeof v==='object'&&!Array.isArray(v)){
      const nested=auditDetailPairs(v,label);
      if(nested.length) out.push(...nested); else out.push([label,'—']);
    }else out.push([label,auditHumanValue(v)]);
  });
  return out;
}

let forbiddenCheckPromise=null;
function isForbiddenErr(e){
  const msg=((e&&e.message)||String(e||'')).toLowerCase();
  return msg.includes('forbidden') || msg.includes('permission denied') || msg.includes('not allowed');
}
async function handleForbiddenErr(){
  // В новых точечных правах `forbidden` означает не только истёкшую сессию,
  // но и обычный отказ конкретному действию. Проверяем сессию через RPC,
  // который доступен любому активному пользователю, и не выкидываем человека
  // из дашборда из-за недостаточного права.
  if(forbiddenCheckPromise) return forbiddenCheckPromise;
  const token=TOKEN;
  forbiddenCheckPromise=(async()=>{
    let alive=false;
    try{
      if(token && sb){
        const res=await sb.rpc('app_list_team',{p_token:token});
        alive=!res.error;
      }
    }catch(_){ alive=false; }
    if(TOKEN!==token) return;
    if(alive){
      toast('Недостаточно прав для этого действия', true);
    }else{
      toast('Сессия истекла — войдите снова', true);
      await doLogout();
    }
  })().finally(()=>{ forbiddenCheckPromise=null; });
  return forbiddenCheckPromise;
}
function handleErr(e){
  const msg = (e && e.message) ? e.message : String(e);
  if(isForbiddenErr(e)){ void handleForbiddenErr(); return; }
  toast('Ошибка: ' + msg, true);
}

  boot();
}

const REPORT_SAVE_QUEUES=new Map();
async function apiSaveReportNow(studio,date,payload){
  let r;
  if(session && session.role!=='owner'){
    // Сначала всегда используем обычное сохранение смены. Это важно для текущей
    // рабочей смены: ограничение периода в праве «Все отчёты» не должно мешать
    // администратору заполнять сегодняшний отчёт.
    try{
      r=await rpc('app_save_report', {p_token:TOKEN, p_studio:studio, p_date:date, p_payload:payload});
    }catch(e){
      // Только если обычное сохранение запрещено и есть право редактировать
      // закрытые отчёты, пробуем расширенный RPC с проверкой заданного периода.
      if(can('reports.edit_closed') && isForbiddenErr(e)){
        r=await rpc('app_save_report_permitted',{p_token:TOKEN,p_studio:studio,p_date:date,p_payload:payload});
      }else throw e;
    }
  }else{
    r=await rpc('app_save_report', {p_token:TOKEN, p_studio:studio, p_date:date, p_payload:payload});
  }
  if(Array.isArray(REPORTS)){
    const i=REPORTS.findIndex(e=>e.studioId===studio && e.date===date);
    const copy=JSON.parse(JSON.stringify(payload));
    if(i>=0) REPORTS[i]=copy; else REPORTS.unshift(copy);
  }
  ALL_REPORTS=null;
  return r;
}
async function apiSaveReport(studio,date,payload){
  // Все сохранения одного отчёта выполняются строго по очереди.
  // Это не даёт более старому автосохранению завершиться ПОСЛЕ закрытия смены
  // и затереть свежие данные/статус.
  const key=studio+'|'+date;
  const prev=REPORT_SAVE_QUEUES.get(key)||Promise.resolve();
  const snapshot=JSON.parse(JSON.stringify(payload));
  const run=prev.catch(()=>{}).then(()=>apiSaveReportNow(studio,date,snapshot));
  REPORT_SAVE_QUEUES.set(key,run);
  try{
    return await run;
  }finally{
    if(REPORT_SAVE_QUEUES.get(key)===run) REPORT_SAVE_QUEUES.delete(key);
  }
}

const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function todayStr(){const d=new Date();const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10);}
function fmtLong(iso){const [y,m,dd]=iso.split('-').map(Number);return dd+' '+MON[m-1]+' '+y;}
function fmtDow(iso){const [y,m,dd]=iso.split('-').map(Number);return DOW[new Date(y,m-1,dd).getDay()];}
function money(n){if(n===''||n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('ru-RU')+' '+CUR;}
function pct(a,b){a=(a===''||a==null)?null:Number(a);b=(b===''||b==null)?null:Number(b);if(b==null||b===0||a==null||isNaN(a)||isNaN(b))return '—';return Math.round(a/b*100)+'%';}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function prevDays(iso,count){const [y,m,dd]=iso.split('-').map(Number);const out=[];
  for(let i=1;i<=count;i++){const d=new Date(y,m-1,dd-i);const o=d.getTimezoneOffset();out.push(new Date(d.getTime()-o*60000).toISOString().slice(0,10));}return out;}
function isoAddDays(iso,delta){const [y,m,dd]=iso.split('-').map(Number);const d=new Date(y,m-1,dd+delta);const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10);}
function fmtTime(iso){if(!iso)return '';return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortName(name){const p=String(name||'').trim().split(/\s+/).filter(Boolean); if(p.length<=1) return p[0]||''; return p[0]+' '+p.slice(1).map(w=>w[0]?w[0].toUpperCase()+'.':'').join('');}

/* Не даём колесику мыши / тачпаду случайно менять числовые поля.
   Если курсор находится над активным input[type=number], поле теряет фокус,
   а прокрутка страницы продолжается как обычно. */
document.addEventListener('wheel', function(e){
  const el=(e.target&&e.target.closest)?e.target.closest('input[type=\"number\"]'):null;
  if(el && document.activeElement===el) el.blur();
}, {capture:true, passive:true});

/* ================= Toast & modal ================= */
let toastT;
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',2600);}
function modal(inner){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal fade-in">'+inner+'</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal(ov);});
  ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>closeModal(ov));
  return ov;
}
function closeModal(ov){ov.remove();}

/* ================= Boot ================= */
async function boot(){
  session=null;
  if(!CONFIGURED){ renderConfigError(); return; }
  if(!sb){ renderConfigError({message:'Не загрузилась библиотека Supabase — проверьте интернет или блокировщик рекламы.'}); return; }
  // попытка восстановить сессию после обновления страницы
  let saved=null; try{ saved=JSON.parse(sessionStorage.getItem('sess')); }catch(e){}
  if(saved && saved.token){
    TOKEN=saved.token; session={login:saved.login,name:saved.name,role:saved.role,senior:!!saved.senior,canEdit:!!saved.canEdit,home:saved.home||null,permissions:normalizePermissions(saved.permissions||{}),permissionsLoaded:false};
    try{ await refreshPermissions(); await loadReports(true); renderApp(); return; }
    catch(e){ TOKEN=null; session=null; try{sessionStorage.removeItem('sess');}catch(_){} }
  }
  let needs;
  try{ needs=await rpc('app_needs_setup', {}); }
  catch(e){ renderConfigError(e); return; }
  if(needs) renderSetup(); else renderLogin();
}
function renderConfigError(e){
  const root=document.getElementById('root');
  root.innerHTML=`<div class="login-shell"><div class="login fade-in">
    <div class="mark">${LEAF}</div><h1>Подключите базу данных</h1>
    <p class="lead">Откройте файл index.html и вставьте два значения из Supabase (Project Settings → API): <b>Project URL</b> и <b>anon public key</b>. Затем сохраните и обновите страницу.${e?'<br><br>Сообщение: '+escapeHtml((e&&e.message)||String(e)):''}</p>
  </div></div>`;
}

function roleLabel(){
  if(session.role==='owner') return 'Руководитель';
  const p=normalizePermissions(session.permissions||{});
  const isSenior=PERMISSION_KEYS.filter(k=>p[k]).length===SENIOR_PERMISSION_KEYS.length && SENIOR_PERMISSION_KEYS.every(k=>p[k]);
  return isSenior?'Старший администратор':'Администратор';
}
function header(){
  const full=session.role==='owner'||(PERMISSION_KEYS.every(k=>can(k))&&reportDaysLimit()===0);
  const extended=!full&&hasAnyPermission();
  const pill=full?'<span class="role-pill role-boss">полный доступ</span>':(extended?'<span class="role-pill role-boss">расширенный доступ</span>':'<span class="role-pill role-admin">смена</span>');
  return `<div class="top fade-in">
    <div class="mark">${LEAF}</div>
    <div class="brand"><div class="name" title="версия ${APP_VERSION}">FAD</div></div>
    <div class="spacer"></div>
    <div class="who"><div class="fio">${escapeHtml(shortName(session.name))}</div><div class="role">${roleLabel()} ${pill}</div></div>
    <button class="btn btn-ghost btn-sm" id="refreshBtn">Обновить</button>
    <button class="btn btn-ghost btn-sm" id="logout">Выйти</button>
  </div>`;
}
function renderApp(){
  const tabs=[];
  if(session.role==='owner') tabs.push({label:'Отчёты',render:renderAllReports});
  else tabs.push({label:'Смена',render:renderShift});
  tabs.push({label:'Расписание',render:renderSchedule});
  if(session.role==='owner'||session.role==='admin') tabs.push({label:'Замены',key:'replacements',render:renderReplacements});
  tabs.push({label:'План и бонусы',render:renderBonusDashboard});
  if(session && (session.role==='owner'||session.role==='admin')) tabs.push({label:'Маркетинг',render:renderMarketing});
  if(session.role!=='owner' && can('reports.view_all')) tabs.push({label:'Все отчёты',render:renderAllReports});
  if(session.role==='owner' || ['employees.view','employees.manage','admins.view','admins.manage','admins.permissions','admins.audit','telegram.manage'].some(k=>can(k))) tabs.push({label:'Сотрудники',render:renderEmployees});
  if(session.role==='owner' || can('calendar.view') || can('calendar.manage')) tabs.push({label:'Календарь',render:renderCalendar});
  if(session.role==='owner' || can('messages.manage')) tabs.push({label:'Сообщения',render:renderMessages});
  renderRoleUI(tabs);
}
function renderRoleUI(tabs){
  const root=document.getElementById('root');
  root.innerHTML=`<div class="topbar">${header()}${tabs.length>1?`<div class="tabsrow"><div class="tabs">${tabs.map((t,i)=>`<button class="tab${i===0?' on':''}" data-i="${i}"${t.key?` data-tab="${t.key}"`:''}>${t.label}</button>`).join('')}</div></div>`:''}</div><div class="wrap"><div id="tabbody"></div></div>`;
  root.querySelector('#logout').onclick=()=>doLogout();
  const _rb=root.querySelector('#refreshBtn'); if(_rb) _rb.onclick=async()=>{
    if(appHasUnsavedWork()){ toast('Есть несохранённые изменения — сначала сохраните их',true); return; }
    await checkForAppUpdate(false);
    if(APP_UPDATE_AVAILABLE) reloadToLatestVersion(); else location.reload();
  };
  let body=root.querySelector('#tabbody');
  let currentTab=-1;
  function show(i){
    if(currentTab!==-1 && currentTab!==i && appHasUnsavedWork()){
      toast('Есть несохранённые данные — сначала сохраните изменения',true);
      return;
    }
    body.removeAttribute('data-bonus-token');
    if(tabs[i].key==='replacements'||tabs[currentTab]?.key==='replacements'){
      // A pending renderer from the previous tab can still update its own detached panel.
      const nextBody=document.createElement('div');
      nextBody.id='tabbody';
      body.replaceWith(nextBody);
      body=nextBody;
    }
    currentTab=i;
    root.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
    tabs[i].render(body);
  }
  root.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(+b.dataset.i));
  show(0);
}

/* ================= Shift view (admin fills) ================= */
async function renderShift(body){
  const today=todayStr();
  let sched=null; try{ const _d=new Date(); sched=await apiGetSchedule(monthKey(_d.getFullYear(),_d.getMonth())); }catch(e){}
  let myToday=null;
  if(sched&&sched.assignments){ for(const s of STUDIOS){ const r=sched.assignments[today+'_'+s.id]; if(r&&!r.closed&&(r.shifts||[]).some(x=>x.adminId===session.login)){ myToday=s.id; break; } } }
  if(!shiftStudio && myToday) shiftStudio=myToday;
  body.innerHTML=`
    <div id="banner"></div>
    <div class="section-title">Смена · ${fmtLong(today)} · ${fmtDow(today)}</div>
    <div class="studios" id="studios">${STUDIOS.map(s=>`
      <button class="st-btn${s.id===shiftStudio?' on':''}${s.id===myToday?' sched-hl':''}" data-id="${s.id}" style="border-left:4px solid ${s.color}">
        <div class="t">${s.name}${s.id===myToday?' <span class="st-today">вы сегодня здесь</span>':''}</div><div class="a">${s.address}</div></button>`).join('')}</div>
    <div id="shiftbody"></div>`;
  fillBanner(body.querySelector('#banner'), (s,d)=>openShiftEditor(body,s,d,()=>renderShift(body)));
  body.querySelectorAll('.st-btn').forEach(b=>b.onclick=()=>{if(appHasUnsavedWork()){toast('Сначала сохраните изменения в отчёте',true);return;}shiftStudio=b.dataset.id;renderShift(body);});
  const sb=body.querySelector('#shiftbody');
  if(!shiftStudio){sb.innerHTML=`<div class="empty">Выберите студию, в которой вы сегодня работаете.</div>`;return;}
  const existing=await getEntry(shiftStudio,today)||{};
  await loadReports();
  const prev=lastCashEndBefore(shiftStudio, today);
  const opts={prevCashEnd:prev?prev.cashEnd:null, prevDate:prev?prev.date:null, own:true};
  sb.innerHTML=`<div id="form"></div>
    <div class="section-title">Предыдущие 3 дня · ${studioName(shiftStudio)}</div>
    <div id="history"></div>`;
  renderForm(sb.querySelector('#form'),shiftStudio,today,existing,()=>renderShift(body),opts);
  renderHistory(sb.querySelector('#history'),shiftStudio,prevDays(today,3),()=>renderShift(body));
}

      <button class="btn" id="save">Сохранить</button>
      ${data.status==='closed'
        ? `<button class="btn btn-ghost" id="reopen">Открыть заново</button>`
        : `<button class="btn btn-primary" id="closeShift">Закрыть смену</button>`}
    </div>`;

  if(studio==='masherova') fillCoffeeChk(container, date, data);
  // сравнение утренних наличных с остатком на конец предыдущего дня (тот же филиал)
  const morningCmp=container.querySelector('#morningCmp');
  const interWrap=container.querySelector('#interWrap'), interAmt=container.querySelector('#interAmt');
  function updateMorning(){
    const prev=opts.prevCashEnd, pdate=opts.prevDate;
    if(prev==null){ morningCmp.innerHTML='<span class="mcmp-k">Прошлый остаток на конец:</span> нет прежних данных по этому филиалу'; if(interWrap)interWrap.style.display='none'; return; }
    const sv=container.querySelector('#cashStart').value;
    const has=sv!==''&&!isNaN(parseFloat(sv));
    const d=has?(num(sv)-prev):null;
    morningCmp.innerHTML=`<span class="mcmp-k">Остаток на конец ${pdate?fmtLong(pdate):'прошлого дня'}:</span> <b>${money(prev)}</b>`+
      (d===null?'':` &nbsp;·&nbsp; <span class="mcmp-k">с прошлого остатка:</span> <b class="${d<0?'mbad':'mok'}">${d>0?'+':''}${money(d)}</b>`);
    if(interWrap){
      if(d!==null && d!==0){ interWrap.style.display='block'; if(interAmt)interAmt.innerHTML=`<b style="color:${d>0?'var(--gold)':'var(--clay)'}">${d>0?'+':''}${money(d)}</b>`; }
      else interWrap.style.display='none';
    }
  }
  container.querySelector('#cashStart').addEventListener('input',updateMorning);
  updateMorning();

  // changes
  const changesBox=container.querySelector('#changes');
  function drawChanges(){
    changesBox.innerHTML=changes.map((c,i)=>`
      <div class="chg" data-i="${i}">
        <select class="ctype"><option value="in"${c.type==='in'?' selected':''}>+ Внесено</option><option value="out"${c.type!=='in'?' selected':''}>− Выдано</option></select>
        <div class="cur amt"><input class="camt" type="number" inputmode="decimal" step="0.01" value="${c.amount??''}" placeholder="0"/><span class="sym">${CUR}</span></div>
        <input class="cmt ccmt" value="${c.comment?escapeHtml(c.comment):''}" placeholder="кому / за что (тренеру, руководитель внёс…)"/>
        <button class="btn btn-ghost btn-sm x" type="button">✕</button>
      </div>`).join('');
    changesBox.querySelectorAll('.chg').forEach(row=>{const i=+row.dataset.i;
      row.querySelector('.ctype').onchange=e=>{changes[i].type=e.target.value;drawTape();};
      row.querySelector('.camt').oninput=e=>{changes[i].amount=e.target.value;drawTape();};
      row.querySelector('.ccmt').oninput=e=>{changes[i].comment=e.target.value;};
      row.querySelector('.x').onclick=()=>{changes.splice(i,1);drawChanges();drawTape();};});
  }
  container.querySelector('#addChg').onclick=()=>{changes.push({type:'out',amount:'',comment:''});drawChanges();drawTape();};

  const tape=container.querySelector('#tape');
  function drawTape(){
    const start=num(container.querySelector('#cashStart').value);
    const end=container.querySelector('#cashEnd').value;
    const inSum=changes.filter(c=>c.type==='in').reduce((s,c)=>s+num(c.amount),0);
    const outSum=changes.filter(c=>c.type!=='in').reduce((s,c)=>s+num(c.amount),0);
    const hasEnd=end!==''&&!isNaN(parseFloat(end));
    const dayCash=hasEnd?(num(end)-start-inSum+outSum):null; // выручка наличными за день
    tape.innerHTML=`
      <div class="seg"><span class="k">Утро</span><span class="v">${money(start)}</span></div>
      <div class="op">+</div><div class="seg in"><span class="k">Внесено</span><span class="v">${money(inSum)}</span></div>
      <div class="op">−</div><div class="seg out"><span class="k">Изъято</span><span class="v">${money(outSum)}</span></div>
      <div class="op">→</div><div class="seg"><span class="k">Вечер (факт)</span><span class="v">${hasEnd?money(num(end)):'—'}</span></div>
      <div class="seg exp"><span class="k">Наличными за день</span><span class="v">${dayCash===null?'—':(dayCash>=0?'+':'')+money(dayCash)}</span>
        ${dayCash===null?'<span class="diff-chip diff-ok">введите остаток на конец дня</span>':dayCash>=0?'<span class="diff-chip diff-ok">пришло за день</span>':'<span class="diff-chip diff-bad">недостача</span>'}</div>`;
  }
  ['cashStart','cashEnd'].forEach(id=>container.querySelector('#'+id).addEventListener('input',drawTape));
  drawChanges(); drawTape();

  // new clients
  const newListBox=container.querySelector('#newList'),cameInput=container.querySelector('#newCame'),
        boughtEl=container.querySelector('#boughtCount'),cameEl=container.querySelector('#cameCount');
  function updBought(){const m=newList.filter(x=>x.bought).length;boughtEl.textContent=m;cameEl.textContent=newList.length;const cv=container.querySelector("#newConvBadge");if(cv)cv.textContent=pct(m,newList.length);}
  function drawNewList(){
    newListBox.innerHTML=newList.map((c,i)=>`
      <div class="cl-item" data-i="${i}"><span class="ix">${i+1}</span>
        <input class="cl-note" value="${c.note?escapeHtml(c.note):''}" placeholder="Имя, что купил, откуда узнал…"/>
        <button type="button" class="cl-toggle${c.bought?' on':''}"><span class="dot"></span>абонемент</button></div>`).join('');
    newListBox.querySelectorAll('.cl-item').forEach(row=>{const i=+row.dataset.i;
      row.querySelector('.cl-note').oninput=e=>{newList[i].note=e.target.value;e.target.classList.remove('need');};
      row.querySelector('.cl-toggle').onclick=ev=>{newList[i].bought=!newList[i].bought;ev.currentTarget.classList.toggle('on',newList[i].bought);if(newList[i].bought){const n=row.querySelector('.cl-note');if(n)n.classList.remove('need');}updBought();};});
    updBought();
  }
  function syncNew(){const n=Math.max(0,Math.min(60,Math.floor(num(cameInput.value))));
    while(newList.length<n)newList.push({note:'',bought:false}); if(newList.length>n)newList.length=n; drawNewList();}
  cameInput.addEventListener('input',syncNew); drawNewList();

  // old clients (non-renewers)
  const nrBox=container.querySelector('#notRenewList'),endedIn=container.querySelector('#ended'),
        renewIn=container.querySelector('#renewed'),nrCntEl=container.querySelector('#notRenewCount'),nrBadge=container.querySelector('#nrBadge');
  function drawNrList(){
    nrBox.innerHTML=notRenewList.map((c,i)=>`
      <div class="cl-item" data-i="${i}"><span class="ix">${i+1}</span>
        <input class="cl-note" value="${c.note?escapeHtml(c.note):''}" placeholder="Кто не продлил — имя, причина, что предложили…"/></div>`).join('');
    nrBox.querySelectorAll('.cl-item').forEach(row=>{const i=+row.dataset.i;
      row.querySelector('.cl-note').oninput=e=>{notRenewList[i].note=e.target.value;e.target.classList.remove('need');};});
  }
  function syncNr(){const t=Math.max(0,Math.floor(num(endedIn.value))),r=Math.max(0,Math.floor(num(renewIn.value)));
    const nr=Math.max(0,Math.min(60,t-r));
    while(notRenewList.length<nr)notRenewList.push({note:''}); if(notRenewList.length>nr)notRenewList.length=nr;
    nrCntEl.textContent=nr; nrBadge.classList.toggle('warn',nr>0);
    const rc=container.querySelector('#renewConvBadge'); if(rc) rc.textContent=pct(r,t);
    drawNrList();}
  endedIn.addEventListener('input',syncNr); renewIn.addEventListener('input',syncNr); syncNr();

  // сбор данных формы в объект отчёта
  function collectRec(){
    return {
      studioId:studio, date,
      cashStart:valNum('cashStart'), cashEnd:valNum('cashEnd'),
      changes:changes.filter(c=>c.amount!==''&&!isNaN(parseFloat(c.amount))).map(c=>({type:c.type,amount:num(c.amount),comment:(c.comment||'').trim()})),
      cashless:valNum('cashless'), allsports:valNum('allsports'), epos:valNum('epos'),
      newCame:valNum('newCame'), newBought:newList.filter(x=>x.bought).length,
      newList:newList.map(x=>({note:(x.note||'').trim(),bought:!!x.bought})),
      ended:valNum('ended'), renewed:valNum('renewed'),
      notRenewList:notRenewList.map(x=>({note:(x.note||'').trim()})),
      comments:valStr('comments'), interNote:valStr('interNote'), zReport:!!(container.querySelector('#zReport')&&container.querySelector('#zReport').checked),
      coffeeDone:(container.querySelector('#coffeeDone')?container.querySelector('#coffeeDone').checked:!!data.coffeeDone), coffeeAssigned:(container.querySelector('#coffeeDone')?true:!!data.coffeeAssigned),
      status:data.status||'open', closedBy:data.closedBy, closedByLogin:data.closedByLogin, closedAt:data.closedAt,
      cashStartEditedBy:data.cashStartEditedBy, cashStartEditedAt:data.cashStartEditedAt,
      filledBy:data.filledBy||session.name, filledByLogin:data.filledByLogin||session.login,
      lastEditedBy:session.name, lastEditedByLogin:session.login, lastEditedAt:new Date().toISOString(),
      submittedAt:data.submittedAt||new Date().toISOString(),
      checklist: pendingChecklist || data.checklist || null
    };
  }

  // Зафиксировать наличные на начало дня (сохраняет отчёт и блокирует поле)
  const fixBtn=container.querySelector('#fixMorning');
  if(fixBtn){
    fixBtn.onclick=async()=>{
      if(valNum('cashStart')==null){ toast('Сначала введите сумму наличных',true); return; }
      try{ await apiSaveReport(studio,date,collectRec()); toast('Наличные на начало дня зафиксированы'); onSaved&&onSaved(); setTimeout(maybeApplyAppUpdate,0); }
      catch(e){ handleErr(e); }
    };
  }

  // save (черновик — статус не меняется)
  container.querySelector('#save').onclick=async()=>{
    const rec=collectRec();
    try{await apiSaveReport(studio,date,rec);lastAutoSnap=stripVolatile(rec);toast(data.filledBy?'Отчёт обновлён':'Отчёт сохранён · '+session.name);onSaved&&onSaved();setTimeout(maybeApplyAppUpdate,0);}
    catch(e){toast('Не удалось сохранить',true);}
  };

  // ---- Автосохранение черновика (данные не теряются, если забыли сохранить) ----
  function stripVolatile(r){ const c=Object.assign({},r); delete c.lastEditedAt; delete c.submittedAt; return JSON.stringify(c); }
  let lastAutoSnap=stripVolatile(collectRec()), autoSaving=false, shiftTransition=false;
  APP_REPORT_UNSAVED_CHECK=()=>{
    if(!document.body.contains(container)) return false;
    try{ return shiftTransition || autoSaving || stripVolatile(collectRec())!==lastAutoSnap; }catch(e){ return false; }
  };
  const _sb=container.querySelector('#save'), autoInd=document.createElement('span');
  autoInd.className='autosave-ind'; autoInd.textContent='Автосохранение включено';
  if(_sb&&_sb.parentNode) _sb.parentNode.insertBefore(autoInd,_sb);
  function _hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function setAutoInd(t,err){ autoInd.textContent=t; autoInd.style.color=err?'var(--clay)':'var(--ink-faint)'; }
  async function doAutoSave(){
    if(autoSaving || shiftTransition || !document.body.contains(container)) return;
    const rec=collectRec(), snap=stripVolatile(rec);
    if(snap===lastAutoSnap) return;
    autoSaving=true;
    try{ await apiSaveReport(studio,date,rec); lastAutoSnap=snap; setAutoInd('Черновик сохранён · '+_hhmm()); }
    catch(e){ setAutoInd('Не сохранено — проверьте связь',true); }
    finally{ autoSaving=false; if(APP_UPDATE_AVAILABLE) setTimeout(maybeApplyAppUpdate,0); }
  }
  const _autoTimer=setInterval(()=>{ if(!document.body.contains(container)){ clearInterval(_autoTimer); document.removeEventListener('visibilitychange',_onHide); return; } doAutoSave(); }, 20000);
  function _onHide(){ if(document.visibilityState==='hidden'){ if(!document.body.contains(container)){ document.removeEventListener('visibilitychange',_onHide); return; } doAutoSave(); } }
  document.addEventListener('visibilitychange',_onHide);

  // Закрыть смену — требует все финансовые поля + клиентов
  // поля, которые при пустом значении можно «считать нулём» одним нажатием
  const ZEROABLE=[['cashEnd','наличные на конец дня'],['cashless','картой'],['allsports','QR'],['epos','EPOS'],['newCame','пришло новых'],['ended','закончились абонементы'],['renewed','продлили']];
  async function doClose(){
    if(shiftTransition) return;
    shiftTransition=true;
    const oldStatus=data.status, oldClosedBy=data.closedBy, oldClosedByLogin=data.closedByLogin, oldClosedAt=data.closedAt;
    const closedAt=new Date().toISOString();
    // Сразу меняем локальный статус, чтобы никакое параллельное collectRec()
    // не могло подготовить более старый payload со status=open.
    data.status='closed'; data.closedBy=session.name; data.closedByLogin=session.login; data.closedAt=closedAt;
    const rec=collectRec();
    rec.status='closed'; rec.closedBy=session.name; rec.closedByLogin=session.login; rec.closedAt=closedAt;
    try{
      await apiSaveReport(studio,date,rec);
      lastAutoSnap=stripVolatile(rec);
      toast('Смена закрыта');
      if(onSaved) await onSaved();
      setTimeout(maybeApplyAppUpdate,0);
    }catch(e){
      data.status=oldStatus; data.closedBy=oldClosedBy; data.closedByLogin=oldClosedByLogin; data.closedAt=oldClosedAt;
      handleErr(e);
    }finally{
      shiftTransition=false;
    }
  }
  function proceedClose(){
    const empties=ZEROABLE.filter(f=>valNum(f[0])==null);
    if(empties.length){
      const el=modal(`<h3>Закрыть смену</h3><p>Не заполнены поля: <b>${empties.map(f=>f[1]).join(', ')}</b>.<br>Если по ним данных нет — их можно считать нулём.</p>
        <div class="actions"><button class="btn" data-x>Заполнить вручную</button><button class="btn btn-primary" id="zc">Считать нулём и закрыть</button></div>`);
      el.querySelector('#zc').onclick=async()=>{ empties.forEach(f=>{const inp=container.querySelector('#'+f[0]); if(inp) inp.value='0';}); closeModal(el); await doClose(); };
      return;
    }
    doClose();
  }
  const closeBtn=container.querySelector('#closeShift');
  if(closeBtn){
    closeBtn.onclick=async()=>{
      if(shiftTransition) return;
      if(valNum('cashStart')==null){ toast('Сначала зафиксируйте наличные на начало дня',true); return; }
      let missClient=false;
      container.querySelectorAll('#newList .cl-item').forEach(row=>{ const i=+row.dataset.i; const inp=row.querySelector('.cl-note'); const need=!newList[i].bought && !((newList[i].note||'').trim()); if(inp) inp.classList.toggle('need',need); if(need) missClient=true; });
      container.querySelectorAll('#notRenewList .cl-item').forEach(row=>{ const i=+row.dataset.i; const inp=row.querySelector('.cl-note'); const need=!((notRenewList[i].note||'').trim()); if(inp) inp.classList.toggle('need',need); if(need) missClient=true; });
      if(missClient){ const first=container.querySelector('.cl-note.need'); if(first){ try{ first.scrollIntoView({behavior:'smooth',block:'center'}); first.focus(); }catch(e){} } toast('Укажите причину: почему не купил первый абонемент / не продлил',true); return; }
      const zEl=container.querySelector('#zReport');
      if(zEl && !zEl.checked){
        const el=modal(`<h3>Z-отчёт не отмечен</h3><p>Чтобы закрыть смену, отметьте галочку <b>«Z-отчёт распечатан, касса закрыта»</b>. Сначала закройте смену на кассе и распечатайте Z-отчёт.</p>
          <div class="actions"><button class="btn btn-primary" data-x>Понятно</button></div>`);
        try{ zEl.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){}
        return;
      }
      try{ await msgReady; }catch(e){}
      if(FORM_CHECKLIST.length){ openChecklistModal(FORM_CHECKLIST, function(res){ pendingChecklist=res; proceedClose(); }); return; }
      proceedClose();
    };
  }
  const reopenBtn=container.querySelector('#reopen');
  if(reopenBtn){
    reopenBtn.onclick=async()=>{
      if(shiftTransition) return;
      shiftTransition=true;
      reopenBtn.disabled=true;
      const oldStatus=data.status, oldClosedBy=data.closedBy, oldClosedByLogin=data.closedByLogin, oldClosedAt=data.closedAt;
      data.status='open'; data.closedBy=null; data.closedByLogin=null; data.closedAt=null;
      const rec=collectRec();
      rec.status='open'; rec.closedBy=null; rec.closedByLogin=null; rec.closedAt=null;
      try{
        await apiSaveReport(studio,date,rec);
        lastAutoSnap=stripVolatile(rec);
        toast('Смена открыта заново');
        if(onSaved) await onSaved();
        setTimeout(maybeApplyAppUpdate,0);
      }catch(e){
        data.status=oldStatus; data.closedBy=oldClosedBy; data.closedByLogin=oldClosedByLogin; data.closedAt=oldClosedAt;
        reopenBtn.disabled=false;
        handleErr(e);
      }finally{
        shiftTransition=false;
      }
    };
  }
  function valNum(id){const v=container.querySelector('#'+id).value;return v===''?null:num(v);}
  function valStr(id){return container.querySelector('#'+id).value.trim();}
  // ---- сообщения и чек-лист ----
  var pendingChecklist=null, FORM_CHECKLIST=[];
  var msgReady = apiGetSettings().then(function(s){
    var M=(s&&s.messages)||{};
    var cl=[]; if(M.checklist){ if(Array.isArray(M.checklist.all)) cl=cl.concat(M.checklist.all); if(M.checklist.byAdmin&&Array.isArray(M.checklist.byAdmin[session.login])) cl=cl.concat(M.checklist.byAdmin[session.login]); }
    FORM_CHECKLIST=cl.map(function(x){return (x||'').trim();}).filter(function(x,i,a){return x&&a.indexOf(x)===i;});
    return M;
  }).catch(function(){return {};});
  if(opts&&opts.own && (data.status!=='closed')){
    msgReady.then(function(M){
      var parts=[]; if(M.openMsg){ if(M.openMsg.all) parts.push(M.openMsg.all); if(M.openMsg.byAdmin&&M.openMsg.byAdmin[session.login]) parts.push(M.openMsg.byAdmin[session.login]); }
      parts=parts.filter(function(x){return x&&x.trim();});
      if(parts.length) modal(`<h3>📣 Сообщение</h3><p style="white-space:pre-wrap">${escapeHtml(parts.join('\n\n'))}</p><div class="actions"><button class="btn btn-primary" data-x>Понятно</button></div>`);
    });
  }
}

/* ================= Незакрытые смены: баннер + доводка ================= */
function isReportOpen(e){ return e && e.status!=='closed'; }
async function fillBanner(el, gotoEditor){
  let all; try{ all=await loadReports(); }catch(e){ el.innerHTML=''; return; }
  const t=todayStr();
  const open=all.filter(e=> e.date<t && e.status!=='closed');
  if(!open.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="banner fade-in">
    <div class="bt">⚠ Не закрыты смены (${open.length}) — доделайте отчёт конца дня</div>
    <div class="bi">${open.map(e=>`<button class="bchip" data-go="${e.studioId}|${e.date}">${fmtLong(e.date)} · ${studioName(e.studioId)}</button>`).join('')}</div>
  </div>`;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const p=b.dataset.go.split('|');gotoEditor(p[0],p[1]);});
}
async function openShiftEditor(body, studio, date, back, existingOverride){
  let existing=existingOverride||{};
  try{ if(!existingOverride)existing=await getEntry(studio,date)||{}; await loadReports(); }catch(e){}
  const prev=lastCashEndBefore(studio,date);
  const opts={prevCashEnd:prev?prev.cashEnd:null, prevDate:prev?prev.date:null};
  body.innerHTML=`<button class="btn btn-sm" id="backBtn" style="margin-bottom:14px">← Назад</button>
    <div class="section-title">Доделать смену · ${fmtLong(date)} · ${studioName(studio)}</div>
    <div id="feform"></div>`;
  body.querySelector('#backBtn').onclick=back;
  renderForm(body.querySelector('#feform'), studio, date, existing, ()=>back(), opts);
}

/* ================= History (read-only) ================= */
async function renderHistory(container,studio,dates,onChange){
  const entries=[];
  for(const d of dates){const e=await getEntry(studio,d);if(e)entries.push(e);}
  if(!entries.length){container.innerHTML=`<div class="empty">За этот период отчётов по студии нет.</div>`;return;}
  container.innerHTML=entries.map(e=>dayCard(e)).join('');
  wireDayCards(container,onChange);
}
function wireDayCards(container,onChange,source){
  container.querySelectorAll('.day-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
  container.querySelectorAll('[data-editmorning]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const p=btn.dataset.editmorning.split('|');
      const entry=(source||REPORTS||[]).find(x=>x.studioId===p[0]&&x.date===p[1]);
      if(entry) editMorningModal(entry,onChange); };
  });
  container.querySelectorAll('[data-delreport]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const p=btn.dataset.delreport.split('|');
      confirmModal(`Удалить отчёт за ${fmtLong(p[1])} (${studioAddr(p[0])})? Действие необратимо.`, async()=>{
        try{ await apiDeleteReport(p[0],p[1]); toast('Отчёт удалён'); onChange&&onChange(); }catch(e){ handleErr(e); }
      });
    };
  });
}
function editMorningModal(entry,onDone){
  const el=modal(`<h3>Наличные утром</h3><p>${studioAddr(entry.studioId)} · ${fmtLong(entry.date)}<br>Зафиксировал(а): ${escapeHtml(shortName(entry.filledBy||'—'))}</p>
    <div class="field"><div class="lbl">Сумма (${CUR})</div><input id="em" type="number" inputmode="decimal" step="0.01" value="${entry.cashStart??''}"/></div>
    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn btn-primary" id="em-ok">Сохранить</button></div>`);
  el.querySelector('#em-ok').onclick=async()=>{
    const v=el.querySelector('#em').value; const nv=v===''?null:num(v);
    const upd=Object.assign({},entry,{cashStart:nv,cashStartEditedBy:session.name,cashStartEditedByLogin:session.login,cashStartEditedAt:new Date().toISOString(),lastEditedBy:session.name,lastEditedByLogin:session.login,lastEditedAt:new Date().toISOString()});
    try{ await apiSaveReport(entry.studioId,entry.date,upd); closeModal(el); toast('Наличные утром обновлены'); onDone&&onDone(); }

function dayCard(e,open,source){
  const inSum=(e.changes||[]).filter(c=>c.type==='in').reduce((s,c)=>s+num(c.amount),0);
  const outSum=(e.changes||[]).filter(c=>c.type!=='in').reduce((s,c)=>s+num(c.amount),0);
  const expected=num(e.cashStart)+inSum-outSum;
  const diff=e.cashEnd==null?null:num(e.cashEnd)-expected;
  const prevInfo=lastCashEndBefore(e.studioId,e.date,source);
  const inter=(prevInfo&&e.cashStart!=null)?num(e.cashStart)-prevInfo.cashEnd:null;
  const came=e.newCame??e.newCount??null;
  const bought=e.newBought!=null?e.newBought:(Array.isArray(e.newList)?e.newList.filter(x=>x.bought).length:null);
  const endedC=e.ended??null, renewC=e.renewed??e.oldCount??null;
  const notRen=(endedC!=null&&renewC!=null)?Math.max(0,endedC-renewC):null;
  const newDetail=(e.newList||[]).map((c,i)=>`<div style="font-size:13px;padding:2px 0">${i+1}. ${escapeHtml(c.note||'—')} ${c.bought?'<b style="color:var(--gold)">· абонемент ✓</b>':'<span style="color:var(--ink-faint)">· без абонемента</span>'}</div>`).join('');
  const nrDetail=(e.notRenewList||[]).map((c,i)=>`<div style="font-size:13px;padding:2px 0">${i+1}. ${escapeHtml(c.note||'—')}</div>`).join('');
  const changeList=(e.changes||[]).map(c=>`<div style="font-size:13px;padding:2px 0"><b style="color:${c.type==='in'?'var(--gold)':'var(--clay)'}">${c.type==='in'?'+':'−'} ${money(c.amount)}</b><span style="color:var(--ink-soft)"> — ${escapeHtml(c.comment||'без комментария')}</span></div>`).join('')||'<span style="color:var(--ink-faint);font-size:13px">движений нет</span>';
  return `<div class="day${open?' open':''}">
    <div class="day-head"><span class="chev">▸</span>
