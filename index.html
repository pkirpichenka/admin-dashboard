<!--
  Дашборд администратора сети студий растяжки (Минск) — прототип
  Студии: Машерова 11 · Куйбышева 22 · Толбухина 2
  Роли: Руководитель (полный доступ + управление доступом) /
        Старший администратор (полный доступ к отчётам) / Администратор (смена)
  Учётные записи с паролями; регистрация и отзыв доступа — только у руководителя.
  Валюта: BYN (Br). Записи сохраняются между сессиями, выгрузка лога в Excel.
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap');

:root{
  --bg:#E7ECE6; --surface:#FFFFFF; --surface-2:#F3F6F2;
  --ink:#17261F; --ink-soft:#5C6E64; --ink-faint:#8A998F;
  --accent:#2E7D5B; --accent-deep:#1E5C41;
  --gold:#C58A2E; --gold-soft:#F6EAD2;
  --clay:#C05038; --clay-soft:#F7E1DA;
  --line:#D5DED6; --line-strong:#BCC8BD;
  --radius:14px; --shadow:0 1px 2px rgba(23,38,31,.06), 0 8px 24px rgba(23,38,31,.06);
  --fx:250ms cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box} html,body{margin:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%, rgba(46,125,91,.10), transparent 60%), var(--bg);
  color:var(--ink); font-family:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh;
}
.wrap{max-width:1000px;margin:0 auto;padding:22px 20px 80px}

/* Header */
.top{display:flex;align-items:center;gap:14px;padding:16px 20px;margin:22px auto 0;max-width:1000px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.mark{width:42px;height:42px;border-radius:12px;flex:0 0 auto;background:linear-gradient(150deg,var(--accent),var(--accent-deep));
  display:grid;place-items:center;color:#fff}
.mark svg{width:24px;height:24px}
.brand{line-height:1.15}
.brand .name{font-family:'Unbounded';font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--ink-faint);letter-spacing:.3px;text-transform:uppercase}
.top .spacer{flex:1}
.who{text-align:right;line-height:1.25}
.who .fio{font-weight:600;font-size:14px}
.who .role{font-size:12px;color:var(--ink-soft)}
.role-pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px}
.role-admin{background:var(--surface-2);color:var(--accent-deep)}
.role-boss{background:var(--gold-soft);color:var(--gold)}

button{font-family:inherit;cursor:pointer}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;
  font-size:14px;font-weight:600;transition:var(--fx)}
.btn:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:8px 10px}
.btn-ghost:hover{color:var(--clay);background:var(--clay-soft)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
.card-head .idx{font-family:'Unbounded';font-weight:700;font-size:13px;color:var(--accent);width:26px;height:26px;
  border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.card-head h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
.card-head .hint{margin-left:auto;font-size:12px;color:var(--ink-faint)}
.card-body{padding:18px 20px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
label.field{display:block}
.field .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;letter-spacing:.2px}
.field .lbl small{color:var(--ink-faint);font-weight:500}
input,textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:var(--fx)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(46,125,91,.14)}
input[type="number"]{font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:52px;line-height:1.45}
.cur{position:relative}
.cur input{padding-right:38px}
.cur .sym{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-weight:600;pointer-events:none;font-size:13px}

.tape{background:linear-gradient(180deg,#fff, var(--surface-2));border:1px dashed var(--line-strong);border-radius:12px;
  padding:14px 16px;margin-bottom:16px;display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.tape .seg{display:flex;flex-direction:column;gap:2px;padding:4px 10px;min-width:110px}
.tape .seg .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.4px}
.tape .seg .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.tape .op{align-self:center;color:var(--ink-faint);font-size:18px;font-weight:700}
.tape .seg.in .v{color:var(--gold)} .tape .seg.out .v{color:var(--clay)}
.tape .seg.exp{margin-left:auto;text-align:right;border-left:1px solid var(--line);padding-left:16px}
.tape .seg.exp .v{color:var(--accent-deep)}
.diff-chip{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.diff-ok{background:var(--surface-2);color:var(--accent)} .diff-bad{background:var(--clay-soft);color:var(--clay)}

.chg{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.chg select{width:130px;flex:0 0 auto} .chg .amt{width:150px;flex:0 0 auto} .chg .cmt{flex:1} .chg .x{flex:0 0 auto}
.add-row{display:inline-flex;align-items:center;gap:6px;margin-top:2px}

/* Clients dynamic */
.cl-block{margin-bottom:4px}
.cl-sep{border:none;border-top:1px solid var(--line);margin:20px 0}
.cl-row2{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.cl-row2 .field{flex:1 1 170px;max-width:230px}
.cl-badge{font-size:13px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-weight:600;white-space:nowrap;margin-bottom:1px}
.cl-badge b{color:var(--accent-deep);font-variant-numeric:tabular-nums}
.cl-badge.warn{background:var(--clay-soft);border-color:var(--clay-soft)} .cl-badge.warn b{color:var(--clay)}
.cl-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cl-list:empty{margin-top:0}
.cl-item{display:flex;align-items:center;gap:8px}
.cl-item .ix{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--surface-2);color:var(--ink-soft);
  font-size:12px;font-weight:700;display:grid;place-items:center}
.cl-item .cl-note{flex:1}
.cl-toggle{flex:0 0 auto;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-soft);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:var(--fx);white-space:nowrap}
.cl-toggle:hover{border-color:var(--gold)}
.cl-toggle.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.cl-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:var(--fx)}
.cl-toggle.on .dot{background:var(--gold)}
@media (max-width:640px){.cl-item .cl-toggle{padding:8px 10px}.cl-row2 .field{max-width:none}}

/* Morning cash compare + locks */
.fix-row{display:flex;gap:8px;align-items:stretch}
.fix-row .cur input{height:100%}
.fix-btn{flex:0 0 auto;white-space:nowrap}
.banner{background:var(--clay-soft);border:1px solid #E8B7AC;border-radius:12px;padding:12px 14px;margin-bottom:18px}
.banner .bt{font-weight:700;color:var(--clay);font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.banner .bi{display:flex;flex-wrap:wrap;gap:8px}
.banner .bchip{background:#fff;border:1px solid #E8B7AC;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--fx)}
.banner .bchip:hover{background:var(--clay);color:#fff;border-color:var(--clay)}
.closed-badge{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;align-self:center}
.stat{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.stat-closed{background:var(--surface-2);color:var(--accent)}
.stat-open{background:var(--clay-soft);color:var(--clay)}
.mcmp{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.mcmp-k{color:var(--ink-faint)}
.mcmp .mok{color:var(--accent)} .mcmp .mbad{color:var(--clay)}
.lockchip{font-size:11px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:1px 8px;border-radius:999px;margin-left:4px}
.hintline{font-size:12px;color:var(--ink-faint)}
.sdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline;flex:0 0 auto}
.ent{color:var(--ink-faint);font-weight:600;font-size:10.5px}
input[readonly]{background:#EFF2EE;color:var(--ink-soft);cursor:not-allowed}

/* History */
.day{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.day-head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:var(--fx)}
.day-head:hover{background:var(--surface-2)}
.day-date{font-weight:700;font-size:14px}
.day-date .dow{color:var(--ink-faint);font-weight:500;font-size:12px;margin-left:6px}
.st-tag{font-size:11px;font-weight:700;color:var(--accent-deep);background:var(--surface-2);border:1px solid var(--line);
  padding:2px 9px;border-radius:999px}
.day-by{margin-left:auto;font-size:12px;color:var(--ink-soft);text-align:right}
.day-by b{color:var(--ink);font-weight:600}
.chev{transition:transform var(--fx);color:var(--ink-faint)}
.day.open .chev{transform:rotate(90deg)}
.day-body{display:none;padding:4px 16px 16px;border-top:1px solid var(--line)}
.day.open .day-body{display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:10px 0}
.kv .item .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px}
.kv .item .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.notes{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.notes .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.empty{text-align:center;color:var(--ink-faint);padding:30px 16px;font-size:14px;border:1px dashed var(--line-strong);
  border-radius:12px;background:var(--surface-2)}

/* Tabs / studios / bar */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;
  margin-bottom:22px;box-shadow:var(--shadow);width:fit-content;max-width:100%;flex-wrap:wrap}
.tab{border:none;background:transparent;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-soft);transition:var(--fx)}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);box-shadow:0 10px 20px -16px rgba(31,42,36,.4)}
.topbar .top{margin-top:14px}
.tabsrow{max-width:1000px;margin:14px auto 0;padding:0 20px 14px}
.tabsrow .tabs{margin-bottom:0}
.tab:hover{color:var(--ink)} .tab.on{background:var(--accent);color:#fff}
.studios{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.st-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;text-align:left;
  cursor:pointer;transition:var(--fx);min-width:150px}
.st-btn:hover{border-color:var(--line-strong)}
.st-btn.on{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(46,125,91,.12)}
.st-btn.sched-hl{box-shadow:0 0 0 2px rgba(46,125,91,.35)}
.st-today{font-size:10px;font-weight:700;color:var(--accent-deep);background:var(--surface-2);padding:1px 7px;border-radius:999px;margin-left:4px}
.st-btn .t{font-weight:700;font-size:13px} .st-btn .a{font-size:12px;color:var(--ink-faint)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar .grow{flex:1}
.datepick{display:flex;align-items:center;gap:8px}
.datepick .lbl{margin:0;color:var(--ink-soft);font-weight:600;font-size:13px}
.section-title{font-family:'Unbounded';font-weight:600;font-size:14px;color:var(--ink-soft);letter-spacing:.4px;
  text-transform:uppercase;margin:26px 2px 12px}

/* User management */
.urow{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;
  margin-bottom:10px;background:var(--surface);flex-wrap:wrap;box-shadow:var(--shadow)}
.u-main{min-width:150px}
.u-name{font-weight:700;display:flex;align-items:center;gap:8px}
.u-login{font-size:12.5px;color:var(--ink-faint)}
.u-ctl{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
.ctl-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);font-weight:600}
.st-pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.st-on{background:var(--surface-2);color:var(--accent)} .st-off{background:var(--clay-soft);color:var(--clay)}
.badge-senior{background:var(--gold-soft);color:var(--gold);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;
  transition:var(--fx);border:none;flex:0 0 auto;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:var(--fx)}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(18px)}

/* Login / setup / modal */
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:30px 28px}
.login .mark{width:52px;height:52px;margin-bottom:16px}
.login h1{font-family:'Unbounded';font-weight:700;font-size:20px;margin:0 0 4px}
.login p.lead{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px}
.overlay{position:fixed;inset:0;background:rgba(23,38,31,.42);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:100%;max-width:390px;padding:24px}
.modal h3{margin:0 0 4px;font-family:'Unbounded';font-size:17px}
.modal p{margin:0 0 16px;color:var(--ink-soft);font-size:13.5px}
.modal .field{margin-bottom:12px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:500}
.chk input{width:auto}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;
  pointer-events:none;transition:var(--fx);z-index:80;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)} .toast.err{background:var(--clay)}
.hidden{display:none !important}
.fade-in{animation:fade var(--fx) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}
  .chg{flex-wrap:wrap}.chg select,.chg .amt{width:calc(50% - 4px)}.chg .cmt{width:100%}
  .tape .seg.exp{margin-left:0}}

/* Итоги за день */
.daysum{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.ds-title{font-family:'Unbounded';font-weight:600;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px}
.ds-grid{display:flex;flex-wrap:wrap;gap:10px 20px;margin-bottom:8px}
.ds-grid:last-child{margin-bottom:0}
.ds-grid > div{display:flex;flex-direction:column;gap:1px}
.ds-grid span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.3px}
.ds-grid b{font-size:15px;font-variant-numeric:tabular-nums}
.ds-tot b{color:var(--accent-deep)}
.miss-row{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.cashnow{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.cn-title{font-family:'Unbounded';font-weight:600;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px}
.cn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cn-item{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cn-name{font-size:12.5px;font-weight:600;margin-bottom:2px}
.cn-val{font-family:'Unbounded';font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.cn-note{font-size:10.5px;color:var(--ink-faint);margin-top:2px;line-height:1.3}
.cn-note.stale{color:var(--gold)}
.cn-item.cn-shift{border-left:4px solid var(--accent)}
.cn-line{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-top:5px}
.cn-line:first-of-type{margin-top:2px}
.cn-ln.muted{color:var(--ink-faint);font-weight:500}
.hire-lbl{font-size:11px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:4px}
.btn.icon-only{padding:6px 10px;line-height:0}

<script>
/* ================= Studios & currency ================= */
const STUDIOS = [
  {id:'masherova',  name:'Машерова',  address:'Машерова, 11', entity:'ООО', start:'09:30', end:'21:30', color:'#2F6FB5'},
  {id:'kuibysheva', name:'Куйбышева', address:'Куйбышева, 22', entity:'ООО', start:'16:30', end:'22:00', color:'#E6A700'},
  {id:'tolbuhina',  name:'Толбухина', address:'Толбухина, 2',  entity:'ИП', start:'09:30', end:'21:30', color:'#E2711D'}
];
const SMAP = Object.fromEntries(STUDIOS.map(s=>[s.id,s]));
const studioName = id => SMAP[id]?SMAP[id].name:(id||'—');
const studioColor = id => (SMAP[id]&&SMAP[id].color)||'#8A998F';
const sdot = id => `<span class="sdot" style="background:${studioColor(id)}"></span>`;
const studioEntity = id => (SMAP[id]&&SMAP[id].entity)||'';
const studioTag = id => `${sdot(id)}${studioName(id)}`;
const studioAddr = id => SMAP[id]?SMAP[id].address:(id||'—');
const CUR = 'BYN'; // белорусский рубль
const APP_VERSION = '02.08.2026-r'; try{ console.log('FAD version', APP_VERSION); }catch(e){}  // метка версии — видна в шапке, помогает проверить деплой

/* ================= Подключение к Supabase =================
   Вставьте два значения из Supabase: Project Settings → API.
   Больше в этом файле менять ничего не нужно. */
const SUPABASE_URL      = 'https://llashpaqgeeezacyjppd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsYXNocGFxZ2VlZXphY3lqcHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODgyOTksImV4cCI6MjEwMTA2NDI5OX0.mG5cGRIOyTnqcRUJ3OlOIOrxxdCfAByts69KHdj2Ks0';

const CONFIGURED = !/ВСТАВЬТЕ/.test(SUPABASE_URL) && !/ВСТАВЬТЕ/.test(SUPABASE_ANON_KEY);
const sb = (CONFIGURED && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let TOKEN = null;

async function rpc(fn, args){
  const {data, error} = await sb.rpc(fn, args || {});
  if(error) throw error;
  return data;
}
function handleErr(e){
  const msg = (e && e.message) ? e.message : String(e);
  if(/forbidden/i.test(msg)){ toast('Сессия истекла — войдите снова', true); doLogout(); return; }
  toast('Ошибка: ' + msg, true);
}
function saveSession(s){
  TOKEN = s.token;
  session = {login:s.login, name:s.name, role:s.role, senior:s.senior, canEdit:!!s.canEdit, home:s.home||null};
  try{ sessionStorage.setItem('sess', JSON.stringify(s)); }catch(e){}
}
async function doLogout(){
  try{ if(TOKEN) await rpc('app_logout', {p_token:TOKEN}); }catch(e){}
  TOKEN = null; session = null; REPORTS = null;
  try{ sessionStorage.removeItem('sess'); }catch(e){}
  boot();
}

/* ---- Отчёты: кэш + доступ, которым пользуется остальной код ---- */
let REPORTS = null;
async function loadReports(force){
  if(REPORTS === null || force){ REPORTS = await rpc('app_list_reports', {p_token:TOKEN}) || []; }
  return REPORTS;
}
async function getEntry(studio, date){
  const all = await loadReports();
  return all.find(e => e.studioId === studio && e.date === date) || null;
}
function lastCashEndBefore(studio, before){
  const all = REPORTS || [];
  const c = all.filter(e => e.studioId===studio && e.date < before && e.cashEnd!=null)
               .sort((a,b)=> a.date<b.date?1:-1);
  return c.length ? {date:c[0].date, cashEnd:num(c[0].cashEnd)} : null;
}
async function apiSaveReport(studio, date, payload){
  const r = await rpc('app_save_report', {p_token:TOKEN, p_studio:studio, p_date:date, p_payload:payload});
  // обновляем кэш на месте — значения сразу доступны при перерисовке, без round-trip
  if(Array.isArray(REPORTS)){
    const i=REPORTS.findIndex(e=>e.studioId===studio && e.date===date);
    const copy=JSON.parse(JSON.stringify(payload));
    if(i>=0) REPORTS[i]=copy; else REPORTS.unshift(copy);
  }
  return r;
}
async function apiDeleteReport(studio, date){
  const r = await rpc('app_delete_report', {p_token:TOKEN, p_studio:studio, p_date:date});
  REPORTS = null;
  return r;
}
async function apiListTeam(){ return await rpc('app_list_team',{p_token:TOKEN})||[]; }
async function apiSetHome(login,home){ return await rpc('app_set_home',{p_token:TOKEN,p_login:login,p_home:home||''}); }
async function apiSetHire(login,hire){ return await rpc('app_set_hire',{p_token:TOKEN,p_login:login,p_hire:hire||''}); }

/* ================= Format helpers ================= */
const DOW=['вс','пн','вт','ср','чт','пт','сб'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function todayStr(){const d=new Date();const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10);}
function fmtLong(iso){const [y,m,dd]=iso.split('-').map(Number);return dd+' '+MON[m-1]+' '+y;}
function fmtDow(iso){const [y,m,dd]=iso.split('-').map(Number);return DOW[new Date(y,m-1,dd).getDay()];}
function money(n){if(n===''||n===null||n===undefined||isNaN(n))return '—';return Number(n).toLocaleString('ru-RU')+' '+CUR;}
function pct(a,b){a=(a===''||a==null)?null:Number(a);b=(b===''||b==null)?null:Number(b);if(b==null||b===0||a==null||isNaN(a)||isNaN(b))return '—';return Math.round(a/b*100)+'%';}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n;}
function prevDays(iso,count){const [y,m,dd]=iso.split('-').map(Number);const out=[];
  for(let i=1;i<=count;i++){const d=new Date(y,m-1,dd-i);const o=d.getTimezoneOffset();out.push(new Date(d.getTime()-o*60000).toISOString().slice(0,10));}return out;}
function fmtTime(iso){if(!iso)return '';return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortName(name){const p=String(name||'').trim().split(/\s+/).filter(Boolean); if(p.length<=1) return p[0]||''; return p[0]+' '+p.slice(1).map(w=>w[0]?w[0].toUpperCase()+'.':'').join('');}

/* ================= Toast & modal ================= */
let toastT;
function toast(msg,err){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',2600);}
function modal(inner){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal fade-in">'+inner+'</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal(ov);});
  ov.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>closeModal(ov));
  return ov;
}
function closeModal(ov){ov.remove();}

/* ================= Boot ================= */
async function boot(){
  session=null;
  if(!CONFIGURED){ renderConfigError(); return; }
  if(!sb){ renderConfigError({message:'Не загрузилась библиотека Supabase — проверьте интернет или блокировщик рекламы.'}); return; }
  // попытка восстановить сессию после обновления страницы
  let saved=null; try{ saved=JSON.parse(sessionStorage.getItem('sess')); }catch(e){}
  if(saved && saved.token){
    TOKEN=saved.token; session={login:saved.login,name:saved.name,role:saved.role,senior:saved.senior,canEdit:!!saved.canEdit,home:saved.home||null};
    try{ await loadReports(true); renderApp(); return; }
    catch(e){ TOKEN=null; session=null; try{sessionStorage.removeItem('sess');}catch(_){} }
  }
  let needs;
  try{ needs=await rpc('app_needs_setup', {}); }
  catch(e){ renderConfigError(e); return; }
  if(needs) renderSetup(); else renderLogin();
}
function renderConfigError(e){
  const root=document.getElementById('root');
  root.innerHTML=`<div class="login-shell"><div class="login fade-in">
    <div class="mark">${LEAF}</div><h1>Подключите базу данных</h1>
    <p class="lead">Откройте файл index.html и вставьте два значения из Supabase (Project Settings → API): <b>Project URL</b> и <b>anon public key</b>. Затем сохраните и обновите страницу.${e?'<br><br>Сообщение: '+escapeHtml((e&&e.message)||String(e)):''}</p>
  </div></div>`;
}

function renderLogin(){

    <h1>Flexico-Admin-Dashboard</h1>

  </div></div>`;
  const go=async()=>{
    const login=root.querySelector('#l-login').value.trim().toLowerCase();
    const pass=root.querySelector('#l-pass').value;
    if(!login||!pass){toast('Введите логин и пароль',true);return;}
    try{
      const res=await rpc('app_login', {p_login:login, p_password:pass});
      if(!res){ toast('Неверный логин или пароль',true); return; }

function renderApp(){
  if(session.role==='owner') renderRoleUI([{label:'Отчёты',render:renderAllReports},{label:'Расписание',render:renderSchedule},{label:'Администраторы',render:renderUsers}]);

function renderRoleUI(tabs){
  const root=document.getElementById('root');
  root.innerHTML=`<div class="topbar">${header()}${tabs.length>1?`<div class="tabsrow"><div class="tabs">${tabs.map((t,i)=>`<button class="tab${i===0?' on':''}" data-i="${i}">${t.label}</button>`).join('')}</div></div>`:''}</div><div class="wrap"><div id="tabbody"></div></div>`;
  root.querySelector('#logout').onclick=()=>doLogout();
  const _rb=root.querySelector('#refreshBtn'); if(_rb) _rb.onclick=()=>location.reload();
  const body=root.querySelector('#tabbody');
  function show(i){root.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));tabs[i].render(body);}
  root.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(+b.dataset.i));
  show(0);
}

/* ================= Shift view (admin fills) ================= */
async function renderShift(body){
  const today=todayStr();
  let sched=null; try{ const _d=new Date(); sched=await apiGetSchedule(monthKey(_d.getFullYear(),_d.getMonth())); }catch(e){}
  let myToday=null;
  if(sched&&sched.assignments){ for(const s of STUDIOS){ const r=sched.assignments[today+'_'+s.id]; if(r&&!r.closed&&(r.shifts||[]).some(x=>x.adminId===session.login)){ myToday=s.id; break; } } }
  if(!shiftStudio && myToday) shiftStudio=myToday;
  body.innerHTML=`
    <div id="banner"></div>
    <div class="section-title">Смена · ${fmtLong(today)} · ${fmtDow(today)}</div>
    <div class="studios" id="studios">${STUDIOS.map(s=>`
      <button class="st-btn${s.id===shiftStudio?' on':''}${s.id===myToday?' sched-hl':''}" data-id="${s.id}" style="border-left:4px solid ${s.color}">
        <div class="t">${s.name}${s.id===myToday?' <span class="st-today">вы сегодня здесь</span>':''}</div><div class="a">${s.address}</div></button>`).join('')}</div>
    <div id="shiftbody"></div>`;
  fillBanner(body.querySelector('#banner'), (s,d)=>openShiftEditor(body,s,d,()=>renderShift(body)));
  body.querySelectorAll('.st-btn').forEach(b=>b.onclick=()=>{shiftStudio=b.dataset.id;renderShift(body);});
  const sb=body.querySelector('#shiftbody');
  if(!shiftStudio){sb.innerHTML=`<div class="empty">Выберите студию, в которой вы сегодня работаете.</div>`;return;}
  const existing=await getEntry(shiftStudio,today)||{};
  await loadReports();
  const prev=lastCashEndBefore(shiftStudio, today);
  const opts={prevCashEnd:prev?prev.cashEnd:null, prevDate:prev?prev.date:null};
  sb.innerHTML=`<div id="form"></div>
    <div class="section-title">Предыдущие 3 дня · ${studioName(shiftStudio)}</div>
    <div id="history"></div>`;
  renderForm(sb.querySelector('#form'),shiftStudio,today,existing,()=>renderShift(body),opts);
  renderHistory(sb.querySelector('#history'),shiftStudio,prevDays(today,3),()=>renderShift(body));
}

          Изменения наличных в течение дня <small style="color:var(--ink-faint);font-weight:500"> — выдано / внесено</small></div>

  function updateMorning(){
    const prev=opts.prevCashEnd, pdate=opts.prevDate;
    if(prev==null){ morningCmp.innerHTML='<span class="mcmp-k">Прошлый остаток на конец:</span> нет прежних данных по этому филиалу'; if(interWrap)interWrap.style.display='none'; return; }
    const sv=container.querySelector('#cashStart').value;
    const has=sv!==''&&!isNaN(parseFloat(sv));
    const d=has?(num(sv)-prev):null;
    morningCmp.innerHTML=`<span class="mcmp-k">Остаток на конец ${pdate?fmtLong(pdate):'прошлого дня'}:</span> <b>${money(prev)}</b>`+

    changesBox.querySelectorAll('.chg').forEach(row=>{const i=+row.dataset.i;
      row.querySelector('.ctype').onchange=e=>{changes[i].type=e.target.value;drawTape();};
      row.querySelector('.camt').oninput=e=>{changes[i].amount=e.target.value;drawTape();};
      row.querySelector('.ccmt').oninput=e=>{changes[i].comment=e.target.value;};
      row.querySelector('.x').onclick=()=>{changes.splice(i,1);drawChanges();drawTape();};});
  }
  container.querySelector('#addChg').onclick=()=>{changes.push({type:'out',amount:'',comment:''});drawChanges();drawTape();};

  const tape=container.querySelector('#tape');
  function drawTape(){
    const start=num(container.querySelector('#cashStart').value);
    const end=container.querySelector('#cashEnd').value;
    const inSum=changes.filter(c=>c.type==='in').reduce((s,c)=>s+num(c.amount),0);
    const outSum=changes.filter(c=>c.type!=='in').reduce((s,c)=>s+num(c.amount),0);

    const dayCash=hasEnd?(num(end)-start-inSum+outSum):null; // выручка наличными за день
    tape.innerHTML=`
      <div class="seg"><span class="k">Утро</span><span class="v">${money(start)}</span></div>
      <div class="op">+</div><div class="seg in"><span class="k">Внесено</span><span class="v">${money(inSum)}</span></div>
      <div class="op">−</div><div class="seg out"><span class="k">Изъято</span><span class="v">${money(outSum)}</span></div>
      <div class="op">→</div><div class="seg"><span class="k">Вечер (факт)</span><span class="v">${hasEnd?money(num(end)):'—'}</span></div>
      <div class="seg exp"><span class="k">Наличными за день</span><span class="v">${dayCash===null?'—':(dayCash>=0?'+':'')+money(dayCash)}</span>
        ${dayCash===null?'<span class="diff-chip diff-ok">введите остаток на конец дня</span>':dayCash>=0?'<span class="diff-chip diff-ok">пришло за день</span>':'<span class="diff-chip diff-bad">недостача</span>'}</div>`;
  }
  ['cashStart','cashEnd'].forEach(id=>container.querySelector('#'+id).addEventListener('input',drawTape));
  drawChanges(); drawTape();

  // new clients
  const newListBox=container.querySelector('#newList'),cameInput=container.querySelector('#newCame'),
        boughtEl=container.querySelector('#boughtCount'),cameEl=container.querySelector('#cameCount');
  function updBought(){const m=newList.filter(x=>x.bought).length;boughtEl.textContent=m;cameEl.textContent=newList.length;const cv=container.querySelector("#newConvBadge");if(cv)cv.textContent=pct(m,newList.length);}
  function drawNewList(){
    newListBox.innerHTML=newList.map((c,i)=>`
      <div class="cl-item" data-i="${i}"><span class="ix">${i+1}</span>
        <input class="cl-note" value="${c.note?escapeHtml(c.note):''}" placeholder="Имя, что купил, откуда узнал…"/>
        <button type="button" class="cl-toggle${c.bought?' on':''}"><span class="dot"></span>абонемент</button></div>`).join('');
    newListBox.querySelectorAll('.cl-item').forEach(row=>{const i=+row.dataset.i;
      row.querySelector('.cl-note').oninput=e=>{newList[i].note=e.target.value;};
      row.querySelector('.cl-toggle').onclick=ev=>{newList[i].bought=!newList[i].bought;ev.currentTarget.classList.toggle('on',newList[i].bought);updBought();};});
    updBought();
  }
  function syncNew(){const n=Math.max(0,Math.min(60,Math.floor(num(cameInput.value))));
    while(newList.length<n)newList.push({note:'',bought:false}); if(newList.length>n)newList.length=n; drawNewList();}
  cameInput.addEventListener('input',syncNew); drawNewList();

  // old clients (non-renewers)
  const nrBox=container.querySelector('#notRenewList'),endedIn=container.querySelector('#ended'),
        renewIn=container.querySelector('#renewed'),nrCntEl=container.querySelector('#notRenewCount'),nrBadge=container.querySelector('#nrBadge');
  function drawNrList(){
    nrBox.innerHTML=notRenewList.map((c,i)=>`
      <div class="cl-item" data-i="${i}"><span class="ix">${i+1}</span>
        <input class="cl-note" value="${c.note?escapeHtml(c.note):''}" placeholder="Кто не продлил — имя, причина, что предложили…"/></div>`).join('');
    nrBox.querySelectorAll('.cl-item').forEach(row=>{const i=+row.dataset.i;
      row.querySelector('.cl-note').oninput=e=>{notRenewList[i].note=e.target.value;};});
  }
  function syncNr(){const t=Math.max(0,Math.floor(num(endedIn.value))),r=Math.max(0,Math.floor(num(renewIn.value)));
    const nr=Math.max(0,Math.min(60,t-r));
    while(notRenewList.length<nr)notRenewList.push({note:''}); if(notRenewList.length>nr)notRenewList.length=nr;
    nrCntEl.textContent=nr; nrBadge.classList.toggle('warn',nr>0);
    const rc=container.querySelector('#renewConvBadge'); if(rc) rc.textContent=pct(r,t);
    drawNrList();}
  endedIn.addEventListener('input',syncNr); renewIn.addEventListener('input',syncNr); syncNr();

  // сбор данных формы в объект отчёта
  function collectRec(){
    return {
      studioId:studio, date,
      cashStart:valNum('cashStart'), cashEnd:valNum('cashEnd'),
      changes:changes.filter(c=>c.amount!==''&&!isNaN(parseFloat(c.amount))).map(c=>({type:c.type,amount:num(c.amount),comment:(c.comment||'').trim()})),
      cashless:valNum('cashless'), allsports:valNum('allsports'), epos:valNum('epos'),
      newCame:valNum('newCame'), newBought:newList.filter(x=>x.bought).length,
      newList:newList.map(x=>({note:(x.note||'').trim(),bought:!!x.bought})),
      ended:valNum('ended'), renewed:valNum('renewed'),
      notRenewList:notRenewList.map(x=>({note:(x.note||'').trim()})),
      comments:valStr('comments'), interNote:valStr('interNote'), zReport:!!(container.querySelector('#zReport')&&container.querySelector('#zReport').checked),
      status:data.status||'open', closedBy:data.closedBy, closedByLogin:data.closedByLogin, closedAt:data.closedAt,
      cashStartEditedBy:data.cashStartEditedBy, cashStartEditedAt:data.cashStartEditedAt,
      filledBy:data.filledBy||session.name, filledByLogin:data.filledByLogin||session.login,
      lastEditedBy:session.name, lastEditedAt:new Date().toISOString(),
      submittedAt:data.submittedAt||new Date().toISOString()
    };
  }

  // Зафиксировать наличные на начало дня (сохраняет отчёт и блокирует поле)
  const fixBtn=container.querySelector('#fixMorning');
  if(fixBtn){
    fixBtn.onclick=async()=>{
      if(valNum('cashStart')==null){ toast('Сначала введите сумму наличных',true); return; }
      try{ await apiSaveReport(studio,date,collectRec()); toast('Наличные на начало дня зафиксированы'); onSaved&&onSaved(); }
      catch(e){ handleErr(e); }
    };
  }

  // save (черновик — статус не меняется)
  container.querySelector('#save').onclick=async()=>{
    const rec=collectRec();
    try{await apiSaveReport(studio,date,rec);toast(data.filledBy?'Отчёт обновлён':'Отчёт сохранён · '+session.name);onSaved&&onSaved();}
    catch(e){toast('Не удалось сохранить',true);}
  };

  // Закрыть смену — требует все финансовые поля + клиентов
  // поля, которые при пустом значении можно «считать нулём» одним нажатием
  const ZEROABLE=[['cashEnd','наличные на конец дня'],['cashless','картой'],['allsports','QR'],['epos','EPOS'],['newCame','пришло новых'],['ended','закончились абонементы'],['renewed','продлили']];
  async function doClose(){
    const rec=collectRec(); rec.status='closed'; rec.closedBy=session.name; rec.closedByLogin=session.login; rec.closedAt=new Date().toISOString();
    try{ await apiSaveReport(studio,date,rec); toast('Смена закрыта'); onSaved&&onSaved(); }catch(e){ handleErr(e); }
  }
  function proceedClose(){
    const empties=ZEROABLE.filter(f=>valNum(f[0])==null);
    if(empties.length){
      const el=modal(`<h3>Закрыть смену</h3><p>Не заполнены поля: <b>${empties.map(f=>f[1]).join(', ')}</b>.<br>Если по ним данных нет — их можно считать нулём.</p>
        <div class="actions"><button class="btn" data-x>Заполнить вручную</button><button class="btn btn-primary" id="zc">Считать нулём и закрыть</button></div>`);
      el.querySelector('#zc').onclick=async()=>{ empties.forEach(f=>{const inp=container.querySelector('#'+f[0]); if(inp) inp.value='0';}); closeModal(el); await doClose(); };
      return;
    }
    doClose();
  }
  const closeBtn=container.querySelector('#closeShift');
  if(closeBtn){
    closeBtn.onclick=()=>{
      if(valNum('cashStart')==null){ toast('Сначала зафиксируйте наличные на начало дня',true); return; }
      const zEl=container.querySelector('#zReport');
      if(zEl && !zEl.checked){
        const el=modal(`<h3>Z-отчёт</h3><p>Не отмечено, что <b>Z-отчёт распечатан и касса закрыта</b>. Пожалуйста, закройте смену на кассе и распечатайте Z-отчёт.</p>
          <div class="actions" style="flex-direction:column;align-items:stretch;gap:8px">
            <button class="btn btn-primary" id="zRepYes">Z-отчёт распечатан — продолжить</button>
            <button class="btn" data-x>Отмена</button></div>`);
        el.querySelector('#zRepYes').onclick=()=>{ zEl.checked=true; closeModal(el); proceedClose(); };
        return;
      }
      proceedClose();
    };
  }
  const reopenBtn=container.querySelector('#reopen');
  if(reopenBtn){
    reopenBtn.onclick=async()=>{
      const rec=collectRec(); rec.status='open'; rec.closedBy=null; rec.closedByLogin=null; rec.closedAt=null;
      try{ await apiSaveReport(studio,date,rec); toast('Смена открыта заново'); onSaved&&onSaved(); }catch(e){ handleErr(e); }
    };
  }
  function valNum(id){const v=container.querySelector('#'+id).value;return v===''?null:num(v);}
  function valStr(id){return container.querySelector('#'+id).value.trim();}
}

/* ================= Незакрытые смены: баннер + доводка ================= */
function isReportOpen(e){ return e && e.status!=='closed'; }
async function fillBanner(el, gotoEditor){
  let all; try{ all=await loadReports(); }catch(e){ el.innerHTML=''; return; }
  const t=todayStr();
  const open=all.filter(e=> e.date<t && e.status!=='closed');
  if(!open.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="banner fade-in">
    <div class="bt">⚠ Не закрыты смены (${open.length}) — доделайте отчёт конца дня</div>
    <div class="bi">${open.map(e=>`<button class="bchip" data-go="${e.studioId}|${e.date}">${fmtLong(e.date)} · ${studioName(e.studioId)}</button>`).join('')}</div>
  </div>`;
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const p=b.dataset.go.split('|');gotoEditor(p[0],p[1]);});
}
async function openShiftEditor(body, studio, date, back){
  let existing={};
  try{ existing=await getEntry(studio,date)||{}; await loadReports(); }catch(e){}
  const prev=lastCashEndBefore(studio,date);
  const opts={prevCashEnd:prev?prev.cashEnd:null, prevDate:prev?prev.date:null};
  body.innerHTML=`<button class="btn btn-sm" id="backBtn" style="margin-bottom:14px">← Назад</button>
    <div class="section-title">Доделать смену · ${fmtLong(date)} · ${studioName(studio)}</div>
    <div id="feform"></div>`;
  body.querySelector('#backBtn').onclick=back;
  renderForm(body.querySelector('#feform'), studio, date, existing, ()=>back(), opts);
}

/* ================= History (read-only) ================= */
async function renderHistory(container,studio,dates,onChange){
  const entries=[];
  for(const d of dates){const e=await getEntry(studio,d);if(e)entries.push(e);}
  if(!entries.length){container.innerHTML=`<div class="empty">За этот период отчётов по студии нет.</div>`;return;}
  container.innerHTML=entries.map(e=>dayCard(e)).join('');
  wireDayCards(container,onChange);
}
function wireDayCards(container,onChange){
  container.querySelectorAll('.day-head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('open'));
  container.querySelectorAll('[data-editmorning]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const p=btn.dataset.editmorning.split('|');
      const entry=(REPORTS||[]).find(x=>x.studioId===p[0]&&x.date===p[1]);
      if(entry) editMorningModal(entry,onChange); };
  });
  container.querySelectorAll('[data-delreport]').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); const p=btn.dataset.delreport.split('|');
      confirmModal(`Удалить отчёт за ${fmtLong(p[1])} (${studioAddr(p[0])})? Действие необратимо.`, async()=>{
        try{ await apiDeleteReport(p[0],p[1]); toast('Отчёт удалён'); onChange&&onChange(); }catch(e){ handleErr(e); }
      });
    };
  });
}
function editMorningModal(entry,onDone){
  const el=modal(`<h3>Наличные утром</h3><p>${studioAddr(entry.studioId)} · ${fmtLong(entry.date)}<br>Зафиксировал(а): ${escapeHtml(shortName(entry.filledBy||'—'))}</p>
    <div class="field"><div class="lbl">Сумма (${CUR})</div><input id="em" type="number" inputmode="decimal" step="0.01" value="${entry.cashStart??''}"/></div>
    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn btn-primary" id="em-ok">Сохранить</button></div>`);
  el.querySelector('#em-ok').onclick=async()=>{
    const v=el.querySelector('#em').value; const nv=v===''?null:num(v);
    const upd=Object.assign({},entry,{cashStart:nv,cashStartEditedBy:session.name,cashStartEditedAt:new Date().toISOString()});
    try{ await apiSaveReport(entry.studioId,entry.date,upd); closeModal(el); toast('Наличные утром обновлены'); onDone&&onDone(); }
    catch(e){ handleErr(e); }
  };
}
function dayCard(e,open){
  const inSum=(e.changes||[]).filter(c=>c.type==='in').reduce((s,c)=>s+num(c.amount),0);
  const outSum=(e.changes||[]).filter(c=>c.type!=='in').reduce((s,c)=>s+num(c.amount),0);
  const expected=num(e.cashStart)+inSum-outSum;
  const diff=e.cashEnd==null?null:num(e.cashEnd)-expected;
  const prevInfo=lastCashEndBefore(e.studioId,e.date);
  const inter=(prevInfo&&e.cashStart!=null)?num(e.cashStart)-prevInfo.cashEnd:null;
  const came=e.newCame??e.newCount??null;
  const bought=e.newBought!=null?e.newBought:(Array.isArray(e.newList)?e.newList.filter(x=>x.bought).length:null);
  const endedC=e.ended??null, renewC=e.renewed??e.oldCount??null;
  const notRen=(endedC!=null&&renewC!=null)?Math.max(0,endedC-renewC):null;
  const newDetail=(e.newList||[]).map((c,i)=>`<div style="font-size:13px;padding:2px 0">${i+1}. ${escapeHtml(c.note||'—')} ${c.bought?'<b style="color:var(--gold)">· абонемент ✓</b>':'<span style="color:var(--ink-faint)">· без абонемента</span>'}</div>`).join('');
  const nrDetail=(e.notRenewList||[]).map((c,i)=>`<div style="font-size:13px;padding:2px 0">${i+1}. ${escapeHtml(c.note||'—')}</div>`).join('');
  const changeList=(e.changes||[]).map(c=>`<div style="font-size:13px;padding:2px 0"><b style="color:${c.type==='in'?'var(--gold)':'var(--clay)'}">${c.type==='in'?'+':'−'} ${money(c.amount)}</b><span style="color:var(--ink-soft)"> — ${escapeHtml(c.comment||'без комментария')}</span></div>`).join('')||'<span style="color:var(--ink-faint);font-size:13px">движений нет</span>';
  return `<div class="day${open?' open':''}">
    <div class="day-head"><span class="chev">▸</span>
      <span class="day-date">${fmtLong(e.date)}<span class="dow"> · ${fmtDow(e.date)}</span></span>
      <span class="st-tag" style="border-color:${studioColor(e.studioId)}">${sdot(e.studioId)}${studioAddr(e.studioId)}</span>
      <span class="stat ${e.status==='closed'?'stat-closed':'stat-open'}">${e.status==='closed'?'закрыта':'не закрыта'}</span>${e.status==='closed'?(e.zReport?'<span class="zbadge zok">Z-отчёт ✓</span>':'<span class="zbadge zno">Z-отчёт ✗</span>'):''}
      <span class="day-by">заполнил(а): <b>${escapeHtml(shortName(e.filledBy||'—'))}</b><br><span style="color:var(--ink-faint)">${fmtTime(e.submittedAt)}</span></span></div>
    <div class="day-body">
      <div class="kv">
        <div class="item"><div class="k">Наличные утром</div><div class="v">${money(e.cashStart)}</div></div>
        <div class="item"><div class="k">Движения (± касса)</div><div class="v" style="color:${(inSum-outSum)<0?'var(--clay)':(inSum-outSum)>0?'var(--gold)':'var(--ink)'}">${(inSum-outSum)>0?'+':''}${money(inSum-outSum)}</div></div>
        <div class="item"><div class="k">Наличные вечером</div><div class="v">${money(e.cashEnd)}</div></div>
        <div class="item"><div class="k">Наличными за день</div><div class="v" style="color:${diff===null?'var(--ink)':(diff<0?'var(--clay)':'var(--accent)')}">${diff===null?'—':(diff>=0?'+':'')+money(diff)}</div></div>
        ${inter!=null&&inter!==0?`<div class="item"><div class="k">Между сменами</div><div class="v" style="color:${inter>0?'var(--gold)':'var(--clay)'}">${inter>0?'+':''}${money(inter)}${prevInfo?` <small style="color:var(--ink-faint);font-weight:500">(с ${fmtLong(prevInfo.date)})</small>`:''}</div></div>`:''}
        <div class="item"><div class="k">Картой</div><div class="v">${money(e.cashless)}</div></div>
        <div class="item"><div class="k">QR</div><div class="v">${money(e.allsports)}</div></div>
        <div class="item"><div class="k">EPOS</div><div class="v">${money(e.epos)}</div></div>
        <div class="item"><div class="k">Пришло новых</div><div class="v">${came??'—'}</div></div>
        <div class="item"><div class="k">Купили абонемент</div><div class="v">${bought??'—'}</div></div>
        <div class="item"><div class="k">Абонементы закончились</div><div class="v">${endedC??'—'}</div></div>
        <div class="item"><div class="k">Продлили</div><div class="v">${renewC??'—'}</div></div>
        <div class="item"><div class="k">Не продлили</div><div class="v" style="color:${notRen>0?'var(--clay)':'var(--ink)'}">${notRen??'—'}</div></div>
        <div class="item"><div class="k">Конверсия новых</div><div class="v">${pct(bought,came)}</div></div>
        <div class="item"><div class="k">Конверсия продлений</div><div class="v">${pct(renewC,endedC)}</div></div>
      </div>
      ${(session&&(session.role==='owner'||session.canEdit))?`<button class="btn btn-sm" data-editmorning="${e.studioId}|${e.date}" style="margin:2px 6px 8px 0">✎ Изменить наличные утром</button>`:''}${(session&&session.role==='owner')?`<button class="btn btn-sm" data-editreport="${e.studioId}|${e.date}" style="margin:2px 6px 8px 0">✎ Редактировать отчёт</button>`:''}${(session&&session.role==='owner')?`<button class="btn btn-sm btn-ghost" data-delreport="${e.studioId}|${e.date}" style="margin:2px 0 8px">🗑 Удалить отчёт</button>`:''}
      ${e.cashStartEditedBy?`<div class="hintline" style="margin-bottom:8px">Наличные утром изменены: ${escapeHtml(shortName(e.cashStartEditedBy))}${e.cashStartEditedAt?' · '+fmtTime(e.cashStartEditedAt):''}</div>`:''}
      <div class="notes"><div class="k">Движения наличных</div>${changeList}</div>
      ${newDetail?`<div class="notes"><div class="k">Новые клиенты — по каждому</div>${newDetail}</div>`:''}
      ${nrDetail?`<div class="notes"><div class="k">Не продлили — по каждому</div>${nrDetail}</div>`:''}
      ${e.interNote?`<div class="notes"><div class="k">Между сменами — причина</div>${escapeHtml(e.interNote)}</div>`:''}
      ${e.comments?`<div class="notes"><div class="k">Комментарии</div>${escapeHtml(e.comments)}</div>`:''}
    </div></div>`;
}

/* ================= All reports (owner + senior) ================= */
async function renderAllReports(body){
  let all, sched=null; try{ all=await loadReports(true); }catch(e){ return handleErr(e); }
  try{ TEAM=await apiListTeam(); }catch(e){}
  try{ const _d=new Date(); sched=await apiGetSchedule(monthKey(_d.getFullYear(), _d.getMonth())); }catch(e){ sched=null; }
  body.innerHTML=`
    <div id="banner"></div>
    ${cashNowCard(all)}
    <div class="bar fade-in">
      <div class="datepick"><span class="lbl">День:</span><input type="date" id="pick" max="${todayStr()}" value="${todayStr()}" style="width:auto"/></div>
      <div class="datepick"><span class="lbl">Студия:</span><select id="stf" style="width:auto"><option value="all">Все студии</option>${STUDIOS.map(s=>`<option value="${s.id}">${s.name} · ${s.address}</option>`).join('')}</select></div>
      <div class="datepick"><span class="lbl">Период:</span><input type="date" id="pfrom" max="${todayStr()}" value="${todayStr().slice(0,8)}01" style="width:auto"/><span class="lbl">—</span><input type="date" id="pto" max="${todayStr()}" value="${todayStr()}" style="width:auto"/></div>
      <div class="grow"></div>
      <button class="btn icon-only" id="export" title="Выгрузить в Excel" aria-label="Выгрузить в Excel"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="#217346"/><path d="M8.7 8l2.6 4-2.6 4M15.3 8l-2.6 4 2.6 4" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="periodsum"></div>
    <div id="picked"></div>
    <div class="section-title">Все отчёты (<span id="cnt">0</span>)</div>
    <div id="alllist"></div>`;
  fillBanner(body.querySelector('#banner'), (s,d)=>openShiftEditor(body,s,d,()=>renderAllReports(body)));
  const pick=body.querySelector('#pick'),stf=body.querySelector('#stf'),
        picked=body.querySelector('#picked'),alllist=body.querySelector('#alllist'),cnt=body.querySelector('#cnt');
  function wireEdit(el){
    el.querySelectorAll('[data-editreport]').forEach(btn=>{ btn.onclick=(ev)=>{ ev.stopPropagation(); const p=btn.dataset.editreport.split('|'); openShiftEditor(body,p[0],p[1],()=>renderAllReports(body)); }; });
    el.querySelectorAll('[data-create]').forEach(btn=>{ btn.onclick=()=>{ const p=btn.dataset.create.split('|'); openShiftEditor(body,p[0],p[1],()=>renderAllReports(body)); }; });
  }
  function refresh(){
    const f=stf.value, d=pick.value;
    const pe=all.filter(e=>e.date===d&&(f==='all'||e.studioId===f));
    let extra='';
    if(session.role==='owner'){
      const present=new Set(pe.map(e=>e.studioId));
      const miss=STUDIOS.filter(st=>(f==='all'||st.id===f)&&!present.has(st.id));
      if(miss.length) extra=`<div class="miss-row">${miss.map(st=>`<button class="btn btn-sm" data-create="${st.id}|${d}">+ Открыть отчёт: ${sdot(st.id)}${st.name}</button>`).join('')}</div>`;
    }
    picked.innerHTML=daySummary(pe)+(pe.length?pe.map(e=>dayCard(e,true)).join(''):`<div class="empty">За ${fmtLong(d)} нет отчётов${f==='all'?'':' по выбранной студии'}.</div>`)+extra;
    wireDayCards(picked,()=>renderAllReports(body)); wireEdit(picked);
    const list=all.filter(e=>f==='all'||e.studioId===f);
    cnt.textContent=list.length;

/* ================= Итоги: карточки по филиалам ================= */
function _numf(n){ return (n==null||isNaN(Number(n)))?'0':Number(n).toLocaleString('ru-RU'); }
function _sgn(n){ return `<b style="color:${n<0?'var(--clay)':(n>0?'var(--accent-deep)':'var(--ink)')}">${n>0?'+':''}${_numf(n)}</b>`; }
function entryMetrics(e){
  const i=(e.changes||[]).filter(c=>c.type==='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
  const o=(e.changes||[]).filter(c=>c.type!=='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
  const st=Number(e.cashStart)||0, end=(e.cashEnd!=null)?Number(e.cashEnd):0;
  const day=(e.cashEnd!=null)?(end-st-i+o):0;
  const card=Number(e.cashless)||0, qr=Number(e.allsports)||0, ep=Number(e.epos)||0;
  const came=Number(e.newCame??e.newCount)||0;
  const bought=Number(e.newBought!=null?e.newBought:(Array.isArray(e.newList)?e.newList.filter(x=>x.bought).length:0))||0;
  const ended=Number(e.ended)||0, renew=Number(e.renewed??e.oldCount)||0;
  return {st, net:i-o, mIn:i, mOut:o, end, day, card, qr, ep, rev:day+card+qr+ep, inter:0, came, bought, ended, renew, days:1};
}
function movFormula(m){
  const net=m.net||0, mi=m.mIn||0, mo=m.mOut||0;
  const col=net<0?'var(--clay)':(net>0?'var(--accent-deep)':'var(--ink)');
  let s=(net>0?'+':'')+_numf(net);
  if(mi>0 && mo>0) s+=' = +'+_numf(mi)+' −'+_numf(mo);
  return `<b style="color:${col}">${s}</b>`;
}
function sumCard(label, dotId, entity, m, period, total){
  const row=(k,v)=>`<div class="sr"><span>${k}</span>${v}</div>`;
  const b=v=>`<b>${_numf(v)}</b>`;
  let rows;
  if(period){
    rows = row('Нал. за день',_sgn(m.day)) + row('Между сменами',_sgn(m.inter||0))
         + row('Картой',b(m.card)) + row('QR',b(m.qr))
         + row('EPOS',b(m.ep)) + row('Дней',`<b>${m.days}</b>`)
         + `<div class="sr sr-wide"><span>Движения</span>${movFormula(m)}</div>`;
  } else {
    rows = row('Утро',b(m.st)) + row('Вечер',b(m.end))
         + row('Нал. за день',_sgn(m.day)) + row('Картой',b(m.card))
         + row('EPOS',b(m.ep)) + row('QR',b(m.qr))
         + `<div class="sr sr-wide"><span>Движения</span>${movFormula(m)}</div>`;
  }
  const clients=`Пришло <b>${m.came}</b> · купили <b>${m.bought}</b> (${pct(m.bought,m.came)}) · законч. <b>${m.ended}</b> · продлили <b>${m.renew}</b> (${pct(m.renew,m.ended)}) · не прод. <b>${Math.max(0,m.ended-m.renew)}</b>`;
  const head = total
    ? '<span class="sc-name">Итого по всем</span>'
    : `<span class="sc-name">${dotId?sdot(dotId):''}${label}</span>`;
  return `<div class="sumcard${total?' tot':''}">
    <div class="sumcard-h">${head}<span class="sc-rev">Выручка<b>${_numf(m.rev)} ${CUR}</b></span></div>
    <div class="sumcard-rows">${rows}</div>
    <div class="sumcard-cl">${clients}</div>
  </div>`;
}
function legalTotals(entries){
  const sum=(sid,k)=>entries.filter(e=>e.studioId===sid).reduce((a,e)=>a+(Number(e[k])||0),0);
  const cash=entries.reduce((a,e)=>{const i=(e.changes||[]).filter(c=>c.type==='in').reduce((x,c)=>x+(Number(c.amount)||0),0);const o=(e.changes||[]).filter(c=>c.type!=='in').reduce((x,c)=>x+(Number(c.amount)||0),0);return a+((e.cashEnd!=null)?(Number(e.cashEnd)-(Number(e.cashStart)||0)-i+o):0);},0);
  const epos=sum('masherova','epos')+sum('kuibysheva','epos')+sum('tolbuhina','epos');
  const ip=epos+sum('tolbuhina','cashless')+sum('kuibysheva','allsports')+sum('tolbuhina','allsports');
  const ooo=sum('masherova','cashless')+sum('kuibysheva','cashless')+sum('masherova','allsports');
  return {cash,ip,ooo};
}
function legalCard(entries){
  const t=legalTotals(entries);
  return `<div class="sumcard legal">
    <div class="sumcard-h"><span class="sc-name">Итого по юрлицам</span></div>
    <div class="legal-rows">
      <div class="lr"><span>Наличные</span><b>${_numf(t.cash)} ${CUR}</b></div>
      <div class="lr"><span>ИП</span><b>${_numf(t.ip)} ${CUR}</b></div>
      <div class="lr"><span>ООО</span><b>${_numf(t.ooo)} ${CUR}</b></div>
    </div></div>`;
}
function daySummary(entries){
  if(!entries.length) return '';
  const ord=STUDIOS.map(s=>s.id);
  const rows=entries.slice().sort((a,b)=>ord.indexOf(a.studioId)-ord.indexOf(b.studioId));
  const T={st:0,net:0,mIn:0,mOut:0,end:0,day:0,card:0,qr:0,ep:0,rev:0,came:0,bought:0,ended:0,renew:0,inter:0,days:0};
  const cards=rows.map(e=>{const m=entryMetrics(e);
    ['st','net','mIn','mOut','end','day','card','qr','ep','rev','came','bought','ended','renew'].forEach(k=>T[k]+=m[k]);
    return sumCard(studioName(e.studioId), e.studioId, studioEntity(e.studioId), m, false, false);}).join('');
  const tot=rows.length>1?sumCard('','','',T,false,true):'';
  return `<div class="daysum"><div class="ds-title">Итоги за день <small>(суммы в ${CUR})</small></div><div class="sumcards">${cards}${tot}${legalCard(rows)}</div></div>`;
}

/* ================= Итоги за период ================= */
function periodSummary(entries, from, to){
  if(!entries.length) return '<div class="empty">За выбранный период отчётов нет.</div>';
  const ord=STUDIOS.map(s=>s.id);
  const groups={}; entries.forEach(e=>{(groups[e.studioId]=groups[e.studioId]||[]).push(e);});
  const sids=Object.keys(groups).sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
  const M=list=>{let days=0,day=0,net=0,mIn=0,mOut=0,inter=0,card=0,qr=0,ep=0,rev=0,came=0,bought=0,ended=0,renew=0;
    list.forEach(e=>{days++;
      const i=(e.changes||[]).filter(c=>c.type==='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
      const o=(e.changes||[]).filter(c=>c.type!=='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
      net+=i-o; mIn+=i; mOut+=o; const cl=Number(e.cashless)||0,al=Number(e.allsports)||0,ie=Number(e.epos)||0;
      card+=cl;qr+=al;ep+=ie;
      const dc=(e.cashEnd!=null)?(Number(e.cashEnd)-(Number(e.cashStart)||0)-i+o):0; day+=dc; rev+=dc+cl+al+ie;
      const p=lastCashEndBefore(e.studioId,e.date); if(p&&e.cashStart!=null) inter+=Number(e.cashStart)-p.cashEnd;
      came+=Number(e.newCame??e.newCount)||0;
      bought+=Number(e.newBought!=null?e.newBought:(Array.isArray(e.newList)?e.newList.filter(x=>x.bought).length:0))||0;
      ended+=Number(e.ended)||0; renew+=Number(e.renewed??e.oldCount)||0;});
    return {days,day,net,mIn,mOut,inter,card,qr,ep,rev,came,bought,ended,renew,st:0,end:0};};
  const cards=sids.map(sid=>sumCard(studioName(sid), sid, studioEntity(sid), M(groups[sid]), true, false)).join('');
  const tot=sids.length>1?sumCard('','','',M(entries),true,true):'';
  return `<div class="daysum"><div class="ds-title">Итоги за период: ${fmtLong(from)} – ${fmtLong(to)} <small>(суммы в ${CUR})</small></div><div class="sumcards">${cards}${tot}${legalCard(entries)}</div></div>`;
}

/* ================= Excel export ================= */
function exportExcel(entries){
  if(!entries.length){toast('Нет данных для выгрузки',true);return;}
  const rows=entries.map(e=>{
    const inSum=(e.changes||[]).filter(c=>c.type==='in').reduce((s,c)=>s+num(c.amount),0);
    const outSum=(e.changes||[]).filter(c=>c.type!=='in').reduce((s,c)=>s+num(c.amount),0);
    const expected=num(e.cashStart)+inSum-outSum;
    const diff=e.cashEnd==null?'':num(e.cashEnd)-expected;
    const chgText=(e.changes||[]).map(c=>`${c.type==='in'?'+':'-'}${num(c.amount)} (${c.comment||''})`).join('; ');
    const came=e.newCame??e.newCount??'';
    const bought=e.newBought!=null?e.newBought:(Array.isArray(e.newList)?e.newList.filter(x=>x.bought).length:'');
    const endedC=e.ended??'', renewC=e.renewed??e.oldCount??'';
    const notRen=(e.ended!=null&&(e.renewed!=null||e.oldCount!=null))?Math.max(0,e.ended-(e.renewed??e.oldCount)):'';
    const newDet=(e.newList||[]).map((c,i)=>`${i+1}. ${c.note||''}${c.bought?' [абонемент]':''}`).join('; ')||(e.newNotes||'');
    const nrDet=(e.notRenewList||[]).map((c,i)=>`${i+1}. ${c.note||''}`).join('; ')||(e.oldNotes||'');
    return {
      'Дата':e.date,'День недели':fmtDow(e.date),'Студия':studioName(e.studioId),'Адрес':studioAddr(e.studioId),
      'Заполнил (ФИО)':e.filledBy||'','Логин':e.filledByLogin||'','Время':fmtTime(e.submittedAt),
      'Наличные начало':e.cashStart??'','Наличные конец':e.cashEnd??'','Внесено':inSum,'Выдано':outSum,
      'Наличными за день':(e.cashEnd==null?'':num(e.cashEnd)-num(e.cashStart)-inSum+outSum),'Движения нетто':inSum-outSum,'Движения (детально)':chgText,
      'Картой':e.cashless??'','QR':e.allsports??'','EPOS':e.epos??'',
      'Выручка за день':(e.cashEnd==null?'':(num(e.cashEnd)-num(e.cashStart)-inSum+outSum)+num(e.cashless)+num(e.allsports)+num(e.epos)),
      'Между сменами':(function(){const p=lastCashEndBefore(e.studioId,e.date);return (p&&e.cashStart!=null)?num(e.cashStart)-p.cashEnd:'';})(),'Причина (между сменами)':e.interNote||'','Z-отчёт':e.zReport?'да':(e.status==='closed'?'нет':''),
      'Пришло новых':came,'Купили абонемент':bought,'Конверсия новых':pct(bought,came),'Абонементы закончились':endedC,'Продлили':renewC,'Не продлили':notRen,'Конверсия продлений':pct(renewC,endedC),
      'Новые клиенты (детально)':newDet,'Не продлили (детально)':nrDet,'Комментарии':e.comments||''
    };
  });
  rows.sort((a,b)=> a['Дата']<b['Дата']?-1:(a['Дата']>b['Дата']?1:(a['Студия']<b['Студия']?-1:1)));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=Object.keys(rows[0]||{}).map(k=>({wch:Math.min(Math.max(k.length+2,10),40)}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Лог отчётов');
  XLSX.writeFile(wb,`otchet-studii_${todayStr()}.xlsx`);
  toast('Excel-лог выгружен');
}

    catch(e){ handleErr(e); }

function confirmModal(msg,onYes){

    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn btn-primary" id="c-ok" style="background:var(--clay);border-color:var(--clay)">Удалить</button></div>`);

/* ================= Расписание (модуль) ================= */
const MON2=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const SCH_DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let SCH=null, SCHDATA=null, TEAM=[], SCHsel=null, ABS_MODE='cal';

function monthKey(y,m){return y+'-'+String(m+1).padStart(2,'0');}
function schPad(n){return String(n).padStart(2,'0');}
function schDaysIn(y,m){return new Date(y,m+1,0).getDate();}
function schIso(y,m,d){return y+'-'+schPad(m+1)+'-'+schPad(d);}
function schDow(y,m,d){return new Date(y,m,d).getDay();}
function toMin(t){const p=(t||'0:0').split(':');return (+p[0])*60+(+p[1]);}
function shiftHours(s,e){let d=toMin(e)-toMin(s);if(d<0)d+=1440;return d/60;}
function fmtH(x){return (Math.round(x*10)/10).toString().replace('.',',');}
function uid(){return Math.random().toString(36).slice(2,9);}
function teamById(id){return TEAM.find(a=>a.login===id);}
function adminName(id){const a=teamById(id);return a?shortName(a.name):id;}
function initials(name){return String(name||'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();}
function absName(t){return t==='otpusk'?'Отпуск':t==='bol'?'Больничный':'Отгул';}
function homeAdmins(sid){return TEAM.filter(a=>a.home===sid);}
function dayRec(iso,sid){return SCHDATA.assignments[iso+'_'+sid]||null;}
function setDayRec(iso,sid,rec){const k=iso+'_'+sid; if(rec)SCHDATA.assignments[k]=rec; else delete SCHDATA.assignments[k];}
function absOn(login,iso){return (SCHDATA.absences||[]).find(a=>a.adminId===login && iso>=a.start && iso<=a.end)||null;}
function assignedThatDay(login,iso){return STUDIOS.some(s=>{const r=dayRec(iso,s.id);return r&&!r.closed&&(r.shifts||[]).some(sh=>sh.adminId===login);});}
function isFreeDay(login,iso){return !absOn(login,iso)&&!assignedThatDay(login,iso);}
function adminMonthShifts(login){const out=[];const n=schDaysIn(SCH.y,SCH.m);
  for(let d=1;d<=n;d++){const iso=schIso(SCH.y,SCH.m,d);STUDIOS.forEach(s=>{const r=dayRec(iso,s.id);if(r&&!r.closed)(r.shifts||[]).forEach(sh=>{if(sh.adminId===login)out.push({iso,sid:s.id,shift:sh});});});}
  return out;}
function adminHours(login){return adminMonthShifts(login).reduce((h,x)=>h+shiftHours(x.shift.start,x.shift.end),0);}
function consecutiveMax(login){const n=schDaysIn(SCH.y,SCH.m);let best=0,cur=0;
  for(let d=1;d<=n;d++){const iso=schIso(SCH.y,SCH.m,d);const w=assignedThatDay(login,iso)&&!absOn(login,iso);if(w){cur++;if(cur>best)best=cur;}else cur=0;}
  return best;}

async function loadMonth(y,m){
  let d=null; try{ d=await apiGetSchedule(monthKey(y,m)); }catch(e){ d=null; }
  if(!d) d={assignments:{},absences:[],approved:false,seeded:false};
  if(!d.assignments)d.assignments={}; if(!d.absences)d.absences=[];
  return d;
}
async function saveMonth(){ await apiSaveSchedule(monthKey(SCH.y,SCH.m), SCHDATA); }

async function renderSchedule(body){
  const editor = session.role==='owner' || session.senior;
  if(!SCH){ const now=new Date(); const defSids = editor ? STUDIOS.map(s=>s.id) : (session.home?[session.home]:STUDIOS.map(s=>s.id)); SCH={y:now.getFullYear(), m:now.getMonth(), sids:defSids, view:'calendar', calView:(typeof window!=='undefined'&&window.innerWidth<640)?'list':'grid'}; }
  try{ TEAM=await apiListTeam(); SCHDATA=await loadMonth(SCH.y,SCH.m); }
  catch(e){ return handleErr(e); }
  drawSchedule(body, editor);
}
function reflowSchedule(){ if(SCH&&SCH._body) drawSchedule(SCH._body, SCH.editor); }

function drawSchedule(body, editor){
  SCH._body=body; SCH.editor=editor;
  const sub = editor ? [['calendar','Календарь'],['overview','Обзор']] : [['calendar','Календарь'],['overview','Обзор'],['dashboard','Моё расписание']];

    <div class="sch-bar">
