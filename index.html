      <span class="stat ${e.status==='closed'?'stat-closed':'stat-open'}">${e.status==='closed'?'закрыта':'не закрыта'}</span>${e.status==='closed'?(e.zReport?'<span class="zbadge zok">Z-отчёт ✓</span>':'<span class="zbadge zno">Z-отчёт ✗</span>'):''}${e.coffeeAssigned?(e.coffeeDone?'<span class="zbadge zok">☕ выполнено</span>':'<span class="zbadge zno">☕ не выполнено</span>'):''}${(e.checklist&&e.checklist.length)?`<span class="zbadge zok" title="${escapeHtml(e.checklist.map(c=>c.text).join(', '))}">✅ чек-лист (${e.checklist.length})</span>`:''}
      <span class="day-by">заполнил(а): <b>${escapeHtml(shortName(e.filledBy||'—'))}</b><br><span style="color:var(--ink-faint)">${fmtTime(e.submittedAt)}</span></span></div>
    <div class="day-body">
      <div class="kv">
        <div class="item"><div class="k">Наличные утром</div><div class="v">${money(e.cashStart)}</div></div>
        <div class="item"><div class="k">Движения (± касса)</div><div class="v" style="color:${(inSum-outSum)<0?'var(--clay)':(inSum-outSum)>0?'var(--gold)':'var(--ink)'}">${(inSum-outSum)>0?'+':''}${money(inSum-outSum)}</div></div>
        <div class="item"><div class="k">Наличные вечером</div><div class="v">${money(e.cashEnd)}</div></div>
        <div class="item"><div class="k">Наличными за день</div><div class="v" style="color:${diff===null?'var(--ink)':(diff<0?'var(--clay)':'var(--accent)')}">${diff===null?'—':(diff>=0?'+':'')+money(diff)}</div></div>
        ${inter!=null&&inter!==0?`<div class="item"><div class="k">Между сменами</div><div class="v" style="color:${inter>0?'var(--gold)':'var(--clay)'}">${inter>0?'+':''}${money(inter)}${prevInfo?` <small style="color:var(--ink-faint);font-weight:500">(с ${fmtLong(prevInfo.date)})</small>`:''}</div></div>`:''}

function fmtDM(iso){const M=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];const p=iso.split('-');return (+p[2])+' '+M[(+p[1])-1];}
function cashNowCard(all){

/* ================= Итоги: карточки по филиалам ================= */
function _numf(n){ return (n==null||isNaN(Number(n)))?'0':Number(n).toLocaleString('ru-RU'); }
function _sgn(n){ return `<b style="color:${n<0?'var(--clay)':(n>0?'var(--accent-deep)':'var(--ink)')}">${n>0?'+':''}${_numf(n)}</b>`; }
function entryMetrics(e){
  const i=(e.changes||[]).filter(c=>c.type==='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
  const o=(e.changes||[]).filter(c=>c.type!=='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
  const st=Number(e.cashStart)||0, end=(e.cashEnd!=null)?Number(e.cashEnd):0;
  const day=(e.cashEnd!=null)?(end-st-i+o):0;
  const card=Number(e.cashless)||0, qr=Number(e.allsports)||0, ep=Number(e.epos)||0;
  const came=Number(e.newCame??e.newCount)||0;
  const bought=Number(e.newBought!=null?e.newBought:(Array.isArray(e.newList)?e.newList.filter(x=>x.bought).length:0))||0;
  const ended=Number(e.ended)||0, renew=Number(e.renewed??e.oldCount)||0;
  return {st, net:i-o, mIn:i, mOut:o, end, day, card, qr, ep, rev:day+card+qr+ep, inter:0, came, bought, ended, renew, days:1};
}
function movFormula(m){
  const net=m.net||0, mi=m.mIn||0, mo=m.mOut||0;
  const col=net<0?'var(--clay)':(net>0?'var(--accent-deep)':'var(--ink)');
  let s=(net>0?'+':'')+_numf(net);
  if(mi>0 && mo>0) s+=' = +'+_numf(mi)+' −'+_numf(mo);
  return `<b style="color:${col}">${s}</b>`;
}
function sumCard(label, dotId, entity, m, period, total, titleOverride, extraClass){
  const row=(k,v)=>`<div class="sr"><span>${k}</span>${v}</div>`;
  const b=v=>`<b>${_numf(v)}</b>`;
  let rows;
  if(period){
    rows = row('Нал. за день',_sgn(m.day)) + row('Между сменами',_sgn(m.inter||0))
         + row('Картой',b(m.card)) + row('QR',b(m.qr))
         + row('EPOS',b(m.ep))
         + `<div class="sr sr-wide"><span>Движения</span>${movFormula(m)}</div>`;
  } else {
    rows = row('Утро',b(m.st)) + row('Вечер',b(m.end))
         + row('Нал. за день',_sgn(m.day)) + row('Картой',b(m.card))
         + row('EPOS',b(m.ep)) + row('QR',b(m.qr))
         + `<div class="sr sr-wide"><span>Движения</span>${movFormula(m)}</div>`;
  }
  const clients=`Пришло <b>${m.came}</b> · купили <b>${m.bought}</b> (${pct(m.bought,m.came)}) · законч. <b>${m.ended}</b> · продлили <b>${m.renew}</b> (${pct(m.renew,m.ended)}) · не прод. <b>${Math.max(0,m.ended-m.renew)}</b>`;
  const head = titleOverride
    ? `<span class="sc-name">${escapeHtml(titleOverride)}</span>`
    : (total
      ? '<span class="sc-name">Итого по всем</span>'
      : `<span class="sc-name">${dotId?sdot(dotId):''}${label}</span>`);
  return `<div class="sumcard${total?' tot':''}${extraClass?' '+extraClass:''}">
    <div class="sumcard-h">${head}<span class="sc-rev">Выручка<b>${_numf(m.rev)} ${CUR}</b></span></div>
    <div class="sumcard-rows">${rows}</div>
    <div class="sumcard-cl">${clients}</div>
  </div>`;
}
function _round1(n){ return Math.round((Number(n)||0)*10)/10; }
function forecastMetrics(m, factor){
  factor=Number(factor)||1;
  const out=Object.assign({},m);
  ['day','inter','card','qr','ep','mIn','mOut'].forEach(k=>{ out[k]=_round1((Number(m[k])||0)*factor); });
  out.net=_round1(out.mIn-out.mOut);
  out.rev=_round1(out.day+out.card+out.qr+out.ep);
  ['came','bought','ended','renew','days'].forEach(k=>{ out[k]=Math.round((Number(m[k])||0)*factor); });
  out.st=0; out.end=0;
  return out;
}
function forecastMeta(from,to){
  if(!from||!to) return null;
  const today=todayStr(), mk=today.slice(0,7);
  if(from.slice(0,7)!==mk || to.slice(0,7)!==mk) return null;
  const y=+mk.slice(0,4), mo=+mk.slice(5,7);
  const daysInMonth=new Date(y,mo,0).getDate();
  const currentDay=+today.slice(8,10);
  const toDay=Math.min(+to.slice(8,10),currentDay);
  const fromDay=+from.slice(8,10);
  const elapsed=Math.max(1,toDay-fromDay+1);
  return {factor:daysInMonth/elapsed,elapsed,daysInMonth,month:MON[mo-1]};
}
function legalTotals(entries){
  const sum=(sid,k)=>entries.filter(e=>e.studioId===sid).reduce((a,e)=>a+(Number(e[k])||0),0);
  const cash=entries.reduce((a,e)=>{const i=(e.changes||[]).filter(c=>c.type==='in').reduce((x,c)=>x+(Number(c.amount)||0),0);const o=(e.changes||[]).filter(c=>c.type!=='in').reduce((x,c)=>x+(Number(c.amount)||0),0);return a+((e.cashEnd!=null)?(Number(e.cashEnd)-(Number(e.cashStart)||0)-i+o):0);},0);
  const epos=sum('masherova','epos')+sum('kuibysheva','epos')+sum('tolbuhina','epos');
  const ip=epos+sum('tolbuhina','cashless')+sum('kuibysheva','allsports')+sum('tolbuhina','allsports');
  const ooo=sum('masherova','cashless')+sum('kuibysheva','cashless')+sum('masherova','allsports');
  return {cash,ip,ooo};
}
function legalCard(entries, forecastFactor){
  const t=legalTotals(entries), hasForecast=Number(forecastFactor)>0;
  const val=v=>hasForecast
    ? `<b class="legal-pair">${_numf(v)} / ${_numf(_round1(v*forecastFactor))} ${CUR}</b>`
    : `<b>${_numf(v)} ${CUR}</b>`;
  return `<div class="sumcard legal">
    <div class="sumcard-h"><span class="sc-name">Итого по юрлицам</span>${hasForecast?'<span class="legal-mode">факт / прогноз</span>':''}</div>
    <div class="legal-rows">
      <div class="lr"><span>Наличные</span>${val(t.cash)}</div>
      <div class="lr"><span>ИП</span>${val(t.ip)}</div>
      <div class="lr"><span>ООО</span>${val(t.ooo)}</div>
    </div></div>`;
}
function daySummary(entries){

    return sumCard(studioName(e.studioId), e.studioId, studioEntity(e.studioId), m, false, false);}).join('');

/* ================= Итоги за период ================= */
function periodSummary(entries, from, to){
  if(!entries.length) return '<div class="empty">За выбранный период отчётов нет.</div>';
  const ord=STUDIOS.map(s=>s.id);
  const groups={}; entries.forEach(e=>{(groups[e.studioId]=groups[e.studioId]||[]).push(e);});
  const sids=Object.keys(groups).sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
  const M=list=>{let days=0,day=0,net=0,mIn=0,mOut=0,inter=0,card=0,qr=0,ep=0,rev=0,came=0,bought=0,ended=0,renew=0;
    list.forEach(e=>{days++;
      const i=(e.changes||[]).filter(c=>c.type==='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
      const o=(e.changes||[]).filter(c=>c.type!=='in').reduce((a,c)=>a+(Number(c.amount)||0),0);
      net+=i-o; mIn+=i; mOut+=o; const cl=Number(e.cashless)||0,al=Number(e.allsports)||0,ie=Number(e.epos)||0;
      card+=cl;qr+=al;ep+=ie;
      const dc=(e.cashEnd!=null)?(Number(e.cashEnd)-(Number(e.cashStart)||0)-i+o):0; day+=dc; rev+=dc+cl+al+ie;
      const p=lastCashEndBefore(e.studioId,e.date); if(p&&e.cashStart!=null) inter+=Number(e.cashStart)-p.cashEnd;
      came+=Number(e.newCame??e.newCount)||0;
      bought+=Number(e.newBought!=null?e.newBought:(Array.isArray(e.newList)?e.newList.filter(x=>x.bought).length:0))||0;
      ended+=Number(e.ended)||0; renew+=Number(e.renewed??e.oldCount)||0;});
    return {days,day,net,mIn,mOut,inter,card,qr,ep,rev,came,bought,ended,renew,st:0,end:0};};
  const cards=sids.map(sid=>sumCard(studioName(sid), sid, studioEntity(sid), M(groups[sid]), true, false)).join('');
  const totalMetrics=M(entries);
  const tot=sids.length>1?sumCard('','','',totalMetrics,true,true):'';
  const fm=forecastMeta(from,to);
  const forecast=(fm&&sids.length>1)
    ? sumCard('','','',forecastMetrics(totalMetrics,fm.factor),true,true,'Прогноз','forecast')
    : '';
  return `<div class="daysum"><div class="ds-title">Итоги за период: ${fmtLong(from)} – ${fmtLong(to)} <small>(суммы в ${CUR})</small></div><div class="sumcards${forecast?' forecast-grid':''}">${cards}${tot}${legalCard(entries,fm?fm.factor:null)}${forecast}</div></div>`;
}

function replacementCandidates(trainers, directionsByTrainer, excludedId, needed){
  const counts=new Map(), full=[], partial=[];
  // Фильтр занятости по расписанию и календарю будет применяться здесь, до подсчёта.
  const eligible=trainers.filter(trainer=>trainer.id!==excludedId);
  for(const trainer of eligible){
    const directions=directionsByTrainer.get(trainer.id)||new Set();
    for(const id of directions) counts.set(id,(counts.get(id)||0)+1);
    if(!needed.length) continue;
    const missing=needed.filter(direction=>!directions.has(direction.id));
    if(missing.length===needed.length) continue;
    const candidate={trainer,directions,missing};
    (missing.length?partial:full).push(candidate);
  }
  // Исходный список уже отсортирован по ФИО. Стабильная сортировка сохраняет этот порядок при равенстве.
  partial.sort((a,b)=>a.missing.length-b.missing.length);
  return {counts,full,partial};
}

  const branches=employeeStudios(trainer).map(studioName);
  const phone=String(trainer.phone||'').trim();
  const dial=phone.replace(/[\s().\-\u2010-\u2015\u2212]/g,'');
  const contact=/^\+?\d+$/.test(dial)
    ? `<a class="rep-contact rep-call" href="tel:${dial}" aria-label="Позвонить: ${escapeHtml(trainer.full_name)}, ${escapeHtml(phone)}"><span aria-hidden="true">☎</span>${escapeHtml(phone)}</a>`
    : '<div class="rep-contact">номер не указан</div>';
  return `<article class="rep-card${isFull?' rep-card-full':''}">
    <div class="rep-card-head"><h4 class="rep-name">${escapeHtml(trainer.full_name)}</h4>
      <span class="rep-badge rep-badge-${isFull?'full':'partial'}">${badge}</span></div>
    <div class="rep-chips">${catalog.filter(d=>directions.has(d.id)).map(d=>{
      const match=selected.has(d.id);
      return `<span class="rep-chip${match?' rep-chip-match':''}">${match?'✓ ':''}${escapeHtml(d.name)}</span>`;
    }).join('')}</div>
    ${isFull?'':`<p class="rep-missing">Не ведёт: ${missing.map(d=>escapeHtml(d.name)).join(', ')}</p>`}
    <p class="rep-branches">${branches.length?escapeHtml(branches.join(' · ')):'филиал не указан'}</p>
    ${contact}
  </article>`;
}

            <span data-rep-check aria-hidden="true" hidden>✓ </span>${escapeHtml(d.name)} · <span data-rep-count></span>

    const partialShown=state.showAll?partial:partial.slice(0,6);
    get('rep-partial-cards').innerHTML=showPartial?partialShown.map(c=>replacementCard(c,catalog,state.selected)).join(''):'';
    more.hidden=!showPartial||partial.length<=6;
    more.setAttribute('aria-expanded',state.showAll);
    more.textContent=state.showAll?'Свернуть':`Показать всех (${partial.length})`;
  }

  function clearSelection(){
    state.trainerId='';
    state.selected.clear();
    state.showAll=false;
  }

  modeButtons.forEach(b=>b.onclick=()=>{
    if(state.mode===b.dataset.repMode) return;
    state.mode=b.dataset.repMode;

  });

    state.showAll=false;
    draw();
  });
  onlyFull.onclick=()=>{ state.onlyFull=!state.onlyFull; draw(); };
  more.onclick=()=>{
    state.showAll=!state.showAll;
    draw();

  };
  get('rep-reset').onclick=()=>{
    state.mode='trainer';
    state.onlyFull=false;
    clearSelection();
    draw();
  };
  draw();
}

let EMP_VIEW='all';
function employeeRoleLabel(e){ return e.employee_type==='trainer'?'Тренер':'Администратор'; }
function employeeStudios(e){
  const a=Array.isArray(e.studios)?e.studios.filter(Boolean):[];
  if(!a.length&&e.primary_studio)a.push(e.primary_studio);
  return [...new Set(a)];
}
function birthdayShort(iso){
  if(!iso)return 'не указана';
  const [y,m,d]=iso.split('-').map(Number);
  return `${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}.${y}`;
}
function employeeAge(birthIso,onIso=todayStr()){
  if(!birthIso||!onIso)return null;
  const [by,bm,bd]=String(birthIso).split('-').map(Number);
  const [y,m,d]=String(onIso).split('-').map(Number);
  if(!by||!bm||!bd||!y||by>y)return null;
  let age=y-by;
  if(m<bm||(m===bm&&d<bd))age--;
  return age>=0&&age<130?age:null;
}
function ageLabel(age){
  if(age==null)return '';
  const n=Math.abs(Number(age)),n10=n%10,n100=n%100;
  const word=(n10===1&&n100!==11)?'год':(n10>=2&&n10<=4&&(n100<12||n100>14))?'года':'лет';
  return `${n} ${word}`;
}

  return `<div class="staff-card${e.is_active?'':' staff-muted'}" data-eid="${e.id}">

async function renderEmployees(body){
  const canEmployees=session.role==='owner'||can('employees.view')||can('employees.manage');
  const manageEmployees=session.role==='owner'||can('employees.manage');
  const canAdmins=session.role==='owner'||can('admins.view')||can('admins.manage')||can('admins.permissions');
  const canManagePermissions=session.role==='owner'||can('admins.permissions');
  const canTelegram=session.role==='owner'||can('telegram.manage');
  const canAudit=session.role==='owner'||can('admins.audit');
  body.innerHTML='<div class="empty">Загрузка сотрудников…</div>';
  let rows=[],adminAccounts=[];
  if(canEmployees){
    try{ rows=await apiListEmployees(); }
    catch(e){return handleErr(e);}
  }
  rows.sort((a,b)=>{
    if(a.is_active!==b.is_active)return a.is_active?-1:1;
    if(a.employee_type!==b.employee_type)return a.employee_type==='admin'?-1:1;
    return String(a.full_name||'').localeCompare(String(b.full_name||''),'ru');
  });
  if(canManagePermissions){
    try{adminAccounts=(await apiListUsers()||[]).filter(u=>u.role!=='owner');}
    catch(e){ /* каталог сотрудников должен работать даже при недоступном RPC аккаунтов */ }
  }
  const byLogin=Object.fromEntries(adminAccounts.map(x=>[x.login,x]));
  const counts={all:rows.filter(x=>x.is_active).length,
    admin:rows.filter(x=>x.is_active&&x.employee_type==='admin').length,
    trainer:rows.filter(x=>x.is_active&&x.employee_type==='trainer').length,
    archive:rows.filter(x=>!x.is_active).length};
  const sections=[];
  if(canEmployees)sections.push(['all',`Все (${counts.all})`]);
  if(canEmployees||canAdmins)sections.push(['admin',`Администраторы${canEmployees?' ('+counts.admin+')':''}`]);
  if(canEmployees)sections.push(['trainer',`Тренеры (${counts.trainer})`]);
  if(canTelegram)sections.push(['telegram','Telegram']);
  if(canAudit)sections.push(['log','Лог']);
  if(canEmployees||canAdmins)sections.push(['archive','Архив']);
  if(!sections.length){body.innerHTML='<div class="empty">Нет доступных разделов.</div>';return;}
  if(!sections.some(([key])=>key===EMP_VIEW))EMP_VIEW=sections[0][0];
  body.innerHTML=`<div class="staff-toolbar fade-in"><div class="grow"><div class="section-title" style="margin:0">Сотрудники</div></div>
    ${manageEmployees?'<button class="btn btn-primary" id="addTrainer">+ Добавить тренера</button>':''}
    ${(session.role==='owner'||can('admins.manage'))?'<button class="btn" id="addEmployeeAdmin">+ Добавить администратора</button>':''}</div>
    <div class="subtabs">${sections.map(([v,label])=>`<button class="subtab${EMP_VIEW===v?' on':''}" data-empv="${v}">${label}</button>`).join('')}</div>
    <div id="empList"></div>`;
  const list=body.querySelector('#empList');
  let displayRequest=0;
  async function draw(){
    const ticket=++displayRequest;
    const view=EMP_VIEW;
    if((view==='admin'||view==='archive')&&canEmployees&&!canAdmins){
      const plain=rows.filter(e=>view==='admin'?e.is_active&&e.employee_type==='admin':!e.is_active);
      list.innerHTML=plain.length?`<div class="staff-grid">${plain.map(e=>employeeCard(e,manageEmployees)).join('')}</div>`:'<div class="empty">Сотрудников в этом разделе нет.</div>';
      list.querySelectorAll('[data-edit-employee]').forEach(b=>b.onclick=()=>{
        const e=rows.find(x=>String(x.id)===String(b.dataset.editEmployee));
        if(e)employeeModal(e,()=>renderEmployees(body));
      });
      return;
    }
    if(['admin','telegram','log','archive'].includes(view)){
      // Прежний обработчик администраторов используется как встроенный модуль.
      // Его RPC, логика Telegram, аудит и защита серверных прав не изменяются.
      list.innerHTML='<div class="empty">Загрузка…</div>';
      await renderUsers(list,{embedded:true,view:view==='admin'?'admins':view,employeeRows:rows,manageEmployees});
      return;
    }
    const selected=rows.filter(x=>x.is_active&&(view==='all'||x.employee_type==='trainer'));
    if(ticket!==displayRequest)return;
    list.innerHTML=selected.length?`<div class="staff-grid">${selected.map(x=>{
      const a=x.employee_type==='admin' && canManagePermissions && byLogin[x.app_login];
      return employeeCard(x,manageEmployees);
    }).join('')}</div>`:'<div class="empty">Сотрудников в этом разделе нет.</div>';
    // Каждому администратору доступна настройка прав прямо в его карточке.
    if(canManagePermissions){
      selected.filter(e=>e.employee_type==='admin').forEach(e=>{
        const u=byLogin[e.app_login];if(!u)return;
        const card=[...list.querySelectorAll('.staff-card')].find(x=>x.dataset.eid===String(e.id));
        if(!card)return;
        let actions=card.querySelector('.staff-actions');
        if(!actions){actions=document.createElement('div');actions.className='staff-actions';card.appendChild(actions);}
        const b=document.createElement('button');b.className='btn btn-sm';b.textContent='Настроить права';
        b.onclick=()=>permissionsModal(u,()=>renderEmployees(body));actions.appendChild(b);
      });
    }
    if(session.role==='owner'){
      selected.filter(x=>x.employee_type==='admin').forEach(e=>{
        const card=[...list.querySelectorAll('.staff-card')].find(x=>x.dataset.eid===String(e.id));
        if(!card)return;
        let actions=card.querySelector('.staff-actions');
        if(!actions){actions=document.createElement('div');actions.className='staff-actions';card.appendChild(actions);}
        const b=document.createElement('button');b.type='button';b.className='btn btn-sm';b.textContent='История филиала / перевод';
        b.onclick=()=>bonusBranchHistoryModal(e,()=>renderEmployees(body));actions.appendChild(b);
      });
    }
    list.querySelectorAll('[data-edit-employee]').forEach(b=>b.onclick=()=>{
      const e=rows.find(x=>String(x.id)===String(b.dataset.editEmployee));
      if(e)employeeModal(e,()=>renderEmployees(body));
    });
  }
  body.querySelectorAll('[data-empv]').forEach(b=>b.onclick=()=>{
    if(appHasUnsavedWork()){toast('Сначала сохраните изменения',true);return;}
    EMP_VIEW=b.dataset.empv;
    body.querySelectorAll('[data-empv]').forEach(x=>x.classList.toggle('on',x.dataset.empv===EMP_VIEW));
    void draw();
  });
  const add=body.querySelector('#addTrainer');if(add)add.onclick=()=>employeeModal(null,()=>renderEmployees(body));
  const addAdmin=body.querySelector('#addEmployeeAdmin');if(addAdmin)addAdmin.onclick=()=>addAdminModal(()=>{EMP_VIEW='admin';renderEmployees(body);});
  await draw();
}
/* Branch history: only the owner can schedule a home-studio transfer.
   All updates go through server-checked app_bonus_transfer_branch. */
function bonusBranchMonthNow(){return new Date(Date.now()+3*3600000).toISOString().slice(0,7);}
function bonusBranchNextMonth(key){const [y,m]=key.split('-').map(Number);const d=new Date(Date.UTC(y,m,1));return d.toISOString().slice(0,7);}
function bonusBranchDisplayDate(v){if(!v)return 'по настоящее время';const d=String(v).slice(0,10);return d.split('-').reverse().join('.');}
function bonusBranchEndInclusive(v){if(!v)return null;return new Date(Date.parse(String(v).slice(0,10)+'T00:00:00Z')-86400000).toISOString().slice(0,10);}

        '<div class="bh-warning" id="bh-preview">Продажи за предыдущие месяцы не изменятся. Перевод вступит в силу автоматически с выбранного месяца.</div>'+

        (month===current?' Внимание: все продажи ТЕКУЩЕГО месяца будут закреплены за новым филиалом.':' Продажи завершённых месяцев останутся прежними.');

        directionArea.innerHTML=`<fieldset class="trainer-directions">
          <legend class="rep-label">Направления</legend>

        </fieldset>`;
        save.disabled=false;
      }catch(err){
        if(!el.isConnected) return;
        loadedDirectionIds=null;
        directionArea.removeAttribute('role');
        directionArea.innerHTML='Не удалось загрузить направления.<br><button type="button" class="btn btn-sm">Повторить</button>';
        directionArea.querySelector('button').onclick=loadDirections;
        if(isForbiddenErr(err)) handleErr(err);
        else save.disabled=false;
      }

  save.onclick=async()=>{

    const payload={

      phone:(el.querySelector('#efPhone').value||'').trim(),
      birth_date:el.querySelector('#efBirth').value||null,
      hire_date:isAdmin?(e.hire_date||null):(el.querySelector('#efHire').value||null),
      primary_studio:isAdmin?(e.primary_studio||''):'',
      studios:isAdmin?employeeStudios(e):[...el.querySelectorAll('[data-efs]:checked')].map(x=>x.dataset.efs),
      is_active:isAdmin?e.is_active:el.querySelector('#efActive').checked,
      note:(el.querySelector('#efNote').value||'').trim()
    };
    const details={name:full_name,birth_date:payload.birth_date,phone:payload.phone};
    if(loadedDirectionIds){
      const checked=[...directionArea.querySelectorAll('input:checked')];
      const ids=checked.map(input=>Number(input.value));
      if(ids.length!==loadedDirectionIds.size||ids.some(id=>!loadedDirectionIds.has(id))){
        payload.direction_ids=ids;
        details['Направления']=checked.map(input=>input.parentElement.textContent.trim());
      }
    }
    const dirtyKey=payload.direction_ids!==undefined?'trainerDirectionsSave':'';
    save.disabled=true;
    if(dirtyKey) markAppDirty(dirtyKey);
    try{
      await apiSaveEmployee(payload);
      void auditAction(isNew?'Добавлен тренер':'Изменены данные сотрудника','employee',String(e&&e.id||''),details);
      if(el.isConnected){closeModal(el);onDone&&onDone();}
      toast('Сотрудник сохранён');
    }catch(err){save.disabled=false;handleErr(err);}
    finally{if(dirtyKey) clearAppDirty(dirtyKey);}
  };
}

let CAL_DATE=null;
const CAL_MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function calendarEventClass(t){return ['birthday','holiday','important','other'].includes(t)?t:'other';}
function calendarTypeLabel(t){return ({birthday:'День рождения',holiday:'Праздник',important:'Важное событие',other:'Событие'})[t]||'Событие';}
function calIso(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function occurrenceForYear(ev,y){
  const base=ev.event_date||ev.birth_date; if(!base)return '';
  const [,mm,dd]=base.split('-').map(Number);
  if(ev.repeat_yearly||ev.type==='birthday')return calIso(y,mm-1,dd);
  return base.startsWith(String(y)+'-')?base:'';
}
function nextOccurrence(ev,fromIso){
  const [fy]=fromIso.split('-').map(Number);
  const candidates=[fy,fy+1].map(y=>occurrenceForYear(ev,y)).filter(Boolean).filter(x=>x>=fromIso).sort();
  return candidates[0]||'';
}
function daysUntil(fromIso,toIso){
  const a=new Date(fromIso+'T00:00:00'),b=new Date(toIso+'T00:00:00');
  return Math.round((b-a)/86400000);
}

function normalizeReminderDays(v){
  const arr=(Array.isArray(v)?v:String(v||'').split(/[,\s;]+/))
    .map(x=>Number(x)).filter(n=>Number.isInteger(n)&&n>=0&&n<=365);
  return [...new Set(arr)].sort((a,b)=>b-a);
}
function reminderDaysLabel(days){
  const a=normalizeReminderDays(days);
  if(!a.length)return 'не настроено';
  return a.map(n=>n===0?'в день события':n===1?'за 1 день':`за ${n} дн.`).join(', ');
}

function calendarLogFmtDateTime(ts){
  if(!ts)return '—';
  try{
    return new Intl.DateTimeFormat('ru-RU',{
      timeZone:'Europe/Minsk',day:'2-digit',month:'2-digit',year:'numeric',
      hour:'2-digit',minute:'2-digit'
    }).format(new Date(ts));
  }catch(e){return String(ts);}
}
function calendarLogLocalDate(ts){
  if(!ts)return '';
  try{
    const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Minsk',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(ts));
    const get=t=>parts.find(x=>x.type===t)?.value||'';
    return `${get('year')}-${get('month')}-${get('day')}`;
  }catch(e){return '';}
}
function calendarReminderPeriodLabel(n){
  n=Number(n);
  if(n===0)return 'В день';
  if(n===1)return 'За 1 день';
  return `За ${n} дн.`;
}

  const el=modal(`<div class="clog-head">

  const box=el.querySelector('.modal'); if(box)box.classList.add('cal-log-modal');

  const today=todayStr(); to.value=today; from.value=isoAddDays(today,-30);
  let rows=[];

  function drawRecipients(){
    const cur=recipient.value;
    const people=[...new Map(rows.map(r=>[String(r.recipient_login||''),String(r.recipient_name||r.recipient_login||'')])).entries()]
      .filter(x=>x[0]).sort((a,b)=>a[1].localeCompare(b[1],'ru'));

    if(people.some(x=>x[0]===cur))recipient.value=cur;
  }
  function filtered(){
    const f=from.value,t=to.value,who=recipient.value,st=status.value;
    return rows.filter(r=>{
      const when=calendarLogLocalDate(r.sent_at||r.claimed_at);
      if(f&&when&&when<f)return false;
      if(t&&when&&when>t)return false;
      if(who&&String(r.recipient_login||'')!==who)return false;
      if(st&&String(r.status||'')!==st)return false;
      return true;
    });

    const sent=list.filter(r=>r.status==='sent').length,pending=list.length-sent;
    summary.innerHTML=`<span class="cal-log-pill">${list.length} записей</span><span class="cal-log-pill sent">✓ Отправлено: ${sent}</span>${pending?`<span class="cal-log-pill pending">⏳ Ожидает: ${pending}</span>`:''}`;
    if(!list.length){table.className='cal-log-empty';table.innerHTML='По выбранным фильтрам записей нет.';return;}
    table.className='';
    table.innerHTML=`<table class="cal-log-tbl"><thead><tr><th class="clog-time">Время</th><th class="clog-event">Событие</th><th class="clog-date">Дата события</th><th class="clog-period">Срок</th><th class="clog-person">Получатель</th><th class="clog-status">Статус</th></tr></thead><tbody>${list.map(r=>`<tr>
      <td class="clog-time">${escapeHtml(calendarLogFmtDateTime(r.sent_at||r.claimed_at))}</td>
      <td class="clog-event">${r.event_type==='birthday'?'🎂 ':r.event_type==='holiday'?'🎉 ':r.event_type==='important'?'📌 ':'🗓 '}${escapeHtml(r.event_title||r.event_key||'Событие')}</td>
      <td class="clog-date">${escapeHtml(r.occurrence_date?fmtLong(r.occurrence_date):'—')}</td>
      <td class="clog-period">${escapeHtml(calendarReminderPeriodLabel(r.days_before))}</td>
      <td class="clog-person"><b>${escapeHtml(r.recipient_name||r.recipient_login||'—')}</b>${r.recipient_name&&r.recipient_login?`<div class="u-login">${escapeHtml(r.recipient_login)}</div>`:''}</td>
      <td class="clog-status"><span class="cal-log-status ${r.status==='sent'?'sent':'pending'}">${r.status==='sent'?'✓ Отправлено':'⏳ Ожидает'}</span></td>
    </tr>`).join('')}</tbody></table>`;
  }
  async function load(){
    refresh.disabled=true; const old=refresh.textContent;refresh.textContent='…';
    table.className='cal-log-empty';table.innerHTML='Загрузка журнала…';
    try{
      rows=await apiListCalendarReminderLog(1000);
      drawRecipients();
      draw();
    }catch(e){
      table.className='cal-log-empty';table.innerHTML='Не удалось загрузить журнал.';
      handleErr(e);
    }finally{
      refresh.disabled=false;refresh.textContent=old;
    }
  }
  [from,to,recipient,status].forEach(x=>x.onchange=draw);
  refresh.onclick=load;
  await load();
}

async function renderCalendar(body){
  const manage=session.role==='owner'||can('calendar.manage');
  const now=new Date(); if(!CAL_DATE)CAL_DATE=new Date(now.getFullYear(),now.getMonth(),1);
  body.innerHTML='<div class="empty">Загрузка календаря…</div>';
  let birthdays=[],manual=[],workDays=[],reminderCfg={enabled:true,days:[7,1],time:'09:00'};
  try{
    const loadYear=CAL_DATE.getFullYear();
    [birthdays,manual,workDays]=await Promise.all([
      apiListCalendarBirthdays(),
      apiListCalendarEvents(),
      apiListWorkCalendar(`${loadYear}-01-01`,`${loadYear}-12-31`)
    ]);
    try{reminderCfg=Object.assign(reminderCfg,await apiGetCalendarReminderSettings());}catch(e){}
    reminderCfg.days=normalizeReminderDays(reminderCfg.days);
  }
  catch(e){return handleErr(e);}
  function draw(){
    const y=CAL_DATE.getFullYear(),m=CAL_DATE.getMonth(),today=todayStr();
    const merged=[
      ...birthdays.filter(x=>x.birth_date).map(x=>({type:'birthday',title:x.full_name,birth_date:x.birth_date,repeat_yearly:true,employee_type:x.employee_type,primary_studio:x.primary_studio,phone:x.phone||'',id:'b'+x.id,_birthday:x})),
      ...manual.filter(x=>x.active!==false).map(x=>({...x,type:x.event_type||'other'}))
    ];
    const eventsByDate={};
    merged.forEach(ev=>{
      const iso=occurrenceForYear(ev,y); if(!iso)return;
      if(Number(iso.slice(5,7))!==m+1)return;
      (eventsByDate[iso]||(eventsByDate[iso]=[])).push(ev);
    });
    Object.values(eventsByDate).forEach(a=>a.sort((x,z)=>(x.type==='birthday'?-1:1)-(z.type==='birthday'?-1:1)||String(x.title).localeCompare(String(z.title),'ru')));
    const workByDate={};
    workDays.forEach(r=>{ if(r&&r.day_date)(workByDate[r.day_date]||(workByDate[r.day_date]=[])).push(r); });
    const first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<42;i++){
      const day=i-offset+1;
      const dt=new Date(y,m,day),cy=dt.getFullYear(),cm=dt.getMonth(),cd=dt.getDate();
      const iso=calIso(cy,cm,cd),out=cm!==m, evs=eventsByDate[iso]||[], wr=workByDate[iso]||[];
      const hasOff=wr.some(x=>x.kind==='holiday'||x.kind==='day_off'),hasWork=wr.some(x=>x.kind==='workday'),hasShort=wr.some(x=>x.kind==='shortened');
      const wbadges=wr.map(r=>`<button class="cal-work-badge ${escapeHtml(r.kind||'')}" data-work-date="${iso}" title="${escapeHtml((r.title||workCalendarKindLabel(r.kind))+(r.note?' · '+r.note:''))}">${escapeHtml(workCalendarBadgeLabel(r))}</button>`).join('');
      cells.push(`<div class="cal-day${out?' out':''}${iso===today?' today':''}${hasOff?' work-off':''}${hasWork?' work-shift':''}${hasShort?' work-short':''}"><div class="cal-num">${cd}</div>${wbadges?`<div class="cal-work-badges">${wbadges}</div>`:''}<div class="cal-events">${evs.map(ev=>`<button class="cal-event ${calendarEventClass(ev.type)}" data-ce="${escapeHtml(String(ev.id))}">${ev.type==='birthday'?'🎂 ':ev.type==='holiday'?'🎉 ':ev.type==='important'?'📌 ':''}${escapeHtml(ev.title)}</button>`).join('')}</div></div>`);
    }
    const upcoming=merged.map(ev=>({ev,date:nextOccurrence(ev,today)})).filter(x=>x.date&&daysUntil(today,x.date)<=30).sort((a,b)=>a.date.localeCompare(b.date)||String(a.ev.title).localeCompare(String(b.ev.title),'ru')).slice(0,20);
    body.innerHTML=`<div class="cal-toolbar fade-in">
      <button class="btn btn-sm" id="calPrev">‹</button><button class="btn btn-sm" id="calToday">Сегодня</button><button class="btn btn-sm" id="calNext">›</button>
      <div class="cal-month-title">${CAL_MONTHS[m]} ${y}</div><div class="grow"></div>
      <span class="cal-reminder-state on" title="Пасха и Радуница рассчитываются системой автоматически">♻ Пасха/Радуница · авто</span>
      <span class="cal-reminder-state on" title="Праздничные выходные, переносы и сокращённые дни">🏛 Производственный календарь</span>
      <span class="cal-reminder-state ${reminderCfg.enabled!==false?'on':''}">🔔 ${reminderCfg.enabled!==false?escapeHtml(reminderDaysLabel(reminderCfg.days))+' · '+escapeHtml(reminderCfg.time||'09:00'):'выключены'}</span>
      ${manage?'<button class="btn" id="calWorkSync">↻ Выходные</button><button class="btn" id="calReminderLog">☰ Журнал уведомлений</button><button class="btn" id="calReminders">⚙ Напоминания</button><button class="btn btn-primary" id="calAdd">+ Добавить событие</button>':''}
    </div>
    <div class="cal-layout">
      <div><div class="cal-card"><div class="cal-week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div class="cal-grid">${cells.join('')}</div></div>

    body.querySelector('#calNext').onclick=()=>{const ny=new Date(y,m+1,1);CAL_DATE=ny;if(ny.getFullYear()!==y)renderCalendar(body);else draw();};
    body.querySelector('#calToday').onclick=()=>{const d=new Date();const ny=new Date(d.getFullYear(),d.getMonth(),1);CAL_DATE=ny;if(ny.getFullYear()!==y)renderCalendar(body);else draw();};

    const rem=body.querySelector('#calReminders'); if(rem)rem.onclick=()=>calendarReminderSettingsModal(reminderCfg,(x)=>{reminderCfg=Object.assign({},reminderCfg,x);draw();});
    const add=body.querySelector('#calAdd'); if(add)add.onclick=()=>eventModal(null,()=>renderCalendar(body));
    body.querySelectorAll('[data-work-date]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();const d=b.dataset.workDate;workCalendarDetailsModal(d,workByDate[d]||[]);});
    body.querySelectorAll('[data-ce]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.ce;
      if(id.startsWith('b')){
        const ev=merged.find(x=>String(x.id)===id); if(ev)birthdayInfoModal(ev);
      }else if(manage){
        const ev=manual.find(x=>String(x.id)===id); if(ev)eventModal(ev,()=>renderCalendar(body));
      }else{
        const ev=manual.find(x=>String(x.id)===id);
        if(ev)modal(`<h3>${escapeHtml(ev.title)}</h3><p>${escapeHtml(fmtLong(ev.event_date))}${ev.repeat_yearly?' · ежегодно':''}</p>${ev.note?`<p>${escapeHtml(ev.note)}</p>`:''}<div class="actions"><button class="btn btn-primary" data-x>Закрыть</button></div>`);
      }
    });
  }
  draw();
}


async function renderMessages(body){
  if(!TEAM.length){ try{ TEAM=await apiListTeam(); }catch(e){} }
  body.innerHTML=`<div class="hintline" style="padding:12px">Загрузка…</div>`;
  let settings={}; try{ settings=await apiGetSettings(); }catch(e){}
  const MSG = Object.assign(defaultMessages(), settings.messages||{});
  MSG.checklist=Object.assign({all:[],byAdmin:{}}, MSG.checklist||{});
  MSG.openMsg=Object.assign({all:'',byAdmin:{}}, MSG.openMsg||{});
  let target='all';
  clearAppDirty('messages');
  const listOf=t=> t==='all'?(MSG.checklist.all||[]):((MSG.checklist.byAdmin||{})[t]||[]);
  const setListOf=(t,arr)=>{ if(t==='all')MSG.checklist.all=arr; else { MSG.checklist.byAdmin=MSG.checklist.byAdmin||{}; MSG.checklist.byAdmin[t]=arr; } };
  const msgOf=t=> t==='all'?(MSG.openMsg.all||''):((MSG.openMsg.byAdmin||{})[t]||'');
  const setMsgOf=(t,v)=>{ if(t==='all')MSG.openMsg.all=v; else { MSG.openMsg.byAdmin=MSG.openMsg.byAdmin||{}; MSG.openMsg.byAdmin[t]=v; } };
  function draw(){
    const targets=[['all','Всем']].concat(TEAM.map(a=>[a.login, shortName(a.name)]));
    const items=listOf(target);
    const tName = target==='all' ? 'Всем' : shortName((TEAM.find(a=>a.login===target)||{}).name||target);
    const om = msgOf(target);
    body.innerHTML=`
      <div class="section-title" style="margin-bottom:2px">Сообщения и чек-листы</div>
      <div class="msg-sub">Что увидит администратор при открытии и закрытии смены. Настройте для всех или для конкретного.</div>
      <div class="msg-target">
        <span class="msg-target-lbl">Кому</span>
        <div class="msg-chips">${targets.map(t=>`<button class="mchip${target===t[0]?' on':''}" data-tg="${escapeHtml(t[0])}">${t[0]==='all'?'👥 ':''}${escapeHtml(t[1])}</button>`).join('')}</div>
      </div>
      <div class="msg-grid">
        <div class="card msg-card">
          <div class="msg-card-h"><span class="msg-ic">✅</span><div><div class="msg-card-t">Чек-лист при закрытии смены</div><div class="msg-card-d">Обязательные пункты — админ отметит их перед закрытием смены.</div></div></div>
          <div id="clItems" class="cl-list">${items.length?items.map((it,i)=>`<div class="cl-row"><span class="cl-grip">≡</span><input class="cl-inp" data-i="${i}" value="${escapeHtml(it)}"/><button class="btn-icon cl-del" data-i="${i}" title="Удалить">🗑</button></div>`).join(''):'<div class="cl-empty">Пунктов пока нет — добавьте первый ниже.</div>'}</div>
          <div class="cl-add"><input id="clNew" placeholder="Например: Выключен свет"/><button class="btn btn-sm" id="clAdd">Добавить</button></div>
        </div>
        <div class="card msg-card">
          <div class="msg-card-h"><span class="msg-ic">📣</span><div><div class="msg-card-t">Сообщение при открытии смены</div><div class="msg-card-d">Покажется всплывающим окном, когда админ откроет смену.</div></div></div>
          <textarea id="omText" rows="6" placeholder="Например: После 18:00 придёт мастер по кондиционеру — впустите его.">${escapeHtml(om)}</textarea>
          <div id="omPrev" class="msg-preview">${om.trim()?`<div class="msg-prev-lbl">Предпросмотр</div><div class="msg-prev-body">📣 ${escapeHtml(om)}</div>`:''}</div>
        </div>
      </div>
      <div class="msg-actions"><button class="btn btn-primary" id="msgSave">Сохранить для «${escapeHtml(tName)}»</button><span id="msgInd" class="msg-ind"></span></div>`;
    body.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{ target=b.dataset.tg; draw(); });
    body.querySelectorAll('.cl-inp').forEach(inp=>inp.onchange=()=>{ const arr=listOf(target).slice(); arr[+inp.dataset.i]=inp.value.trim(); setListOf(target,arr.filter(x=>x)); markAppDirty('messages'); });
    body.querySelectorAll('.cl-del').forEach(b=>b.onclick=()=>{ const arr=listOf(target).slice(); arr.splice(+b.dataset.i,1); setListOf(target,arr); markAppDirty('messages'); draw(); });
    const clAdd=body.querySelector('#clAdd'), clNew=body.querySelector('#clNew');
    clAdd.onclick=()=>{ const v=clNew.value.trim(); if(!v) return; const arr=listOf(target).slice(); arr.push(v); setListOf(target,arr); markAppDirty('messages'); draw(); };
    clNew.onkeydown=(e)=>{ if(e.key==='Enter'){ e.preventDefault(); clAdd.onclick(); } };
    const omText=body.querySelector('#omText'), omPrev=body.querySelector('#omPrev');
    omText.oninput=()=>{ setMsgOf(target, omText.value); markAppDirty('messages'); omPrev.innerHTML = omText.value.trim()?`<div class="msg-prev-lbl">Предпросмотр</div><div class="msg-prev-body">📣 ${escapeHtml(omText.value)}</div>`:''; };
    body.querySelector('#msgSave').onclick=async()=>{
      const ind=body.querySelector('#msgInd');
      try{ await apiSaveSettings(Object.assign({},settings,{messages:MSG})); void auditAction('Изменены сообщения и чек-листы','settings','messages',{target,checklist:listOf(target),message:msgOf(target)}); clearAppDirty('messages'); ind.textContent='✓ Сохранено'; setTimeout(()=>{ if(ind) ind.textContent=''; },2500); }catch(e){ handleErr(e); }
    };
  }
  draw();
}
async function renderUsers(body,options={}){
  // Настройки аккаунтов, Telegram, лог и архив встроены в «Сотрудники».
  const viewAdmins=session.role==='owner'||can('admins.view')||can('admins.manage')||can('admins.permissions');

  const viewAudit=session.role==='owner'||can('admins.audit');

  let allUsers=[];

    try{ allUsers = await apiListUsers() || []; }
    catch(e){ return handleErr(e); }
  }
  allUsers.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ru'));
  const ownerUser=allUsers.find(u=>u.role==='owner')||null;
  const users=allUsers.filter(u=>u.role!=='owner');
  const byLogin = Object.fromEntries(users.map(u=>[u.login,u]));
  let settings={};

  const active=users.filter(u=>u.active), archived=users.filter(u=>!u.active);
  const subs=[];
  if(viewAdmins) subs.push(['admins','Администраторы ('+active.length+')']);
  if(manageTelegram) subs.push(['telegram','Telegram']);
  if(viewAdmins) subs.push(['archive','Уволенные ('+archived.length+')']);
  if(viewAudit) subs.push(['log','Лог']);
  if(!subs.length){ body.innerHTML='<div class="empty">Нет доступных разделов.</div>'; return; }

  body.innerHTML='<div id="uBody"></div>';
  const refreshPanel=()=>{

  function wireRows(listEl){

      });

    });
    if(manageAdmins){
      listEl.querySelectorAll('input[data-hire]').forEach(inp=>{ inp.onchange=async()=>{ try{ await apiSetHire(inp.dataset.hire, inp.value); toast('Дата приёма сохранена'); }catch(e){ handleErr(e); } }; });
      listEl.querySelectorAll('input[data-coffee]').forEach(cb=>{ cb.onchange=async()=>{ try{ await apiSetCoffee(cb.dataset.coffee, cb.checked); toast('Сохранено'); }catch(e){ handleErr(e); } }; });

      }; });

  function drawAdmins(el){

      <p class="msg-sub">Данные сотрудника и настройки учётной записи объединены. Права, филиал, телефон и доступ находятся внутри карточки.</p>

        return `<div class="staff-account-box">${profile}<details class="staff-account-details"><summary>Учётная запись и права</summary>${userRow(u,(settings.adminPhones||{})[u.login]||'',{manage:manageAdmins,permissions:managePerms})}${session.role==='owner'&&e?`<div class="staff-bonus-access"><div><b>Доступ к планам и бонусам</b><small>${bonusAccessReady?(bonusAccess.get(String(e.id))==='all'?'Все филиалы и администраторы':'Свой филиал и коллеги'):'Настройки временно недоступны'}</small></div><button type="button" class="sw ${bonusAccess.get(String(e.id))==='all'?'on':''}" data-ba-access="${e.id}" role="switch" aria-label="Показать все филиалы ${escapeHtml(e.full_name||u.name)}" aria-checked="${bonusAccess.get(String(e.id))==='all'}" ${bonusAccessReady?'':'disabled'}></button></div>`:''}${session.role==='owner'&&e?`<div class="bh-card-controls"><button type="button" class="btn btn-sm" data-bh-open="${e.id}">История филиала / перевод</button><span class="bh-note">С начала выбранного месяца · предыдущие периоды сохраняются</span></div>`:''}</details></div>`;
      }).join(''):'<div class="empty">Активных администраторов нет.</div>'}</div>`;
    const main=el.querySelector('#ulist');

      listEl.querySelectorAll('[data-del2]').forEach(b=>b.onclick=()=>{ const u=byLogin[b.dataset.del2]; confirmModal(`Удалить «${u.name}» окончательно? Он исчезнет из списков. Отчёты останутся в логе.`, async()=>{ try{ await apiDeleteAdmin(u.login); toast('Удалён'); refreshPanel(); }catch(e){ handleErr(e); } }); });

  async function drawAudit(el){
    const today=todayStr(), from=isoAddDays(today,-29);
    el.innerHTML=`<div class="bar fade-in"><div class="grow"><div class="section-title" style="margin:0">Лог действий пользователей</div></div></div>
      <p class="msg-sub">Фиксируются вход/выход, изменения отчётов и расписания, управление администраторами, настройки и выгрузки. Пароли и токены в лог не записываются.</p>
      <div class="audit-toolbar">
        <label class="field-mini"><span>С даты</span><input type="date" id="auditFrom" value="${from}"/></label>
        <label class="field-mini"><span>По дату</span><input type="date" id="auditTo" value="${today}"/></label>

        <button class="btn btn-primary" id="auditLoad">Показать</button><button class="btn" id="auditExcel">⬇ Excel</button>
      </div><div id="auditResult"><div class="audit-empty">Загрузка…</div></div>`;
    const fromEl=el.querySelector('#auditFrom'),toEl=el.querySelector('#auditTo'),loginEl=el.querySelector('#auditLogin'),result=el.querySelector('#auditResult');
    let rows=[];
    async function load(){
      const f=fromEl.value||'',t=toEl.value||'',l=loginEl.value||'';
      if(f&&t&&f>t){toast('Дата «С» не может быть позже даты «По»',true);return}

        const known=new Set([...loginEl.options].map(o=>o.value));

            const o=document.createElement('option');

      }catch(e){result.innerHTML='<div class="audit-empty">Не удалось загрузить лог.</div>';handleErr(e)}

/* ================= Расписание (модуль) ================= */
const MON2=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const SCH_DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let SCH=null, SCHDATA=null, TEAM=[], SCHsel=null, ABS_MODE='cal', COFFEE_ROSTER=[], ADMIN_PHONES={};

function monthKey(y,m){return y+'-'+String(m+1).padStart(2,'0');}
function schPad(n){return String(n).padStart(2,'0');}
function schDaysIn(y,m){return new Date(y,m+1,0).getDate();}
function schIso(y,m,d){return y+'-'+schPad(m+1)+'-'+schPad(d);}
function schDow(y,m,d){return new Date(y,m,d).getDay();}
function toMin(t){const p=(t||'0:0').split(':');return (+p[0])*60+(+p[1]);}
function shiftHours(s,e){let d=toMin(e)-toMin(s);if(d<0)d+=1440;return d/60;}
function fmtH(x){return (Math.round(x*10)/10).toString().replace('.',',');}
function uid(){return Math.random().toString(36).slice(2,9);}
function teamById(id){return TEAM.find(a=>a.login===id);}
function adminName(id){const a=teamById(id);return a?shortName(a.name):id;}
function coffeeName(login){const a=teamById(login);if(a)return shortName(a.name);const r=COFFEE_ROSTER.find(x=>x.login===login);if(r)return shortName(r.name);return login;}
function initials(name){return String(name||'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();}
function absName(t){return t==='otpusk'?'Отпуск':t==='bol'?'Больничный':'Отгул';}
function homeAdmins(sid){return TEAM.filter(a=>a.home===sid);}
function dayRec(iso,sid){return SCHDATA.assignments[iso+'_'+sid]||null;}
function setDayRec(iso,sid,rec){const k=iso+'_'+sid; if(rec)SCHDATA.assignments[k]=rec; else delete SCHDATA.assignments[k];}
function absOn(login,iso){return (SCHDATA.absences||[]).find(a=>a.adminId===login && iso>=a.start && iso<=a.end)||null;}
function assignedThatDay(login,iso){return STUDIOS.some(s=>{const r=dayRec(iso,s.id);return r&&!r.closed&&(r.shifts||[]).some(sh=>sh.adminId===login);});}
function isFreeDay(login,iso){return !absOn(login,iso)&&!assignedThatDay(login,iso);}
function adminMonthShifts(login){const out=[];const n=schDaysIn(SCH.y,SCH.m);
  for(let d=1;d<=n;d++){const iso=schIso(SCH.y,SCH.m,d);STUDIOS.forEach(s=>{const r=dayRec(iso,s.id);if(r&&!r.closed)(r.shifts||[]).forEach(sh=>{if(sh.adminId===login)out.push({iso,sid:s.id,shift:sh});});});}
  return out;}
function adminHours(login){return adminMonthShifts(login).reduce((h,x)=>h+shiftHours(x.shift.start,x.shift.end),0);}
function consecutiveMax(login){const n=schDaysIn(SCH.y,SCH.m);let best=0,cur=0;
  for(let d=1;d<=n;d++){const iso=schIso(SCH.y,SCH.m,d);const w=assignedThatDay(login,iso)&&!absOn(login,iso);if(w){cur++;if(cur>best)best=cur;}else cur=0;}
  return best;}

function fillAbsTimeline(box, list, editable){
  if(!box) return;
  const y=SCH.y,m=SCH.m,n=schDaysIn(y,m),first=schIso(y,m,1),last=schIso(y,m,n);
  if(!TEAM.length){ box.innerHTML='<div class="hintline" style="padding:10px">Нет администраторов.</div>'; return; }
  let html=`<div class="abs-grid" style="grid-template-columns:132px repeat(${n},1fr) 46px"><div></div>`;
  for(let d=1;d<=n;d++){ const we=[0,6].includes(schDow(y,m,d)); html+=`<div class="abs-dh${we?' we':''}">${d}</div>`; }
  html+='<div class="abs-dh">дн.</div>';
  TEAM.forEach(a=>{
    const fill=new Array(n+1).fill(null); let tot=0;
    list.filter(x=>x.adminId===a.login).forEach(x=>{
      const s=x.start>first?x.start:first, e=x.end<last?x.end:last;
      if(s>e) return;
      const sd=+s.slice(8,10), ed=+e.slice(8,10);
      for(let d=sd; d<=ed; d++){ fill[d]=ABS_CLR[x.type]||'#B4B2A9'; tot++; }
    });
    html+=`<div class="abs-name">${escapeHtml(shortName(a.name))}</div>`;
    for(let d=1;d<=n;d++){ const we=[0,6].includes(schDow(y,m,d)); html+=`<div class="abs-cell${we?' we':''}" data-login="${a.login}" data-iso="${schIso(y,m,d)}"${fill[d]?` style="background:${fill[d]};border-color:${fill[d]}"`:''}></div>`; }
    html+=`<div class="abs-tot">${tot||'—'}</div>`;
  });
  html+='</div>';
  box.innerHTML=html;
  if(editable) box.onclick=(ev)=>{ const c=ev.target.closest('.abs-cell[data-login]'); if(c) openAbsCellModal(c.dataset.login, c.dataset.iso); };
}

  const today=todayStr();
  const daysIn=(login,type,first,last)=>{ let d=0; list.filter(a=>a.adminId===login&&a.type===type).forEach(a=>{ const s=a.start>first?a.start:first, e=a.end<last?a.end:last; if(s<=e) d+=isoDiff(s,e)+1; }); return d; };
  const rows=TEAM.map(a=>{

    else { first=SCH.y+'-01-01'; last=SCH.y+'-12-31'; period=SCH.y+' год (нет даты приёма)'; }

    return `<tr><td class="rowh">${escapeHtml(shortName(a.name))}<br><small class="ent">${period}</small></td><td style="min-width:170px">${otp}</td><td>${b}${nB?(' / '+nB):''}</td><td>${g}${nG?(' / '+nG):''}</td></tr>`;

  const editor = canNorms ? `<div class="norm-edit">Нормы дней в год:

      <button class="btn btn-sm" id="nSave">Сохранить нормы</button></div>` : '';
  box.innerHTML=`<div class="section-title">Баланс за год</div>${editor}

  const ns=box.querySelector('#nSave');
  ['nOtp','nBol','nOtg'].forEach(id=>{ const inp=box.querySelector('#'+id); if(inp) inp.oninput=()=>markAppDirty('leaveNorms'); });
  if(ns) ns.onclick=async()=>{
    const data=Object.assign({}, settings||{}, {leaveNorms:{otpusk:+box.querySelector('#nOtp').value||0, bol:+box.querySelector('#nBol').value||0, otgul:+box.querySelector('#nOtg').value||0}});
    try{ await apiSaveSettings(data); void auditAction('Изменены нормы отсутствий','settings','leaveNorms',{leaveNorms:data.leaveNorms}); clearAppDirty('leaveNorms'); toast('Нормы сохранены'); reflowSchedule(); }catch(e){ handleErr(e); }
  };
}

function schStrip(d, iso, sid, editor, showLabel){
  const st=SMAP[sid], r=dayRec(iso,sid);
  const absClr=t=>t==='bol'?'var(--clay)':(t==='otgul'?'var(--ink-soft)':'var(--gold)');
  let inner, closed=false, need=false, fill=false;
  if(r&&r.closed){ closed=true; inner='<span class="sch-closed">закрыто</span>'; }
  else {
    const shifts=(r&&r.shifts)?r.shifts:[];
    const scheduled=new Set(shifts.map(s=>s.adminId));
    const present=shifts.filter(sh=>!absOn(sh.adminId,iso));
    const absent=shifts.filter(sh=>absOn(sh.adminId,iso));
    const shHtml=shifts.map(sh=>{const ab=absOn(sh.adminId,iso);
      const dr=editor?` draggable="true" data-shd="${d}" data-shsid="${sid}" data-shadm="${sh.adminId}"`:'';
      if(ab) return `<div class="sch-sh absent"${dr}>${escapeHtml(adminName(sh.adminId))}<span style="color:${absClr(ab.type)}">${absName(ab.type)}</span></div>`;
      return `<div class="sch-sh"${dr}>${escapeHtml(adminName(sh.adminId))}<span>${sh.start}–${sh.end}</span></div>`;
    }).join('');
    if(absent.length>0 && present.length===0) need=true;
    const needHtml = need ? '<div class="sch-needrep">нужна замена</div>' : '';
    const absHtml=TEAM.filter(a=>a.home===sid && !scheduled.has(a.login)).map(a=>({a,ab:absOn(a.login,iso)})).filter(x=>x.ab)
      .map(x=>`<div class="sch-abs">${escapeHtml(shortName(x.a.name))}<span style="color:${absClr(x.ab.type)}">${absName(x.ab.type)}</span></div>`).join('');
    if(shifts.length===0 && iso>=todayStr()) fill=true;
    const fillHtml = fill ? '<div class="sch-fill">нужно заполнить!</div>' : '';
    inner=(shHtml+needHtml+absHtml+fillHtml)||'<span class="sch-empty">—</span>';
  }
  const armed=(SCHsel&&editor)?' armed':'';
  const lbl=showLabel?`<span class="strip-lbl" style="color:${st.color}">${st.name[0]}</span>`:'';
  const coffeeMark=(sid==='masherova' && SCHDATA.coffee && SCHDATA.coffee[iso])?`<span class="coffee-mark" title="Кофе+снеки: ${escapeHtml(coffeeName(SCHDATA.coffee[iso]))}">☕</span>`:'';
  return `<div class="sch-strip${closed?' closed':''}${need?' need':''}${fill?' fill':''}${armed}" data-day="${d}" data-sid="${sid}" style="border-left:3px solid ${st.color}">${lbl}${coffeeMark}${inner}</div>`;
}

async function schRemoveShift(day, sid, login){
  const iso=schIso(SCH.y,SCH.m,day), r=dayRec(iso,sid);

function overlaps(s1,e1,s2,e2){ return toMin(s1)<toMin(e2) && toMin(s2)<toMin(e1); }
function adminTimeConflicts(iso, excludeSid, login, start, end){
  const out=[];
  STUDIOS.forEach(os=>{ if(os.id===excludeSid) return;
    const r=dayRec(iso,os.id); if(!r||r.closed) return;
    (r.shifts||[]).forEach(x=>{ if(x.adminId===login && overlaps(start,end,x.start,x.end)) out.push({otherSid:os.id, shift:x}); });
  });
  return out;
}
function findCrossConflicts(iso, sid, shifts){
  const out=[];
  (shifts||[]).forEach(s=>{ if(!s.adminId) return;
    adminTimeConflicts(iso, sid, s.adminId, s.start, s.end).forEach(c=>out.push({login:s.adminId, otherSid:c.otherSid})); });
  return out;
}

function isoDiff(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/86400000); }
function absDaysInMonth(login, type){
  const first=schIso(SCH.y,SCH.m,1), last=schIso(SCH.y,SCH.m,schDaysIn(SCH.y,SCH.m));
  let days=0;
  (SCHDATA.absences||[]).filter(a=>a.adminId===login && (!type||a.type===type)).forEach(a=>{
    const s=a.start>first?a.start:first, e=a.end<last?a.end:last;
    if(s>e) return; days += isoDiff(s,e)+1;
  });
  return days;
}
function teamSortedByStudio(list=TEAM){
  const order=new Map(STUDIOS.map((s,i)=>[s.id,i]));
  return (list||[]).slice().sort((a,b)=>{
    const ai=order.has(a.home)?order.get(a.home):999;
    const bi=order.has(b.home)?order.get(b.home):999;
    if(ai!==bi) return ai-bi;
    return String(a.name||a.login||'').localeCompare(String(b.name||b.login||''),'ru');
  });
}

function dISO(dt){ return dt.getFullYear()+'-'+schPad(dt.getMonth()+1)+'-'+schPad(dt.getDate()); }
function d2(iso){ const p=(iso||'').split('-'); return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:iso; }
function workYear(hire, ref){
  const p=hire.split('-').map(Number), hm=p[1], hd=p[2];
  const r=new Date(ref+'T00:00:00'); let ay=r.getFullYear();
  if(new Date(ay, hm-1, hd) > r) ay-=1;
  const start=new Date(ay, hm-1, hd), end=new Date(ay+1, hm-1, hd); end.setDate(end.getDate()-1);
  return {start:dISO(start), end:dISO(end)};
}

  const daysIn=(login,type,first,last)=>{ let d=0; list.filter(a=>a.adminId===login && a.type===type).forEach(a=>{ const s=(a.start>first?a.start:first), e=(a.end<last?a.end:last); if(s<=e) d+=isoDiff(s,e)+1; }); return d; };

  if(ABS_MODE==='work'){
    const today=todayStr();
    rows=teamSortedByStudio().map(a=>{
      if(!a.hire) return `<tr><td class="rowh">${escapeHtml(shortName(a.name))}</td><td colspan="4" style="color:var(--ink-faint)">укажите дату приёма в «Администраторы»</td></tr>`;
      const wy=workYear(a.hire, today);
      const o=daysIn(a.login,'otpusk',wy.start,wy.end),b=daysIn(a.login,'bol',wy.start,wy.end),g=daysIn(a.login,'otgul',wy.start,wy.end),t=o+b+g;

async function seedMonth(block, starts){
  if(SCHDATA.approved){ toast('Месяц утверждён. Снимите утверждение, чтобы менять расписание.', true); return; }
  block = block || currentBlock() || 1; starts = starts || {};
  const n=schDaysIn(SCH.y,SCH.m);
  STUDIOS.forEach(s=>{let homes=TEAM.filter(a=>a.home===s.id); if(!homes.length) return;
    const st=starts[s.id]; if(st){ const i=homes.findIndex(a=>a.login===st); if(i>0) homes=homes.slice(i).concat(homes.slice(0,i)); }
    for(let d=1;d<=n;d++){const iso=schIso(SCH.y,SCH.m,d),k=iso+'_'+s.id;
      if(SCHDATA.assignments[k])continue;
      const idx=Math.floor((d-1)/block)%homes.length, who=homes[idx];
      if(adminTimeConflicts(iso, s.id, who.login, s.start, s.end).length) continue; // не двоим админа
      SCHDATA.assignments[k]={closed:false,shifts:[{id:uid(),adminId:who.login,start:s.start,end:s.end}]};}});
  SCHDATA.seeded=true; SCHDATA.pattern={block};
  try{ await saveMonth(); toast('Черновик заполнен ('+(block===1?'через день':block+' через '+block)+')'); reflowSchedule(); }catch(e){ handleErr(e); }
}

const BONUS_BRANCHES=[
  {id:'tolbuhina',name:'Толбухина',color:'#E2711D'},
  {id:'masherova',name:'Машерова',color:'#2F6FB5'},
  {id:'kuibysheva',name:'Куйбышева',color:'#E6A700'}
];
const BONUS_DEFAULT_SETTINGS={tiers:[{pct:90,amount:50},{pct:95,amount:120},{pct:100,amount:300},{pct:105,amount:350},{pct:110,amount:400}],quality_amount:100,bonus_mode:'per_admin',primary_branch_rule:'home'};
let BONUS_MONTH=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',timeZone:'Europe/Minsk'}).format(new Date());
let BONUS_OPEN_SEQUENCE=0;
// Sales sync now runs in Supabase Cron independently of the current viewer.
// Browser clients only read scoped data through app_bonus_snapshot.
const bonusFormat=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const bonusMoney=n=>bonusFormat(n)+' Br';
const bonusPct=n=>n===null?'—':Number(n).toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const bonusHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bonusPeriodTitle=p=>{const [y,m]=p.split('-').map(Number);return new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date(y,m-1,1)).replace(/^./,c=>c.toUpperCase());};
function bonusMonthOptions(selected){const [y,m]=selected.split('-').map(Number),months=[];for(let i=-24;i<=12;i++){const d=new Date(y,m-1+i,1);const p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');months.push(`<option value="${p}"${p===selected?' selected':''}>${bonusPeriodTitle(p)}</option>`)}return months.join('');}
function bonusFormatStaffOrder(a){const n=String(a.name||'').toLowerCase();for(const [q,i] of [['горов',1],['черкас',2],['колесникевич',3],['гис',4],['полхов',5],['шаревич',6]])if(n.includes(q))return i;return 100;}
/** Amounts derive from period-specific history; rendering is presentation-only. */
function calcBonuses(period,snapshot){
  const data=snapshot||{},cfg={...BONUS_DEFAULT_SETTINGS,...(data.settings||{})};
  if(data.bonusBasis!=='employee_branch_history')throw new Error('Сначала выполните SQL истории филиалов 13.11.2026-b. Показатели премирования не рассчитаны.');
  const tiers=[...(cfg.tiers||BONUS_DEFAULT_SETTINGS.tiers)].map(t=>({pct:Number(t.pct),amount:Number(t.amount)})).sort((a,b)=>a.pct-b.pct);
  const branchById=Object.fromEntries(BONUS_BRANCHES.map(x=>[x.id,{...x,target:null,fact:0,physicalFact:0,pct:null,tier:null,next:null,bonus:0}]));
  for(const p of data.plans||[])if(branchById[p.studio]){const t=Number(p.target);branchById[p.studio].target=Number.isFinite(t)&&t>0?t:null;}
  for(const f of data.branches||[])if(branchById[f.studio])branchById[f.studio].fact=Number(f.fact)||0;
  for(const f of data.physicalBranches||[])if(branchById[f.studio])branchById[f.studio].physicalFact=Number(f.fact)||0;
  // physicalBranches is strictly reference-only; it NEVER contributes to the bonus tier.
  // RPC returns branch-wide counts even in restricted staff view.
  const factsByEmployee=new Map();
  for(const f of data.facts||[]){const k=String(f.employee_id);if(!factsByEmployee.has(k))factsByEmployee.set(k,[]);factsByEmployee.get(k).push({studio:f.studio,count:Number(f.count)||0,amount:Number(f.amount)||0});}
  for(const b of BONUS_BRANCHES){const x=branchById[b.id];if(!x.target)continue;x.pct=x.fact/x.target*100;
    for(const t of tiers)if(x.pct+1e-9>=t.pct)x.tier=t;
    x.bonus=x.tier?x.tier.amount:0;
    const next=tiers.find(t=>x.pct+1e-9<t.pct);if(next)x.next={...next,need:Math.max(0,Math.ceil(next.pct*x.target/100-x.fact-1e-9))};
  }
  const qualityMap=new Map((data.quality||[]).map(q=>[String(q.employee_id),q.payable===true]));
  const staff=(data.staff||[]).map(s=>{
    const facts=factsByEmployee.get(String(s.id))||[];
    // Historical ownership: every membership belongs to the seller's assigned studio for the selected month,
    // even when the sale was physically entered at a different studio.
    const studio=s.home||s.studio;
    if(!branchById[studio])throw new Error('У администратора не указан основной филиал FAD: '+String(s.name||s.id));
    const fullCount=facts.reduce((z,f)=>z+f.count,0);
    const physicalSummary=facts.filter(f=>f.count>0).sort((a,b)=>BONUS_BRANCHES.findIndex(x=>x.id===a.studio)-BONUS_BRANCHES.findIndex(x=>x.id===b.studio))
      .map(f=>({studio:f.studio,count:f.count}));
    return {id:s.id,name:s.name,studio,studioCount:fullCount,count:fullCount,physicalSummary,quality:qualityMap.get(String(s.id))===true};
  });
  const branchMemberCounts=new Map(BONUS_BRANCHES.map(b=>[b.id,staff.filter(a=>a.studio===b.id).length]));
  for(const b of data.branchMembers||[])branchMemberCounts.set(b.studio,Number(b.count)||1);
  for(const s of staff){const branch=branchById[s.studio];const members=Math.max(1,branchMemberCounts.get(s.studio)||1);
    let bonus=branch?branch.bonus:0;
    if(branch && cfg.bonus_mode==='split'){
      const fellows=staff.filter(x=>x.studio===s.studio).sort((a,b)=>Number(a.id)-Number(b.id));
      const rank=Math.max(0,fellows.findIndex(x=>String(x.id)===String(s.id)));
      const cents=Math.round(branch.bonus*100),base=Math.floor(cents/members),remainder=cents%members;
      bonus=(base+(rank<remainder?1:0))/100;
    }
    s.branchFact=branch?branch.fact:0;
    s.share=s.branchFact>0?s.studioCount/s.branchFact*100:0;
    s.flexico=bonus;s.qualityBonus=s.quality?Number(cfg.quality_amount)||0:0;s.total=bonus+s.qualityBonus;
  }
  const order=Object.fromEntries(BONUS_BRANCHES.map((b,i)=>[b.id,i]));
  staff.sort((a,b)=>(order[a.studio]??9)-(order[b.studio]??9)||bonusFormatStaffOrder(a)-bonusFormatStaffOrder(b)||String(a.name).localeCompare(String(b.name),'ru'));
  const viewAll=data.owner===true||data.viewAll===true;
  const allBranches=BONUS_BRANCHES.map(b=>branchById[b.id]);
  const visibleBranches=viewAll?allBranches:allBranches.filter(b=>b.id===data.myStudio);
  const planTotal=visibleBranches.reduce((s,b)=>s+(b.target||0),0),factTotal=visibleBranches.reduce((s,b)=>s+b.fact,0);
  const flexicoTotal=staff.reduce((z,s)=>z+s.flexico,0),qualityTotal=staff.reduce((z,s)=>z+s.qualityBonus,0);
  return {period,settings:cfg,tiers,branches:visibleBranches,staff,planTotal,factTotal,physicalFactTotal:visibleBranches.reduce((s,b)=>s+b.physicalFact,0),pct:planTotal?factTotal/planTotal*100:null,flexicoTotal,qualityTotal,payout:flexicoTotal+qualityTotal,owner:!!data.owner,viewAll,myStudio:data.myStudio||null,accessGrants:data.accessGrants||[],updatedAt:data.updatedAt||null};
}

function bonusSettingsEditor(model,callback){

  const price=prompt('Шкала бонусов (в Br). Текущая: '+labels+'\nВведите пять сумм через запятую (90%,95%,100%,105%,110%):',model.tiers.map(t=>t.amount).join(', '));
  if(price===null)return;
  const nums=price.split(',').map(x=>Number(x.trim()));
  if(nums.length!==5||nums.some(x=>!Number.isInteger(x)||x<0||x>100000)){toast('Нужно указать 5 целых сумм',true);return;}
  const q=prompt('Бонус за качество (Br):',String(current.quality_amount));if(q===null)return;
  const amount=Number(q);if(!Number.isInteger(amount)||amount<0||amount>99999){toast('Некорректная сумма качества',true);return;}
  const mode=prompt('Режим выплаты: per_admin (каждому полностью) или split (делить):',current.bonus_mode||'per_admin');if(mode===null)return;
  if(!['per_admin','split'].includes(mode)){toast('Неизвестный режим бонуса',true);return;}
  const config={tiers:model.tiers.map((t,i)=>({pct:t.pct,amount:nums[i]})),quality_amount:amount,bonus_mode:mode,primary_branch_rule:'home'};
  rpc('app_bonus_set_settings',{p_token:TOKEN,p_config:config}).then(()=>{toast('Шкала сохранена');callback()}).catch(e=>handleErr(e));
}
