    const e=S.panel.id?get(S.panel.id):null;
    const v=S.draft||e||{title:'',studios:['mash'],channel:'promo',status:'plan',start:S.sel,end:S.sel,
      budget:0,goal:'',mech:'',kl:'',kp:0};
    let h=`<button type="button" class="mk-link" data-mk-act="cancel">← Отмена</button>
      <h2>${e?'Изменить активность':'Новая активность'}</h2>
      <div class="mk-fld"><label for="mk-f-title">Название</label><input type="text" id="mk-f-title" value="${esc(v.title)}" placeholder="Например, «Весенний абонемент»"></div>
      <div class="mk-fld"><label>Филиалы</label><div class="mk-studs">${SK.map(k=>`<label><input type="checkbox" class="mk-fs" value="${k}"${v.studios.includes(k)?' checked':''}><i class="mk-dot" style="background:${STUD[k].c}"></i>${STUD[k].n}</label>`).join('')}</div></div>
      <div class="mk-frow"><div class="mk-fld"><label for="mk-f-ch">Канал</label><select id="mk-f-ch" style="width:100%">${Object.keys(CH).map(k=>`<option value="${k}"${k===v.channel?' selected':''}>${CH[k]}</option>`).join('')}</select></div>
      <div class="mk-fld"><label for="mk-f-st">Статус</label><select id="mk-f-st" style="width:100%">${Object.keys(ST).map(k=>`<option value="${k}"${k===v.status?' selected':''}>${ST[k]}</option>`).join('')}</select></div></div>
      <div class="mk-frow"><div class="mk-fld"><label for="mk-f-start">Начало</label><input type="date" id="mk-f-start" value="${esc(v.start)}"></div>
      <div class="mk-fld"><label for="mk-f-end">Конец</label><input type="date" id="mk-f-end" value="${esc(v.end)}"></div></div>
      <div class="mk-fld"><label for="mk-f-budget">Бюджет, BYN</label><input type="number" min="0" id="mk-f-budget" value="${v.budget}"></div>
      <div class="mk-fld"><label for="mk-f-goal">Цель</label><input type="text" id="mk-f-goal" value="${esc(v.goal)}"></div>
      <div class="mk-frow"><div class="mk-fld"><label for="mk-f-kl">Что считаем</label><input type="text" id="mk-f-kl" value="${esc(v.kl)}" placeholder="Новых клиентов"></div>
      <div class="mk-fld"><label for="mk-f-kp">План</label><input type="number" min="0" id="mk-f-kp" value="${v.kp}"></div></div>
      <div class="mk-fld"><label for="mk-f-mech">Механика</label><textarea id="mk-f-mech">${esc(v.mech)}</textarea></div>
      <div class="mk-err" id="mk-f-err"></div><div class="mk-acts"><button class="mk-btn mk-primary" data-mk-act="save" type="button"${S.busy?' disabled':''}>Сохранить</button>
      <button class="mk-btn" data-mk-act="cancel" type="button"${S.busy?' disabled':''}>Отмена</button></div>`;
    return h;
  }
  function side(){
    $('#mk-side').innerHTML=S.panel.type==='detail'?detailSide():S.panel.type==='form'?formSide():daySide();
  }
  function renderAll(){if(!active())return;syncControls();summary();main();side();}
  function monthShift(n){S.m+=n;if(S.m<0){S.m=11;S.y--;}if(S.m>11){S.m=0;S.y++;}summary();main();}
  function showError(err){
    const msg=String(err?.message||err||'Неизвестная ошибка');
    const friendly=msg.includes('forbidden')?'Недостаточно прав или сессия завершена.':
      msg.includes('network')||msg.includes('fetch')?'Нет связи с Supabase. Повторите действие.':
      msg.includes('schema cache')||msg.includes('Could not find')?'RPC маркетинга недоступен. Установите SQL-блок.':msg;
    toast('Маркетинг: '+friendly,true);
  }
  async function patchRow(id,mutate){
    if(!owner||S.busy)return;
    const before=clone(S.events),e=get(id);if(!e)return;
    mutate(e);S.busy=true;markAppDirty('marketing-write');renderAll();
    try{
      const saved=await rpc('app_marketing_save',{p_token:TOKEN,p_data:toDB(e)});
      if(!active())return;
      S.events=S.events.map(x=>x.id===id?fromDB(saved):x);
    }catch(err){S.events=before;showError(err);}
    finally{S.busy=false;clearAppDirty('marketing-write');renderAll();}
  }
  async function saveForm(){
    if(!owner||S.busy)return;
    const title=$('#mk-f-title').value.trim(),start=$('#mk-f-start').value,end=$('#mk-f-end').value;
    const studios=[...page.querySelectorAll('.mk-fs:checked')].map(x=>x.value);
    const b=$('#mk-f-budget').value,p=$('#mk-f-kp').value;
    const bad=!title?'Введите название.':title.length>220?'Название слишком длинное.':
      !studios.length?'Выберите хотя бы один филиал.':!start||!end?'Укажите даты.':end<start?'Конец раньше начала.':
      !Number.isFinite(Number(b))||Number(b)<0||!Number.isFinite(Number(p))||Number(p)<0?'Бюджет и план не могут быть отрицательными.':'';
    if(bad){$('#mk-f-err').textContent=bad;return;}
    const old=clone(S.events),oldPanel=clone(S.panel);
    const e=oldPanel.id?get(oldPanel.id):null;
    const draft={id:e?e.id:'mk-tmp-'+Date.now()+'-'+Math.random().toString(16).slice(2),title,studios,
      channel:$('#mk-f-ch').value,status:$('#mk-f-st').value,start,end,budget:num(b),
      goal:$('#mk-f-goal').value.trim(),mech:$('#mk-f-mech').value.trim(),
      kl:$('#mk-f-kl').value.trim(),kp:num(p),kf:e?e.kf:0,
      check:e?clone(e.check):DEFAULT_CHECK.map(t=>({t,done:false}))};
    S.draft=clone(draft);
    S.events=e?S.events.map(x=>x.id===e.id?draft:x):[...S.events,draft];
    S.panel={type:'detail',id:draft.id};S.sel=draft.start;
    [S.y,S.m]=draft.start.split('-').slice(0,2).map((x,i)=>Number(x)-(i===1?1:0));
    S.busy=true;markAppDirty('marketing-write');renderAll();
    try{
      const saved=await rpc('app_marketing_save',{p_token:TOKEN,p_data:toDB(draft,!!e)});
      if(!active())return;
      const out=fromDB(saved);
      S.events=S.events.map(x=>x.id===draft.id?out:x);S.panel={type:'detail',id:out.id};S.draft=null;
      clearAppDirty('marketing-form');toast('Активность сохранена');
    }catch(err){
      S.events=old;S.panel=oldPanel;showError(err);
      // Оставляем введённые поля в форме для исправления/повтора.
      S.draft=draft;
    }finally{S.busy=false;clearAppDirty('marketing-write');renderAll();}
  }
  async function deleteRow(){
    if(!owner||S.busy||!S.delId)return;
    const id=S.delId,old=clone(S.events);S.busy=true;
    S.events=S.events.filter(e=>e.id!==id);S.delId=null;S.panel={type:'day'};
    markAppDirty('marketing-write');renderAll();
    try{await rpc('app_marketing_delete',{p_token:TOKEN,p_id:id});toast('Активность удалена');}
    catch(err){S.events=old;S.panel={type:'detail',id};showError(err);}
    finally{S.busy=false;clearAppDirty('marketing-write');renderAll();}
  }
  function action(t){
    const a=t.dataset.mkAct;if(S.busy)return;
    if(S.panel.type==='form' && ['prev','next','today','day','open','studio','view'].includes(a)){
      toast('Сначала сохраните активность или нажмите «Отмена»',true);return;
    }
    if(a==='prev')return monthShift(-1);
    if(a==='next')return monthShift(1);
    if(a==='today'){
      const x=minskToday().split('-').map(Number);S.y=x[0];S.m=x[1]-1;S.sel=minskToday();S.panel={type:'day'};return renderAll();
    }
    if(a==='day'){
      const day=t.dataset.date;const x=day.split('-').map(Number);S.sel=day;S.y=x[0];S.m=x[1]-1;S.panel={type:'day'};S.delId=null;return renderAll();
    }
    if(a==='open'){S.panel={type:'detail',id:t.dataset.id};S.delId=null;return side();}
    if(a==='back'||a==='cancel'){
      S.panel={type:'day'};S.delId=null;S.draft=null;clearAppDirty('marketing-form');return side();
    }
    if(a==='studio'){S.studio=t.dataset.v;return renderAll();}
    if(a==='view'){S.view=t.dataset.v;return renderAll();}
    if(!owner)return;
    if(a==='add'){S.draft=null;S.panel={type:'form',id:null};markAppDirty('marketing-form');return side();}
    if(a==='edit'){S.draft=null;S.panel={type:'form',id:S.panel.id};markAppDirty('marketing-form');return side();}
    if(a==='save')return void saveForm();
    if(a==='del'){S.delId=S.panel.id;return side();}
    if(a==='delno'){S.delId=null;return side();}
    if(a==='delyes')return void deleteRow();
  }
  page.addEventListener('click',event=>{
    const t=event.target.closest('[data-mk-act]');if(t&&page.contains(t))action(t);
  });
  page.addEventListener('keydown',event=>{
    if((event.key==='Enter'||event.key===' ')&&event.target.classList.contains('mk-cell')){
      event.preventDefault();action(event.target);
    }
  });
  page.addEventListener('change',event=>{
    const t=event.target;
    if(t.id==='mk-fChannel'){if(S.panel.type==='form'){syncControls();toast('Сначала сохраните активность или нажмите «Отмена»',true);return;}S.channel=t.value;return renderAll();}
    if(t.id==='mk-fStatus'){if(S.panel.type==='form'){syncControls();toast('Сначала сохраните активность или нажмите «Отмена»',true);return;}S.status=t.value;return renderAll();}
    const field=t.dataset.mkField;
    if(!field||!owner||S.busy||S.panel.type!=='detail')return;
    const e=get(S.panel.id);if(!e)return;
    if(field==='status'&&ST[t.value])void patchRow(e.id,x=>{x.status=t.value});
    if(field==='fact'){
      if(!Number.isFinite(Number(t.value))||Number(t.value)<0){toast('Факт KPI не может быть отрицательным',true);return side();}
      void patchRow(e.id,x=>{x.kf=Number(t.value)});
    }
    if(field==='check'){
      const i=Number(t.dataset.i);if(i>=0&&i<e.check.length)void patchRow(e.id,x=>{x.check[i].done=t.checked});
    }
  });
  page.addEventListener('input',event=>{
    if(S.panel.type==='form'&&owner&&event.target.matches('input,textarea,select'))markAppDirty('marketing-form');
  });
  page.innerHTML+='<div class="mk-notice" id="mk-loading" role="status">Загружаем активности из Supabase…</div>';
  try{
    const rows=await rpc('app_marketing_list',{p_token:TOKEN});
    if(!active())return;
    if(!Array.isArray(rows))throw new Error('Неверный ответ app_marketing_list');
    S.events=rows.map(fromDB);$('#mk-loading')?.remove();controls();renderAll();
  }catch(err){
    if(!active())return;
    $('#mk-loading').textContent='Не удалось загрузить маркетинг-календарь. Проверьте RPC и подключение к Supabase.';
    showError(err);return;
  }
  // Данные общие для всех устройств. Пока вкладка открыта, перечитываем базу.
  const timer=setInterval(async()=>{
    if(!active()){clearInterval(timer);return;}
    if(document.hidden||S.busy||S.panel.type==='form'||appHasUnsavedWork())return;
    try{
      const rows=await rpc('app_marketing_list',{p_token:TOKEN});
      if(active()&&Array.isArray(rows)&&!S.busy){S.events=rows.map(fromDB);renderAll();}
    }catch(err){if(active())showError(err);}
  },120000);
}
// --- Bonus membership breakdown · 13.11.2026-d ---
// Read-only. Server returns only authorized employees and never raw client/sale records.
let BONUS_TYPES_UI={studio:'all',selected:'',period:''};
async function bonusRenderTypes(body,model,isCurrent){
  const root=body.querySelector('#bp-sales-types'),host=body.querySelector('#bp-types-host');
  if(!root||!host)return;
  if(BONUS_TYPES_UI.period!==model.period){BONUS_TYPES_UI={studio:'all',selected:'',period:model.period};}
  try{
    const data=await rpc('app_bonus_types_snapshot',{p_token:TOKEN,p_period:model.period});
    if(!isCurrent()||!root.isConnected)return;
    if(!data||!data.ready){
      host.innerHTML='<div class="bp-types-message">Детализация пока не синхронизирована. После первого успешного обновления ImpulseCRM здесь появятся реальные типы продаж. Общий факт и бонусы остаются без изменений.</div>';
      return;
    }
    if(Number(data.expected)!==model.factTotal){
      host.innerHTML='<div class="bp-types-message">Расхождение детализации с общим фактом. Данные не показываются до следующей успешной синхронизации.</div>';
      return;
    }
    const visible=new Set(model.branches.map(x=>x.id));
    const staff=new Map(model.staff.map(x=>[String(x.id),x]));
    const rows=(Array.isArray(data.rows)?data.rows:[]).map(r=>({
      id:String(r.employee_id),home:String(r.home),type:String(r.type||'Тип не определён'),
      source:String(r.source||'unknown'),count:Number(r.count)||0
    })).filter(r=>visible.has(r.home)&&staff.has(r.id)&&r.count>0);
    const sourceTag={api_name:'',trainings_total:' · по количеству занятий',unknown:' · тип не определён'};
    function draw(){
      const branches=model.branches;
      if(BONUS_TYPES_UI.studio!=='all'&&!visible.has(BONUS_TYPES_UI.studio))BONUS_TYPES_UI.studio='all';
      const picked=BONUS_TYPES_UI.studio;
      const current=rows.filter(r=>picked==='all'||r.home===picked);
      const groups=new Map();
      for(const r of current){const key=JSON.stringify([r.type,r.source]);
        if(!groups.has(key))groups.set(key,{key,label:r.type,source:r.source,count:0});
        groups.get(key).count+=r.count;
      }
      const sorted=[...groups.values()].sort((a,b)=>b.count-a.count||a.label.localeCompare(b.label,'ru'));
      const total=sorted.reduce((sum,g)=>sum+g.count,0);
      const fact=picked==='all'?model.factTotal:(branches.find(b=>b.id===picked)?.fact||0);
      if(total!==fact){host.innerHTML='<div class="bp-types-message">Данные типов не совпадают с фактом филиала. Дождитесь следующей синхронизации.</div>';return;}
      if(BONUS_TYPES_UI.selected&&!groups.has(BONUS_TYPES_UI.selected))BONUS_TYPES_UI.selected='';
      const selectLabel=(b)=>b.name;
      host.innerHTML=`<div class="bp-types-toolbar"><div><b>${bonusFormat(total)}</b><span> продано абонементов · накопительно за ${bonusHtml(bonusPeriodTitle(model.period).toLowerCase())}</span></div>
        <label>Основной филиал <select id="bp-types-studio"><option value="all">Все доступные филиалы</option>${branches.map(b=>`<option value="${b.id}"${picked===b.id?' selected':''}>${bonusHtml(selectLabel(b))}</option>`).join('')}</select></label></div>
      <div class="bp-types-chart">${sorted.length?sorted.map(g=>{
        const active=BONUS_TYPES_UI.selected===g.key;
        const percent=total?g.count/total*100:0;
        return `<button type="button" class="bp-types-item${active?' active':''}" data-bp-type="${bonusHtml(g.key)}" aria-expanded="${active}">
        <span class="bp-types-item-title">${bonusHtml(g.label)}<small>${bonusHtml(sourceTag[g.source]||'')}</small></span>
        <span class="bp-types-bar"><span style="width:${percent.toFixed(2)}%"></span></span>
        <span class="bp-types-qty">${bonusFormat(g.count)} <small>(${bonusFormat(Math.round(percent))}%)</small></span></button>`}).join(''):'<div class="bp-types-message">Продаж за выбранный период пока нет.</div>'}</div>
      ${BONUS_TYPES_UI.selected?(()=>{const choice=groups.get(BONUS_TYPES_UI.selected);
        const byStaff=new Map();for(const r of current){if(JSON.stringify([r.type,r.source])!==choice.key)continue;byStaff.set(r.id,(byStaff.get(r.id)||0)+r.count);}
        const named=[...byStaff].map(([id,count])=>({name:staff.get(id)?.name||'Неизвестный сотрудник',count}))
          .sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'ru'));
        return `<div class="bp-types-detail"><div class="bp-types-detail-head"><b>${bonusHtml(choice.label)} — кто продал</b><span>${bonusFormat(choice.count)} шт.</span></div>
        ${named.map(s=>`<div class="bp-types-person"><span>${bonusHtml(s.name)}</span><b>${bonusFormat(s.count)}</b></div>`).join('')}</div>`;
      })():''}
      <div class="bp-types-foot">Продажи отнесены к основному филиалу администратора за выбранный месяц. ${sorted.some(g=>g.source!=='api_name')?'Часть названий определена по числу занятий или отсутствует в API; такие данные явно помечены.':'Типы получены из полей тарифов ImpulseCRM.'} Новые данные поступают через автоматическую синхронизацию.</div>`;
      const sel=host.querySelector('#bp-types-studio');if(sel)sel.onchange=ev=>{BONUS_TYPES_UI.studio=ev.target.value;BONUS_TYPES_UI.selected='';draw();};
      host.querySelectorAll('[data-bp-type]').forEach(btn=>btn.onclick=()=>{BONUS_TYPES_UI.selected=BONUS_TYPES_UI.selected===btn.dataset.bpType?'':btn.dataset.bpType;draw();});
    }
    draw();
  }catch(err){
    if(!isCurrent()||!root.isConnected)return;
    host.innerHTML='<div class="bp-types-message">Не удалось загрузить структуру продаж. Проверьте установку SQL и синхронизацию бонусов.</div>';
    toast('Структура продаж: '+String(err?.message||err),true);
  }
}


async function renderBonusDashboard(body){
  if(!session){body.innerHTML='<div class="empty">Требуется вход</div>';return;}
  const current=++BONUS_OPEN_SEQUENCE,month=BONUS_MONTH;
  body.dataset.bonusToken=String(current);
  const stillCurrent=()=>current===BONUS_OPEN_SEQUENCE&&body.dataset.bonusToken===String(current);
  body.innerHTML='<div class="bonus-page"><div class="bp-alert">Загружаем план и бонусы…</div></div>';
  try{
    let snapshot=await bonusSnapshot(month);
    if(!stillCurrent())return;
    // No role triggers an ImpulseCRM write from the browser. All viewers read the
    // same server-maintained facts, filtered by their own access scope in Supabase.
    if(!stillCurrent())return;
    const model=calcBonuses(month,snapshot);
    body.innerHTML=bonusRenderHtml(model);
    void bonusRenderTypes(body,model,stillCurrent);
    const sel=body.querySelector('#bp-month');if(sel)sel.onchange=e=>{BONUS_MONTH=e.target.value;renderBonusDashboard(body)};
    const refreshButton=body.querySelector('#bp-refresh');
    if(refreshButton)refreshButton.onclick=async()=>{
      if(refreshButton.disabled)return;
      if(appHasUnsavedWork()){toast('Сначала сохраните изменения',true);return;}
      refreshButton.disabled=true;refreshButton.classList.add('bp-loading');
      try{
        const currentMonth=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Minsk',year:'numeric',month:'2-digit'}).format(new Date());
        if(model.owner&&model.period===currentMonth){
          const response=await fetch(SUPABASE_URL+'/functions/v1/fad-bonus-sync',{
            method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},
            body:JSON.stringify({mode:'sync',token:TOKEN,month:model.period}),
            signal:AbortSignal.timeout(120000)
          });
          const result=await response.json().catch(()=>({}));
          if(!response.ok||result?.ok!==true||result?.saved!==true||result?.month!==model.period)
            throw new Error('ImpulseCRM: '+String(result?.error||'обновление не подтверждено'));
          toast('ImpulseCRM: синхронизировано '+result.memberships+' абонементов ✓');
        }else{
          toast('Перечитываем сохранённые показатели из Supabase');
        }
        if(body.isConnected && body.querySelector('.bonus-page'))await renderBonusDashboard(body);
      }catch(e){toast('Не удалось обновить: '+String(e?.message||e),true);}
      finally{if(refreshButton.isConnected){refreshButton.disabled=false;refreshButton.classList.remove('bp-loading');}}
    };
    body.querySelectorAll('[data-bp-plan]').forEach(input=>{const before=input.value;const commit=async()=>{
      if(input.value===before)return;
      const value=input.value.trim()===''?0:Number(input.value);
      if(!Number.isInteger(value)||value<0||value>100000){toast('План должен быть целым неотрицательным числом',true);input.value=before;return;}
      input.disabled=true;try{await rpc('app_bonus_set_plan',{p_token:TOKEN,p_period:month,p_studio:input.dataset.bpPlan,p_target:value});toast('План сохранён');await renderBonusDashboard(body)}catch(e){input.disabled=false;input.value=before;handleErr(e)}
    };input.addEventListener('blur',commit);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur();}});});
    body.querySelectorAll('[data-bp-quality]').forEach(btn=>btn.onclick=async()=>{
      btn.disabled=true;const id=Number(btn.dataset.bpQuality),next=btn.getAttribute('aria-checked')!=='true';
      try{await rpc('app_bonus_set_quality',{p_token:TOKEN,p_period:month,p_employee_id:id,p_payable:next});await renderBonusDashboard(body)}catch(e){btn.disabled=false;handleErr(e)}
    });
    const cfg=body.querySelector('#bp-settings-trigger');if(cfg)cfg.onclick=()=>bonusSettingsEditor(model,()=>renderBonusDashboard(body));
    // Rights are enforced in app_bonus_snapshot; readonly UI is not an authorization boundary.
  }catch(e){if(!stillCurrent())return;body.innerHTML='<div class="bonus-page"><div class="bp-alert">Не удалось загрузить «План и бонусы». Проверьте, что SQL из пакета установлен в Supabase.</div></div>';handleErr(e);}
}

</script>
