      <span class="sch-status ${SCHDATA.approved?'ap':'dr'}">${SCHDATA.approved?'✓ утверждён':'черновик'}</span>
      <div class="grow"></div>
      ${editor?`<button class="btn btn-sm" data-sact="seed">Заполнить черновик</button>
        <button class="btn btn-sm" data-sact="clear">Очистить</button>
        <button class="btn btn-sm" data-sact="absence">Отпуска / больничные</button>
        <button class="btn btn-sm ${SCHDATA.approved?'':'btn-primary'}" data-sact="approve">${SCHDATA.approved?'Снять утверждение':'Утвердить месяц'}</button>`:''}
    </div>
    <div class="sch-subtabs">${sub.map(x=>`<button class="sch-subtab${x[0]===SCH.view?' on':''}" data-sview="${x[0]}">${x[1]}</button>`).join('')}</div>
    <div id="schSub"></div>
  </div>`;
  const root=body.querySelector('#schedRoot');
  root.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{
    let m=SCH.m+(+b.dataset.mv), y=SCH.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} SCH.y=y; SCH.m=m;
    try{ SCHDATA=await loadMonth(y,m); }catch(e){ return handleErr(e); } drawSchedule(body,editor);
  });
  root.querySelectorAll('[data-sview]').forEach(b=>b.onclick=()=>{ SCH.view=b.dataset.sview; root.querySelectorAll('[data-sview]').forEach(x=>x.classList.toggle('on',x.dataset.sview===SCH.view)); drawSub(root); });
  if(editor){
    root.querySelector('[data-sact="seed"]').onclick=()=>openSeedModal();
    root.querySelector('[data-sact="clear"]').onclick=()=>clearDraft();
    root.querySelector('[data-sact="absence"]').onclick=()=>openAbsenceModal();
    root.querySelector('[data-sact="approve"]').onclick=()=>toggleApprove();
  }
  drawSub(root);
}
function drawSub(root){
  const el=root.querySelector('#schSub');
  if(SCH.view==='calendar') renderSchCalendar(el);
  else if(SCH.view==='overview') renderSchOverview(el);
  else renderSchPersonal(el);
}

function schStrip(d, iso, sid, editor, showLabel){
  const st=SMAP[sid], r=dayRec(iso,sid);
  const absClr=t=>t==='bol'?'var(--clay)':(t==='otgul'?'var(--ink-soft)':'var(--gold)');
  let inner, closed=false, need=false;
  if(r&&r.closed){ closed=true; inner='<span class="sch-closed">закрыто</span>'; }
  else {
    const shifts=(r&&r.shifts)?r.shifts:[];
    const scheduled=new Set(shifts.map(s=>s.adminId));
    const shHtml=shifts.map(sh=>{const ab=absOn(sh.adminId,iso); if(ab)need=true;
      return `<div class="sch-sh${ab?' needrep':''}"${editor?` draggable="true" data-shd="${d}" data-shsid="${sid}" data-shadm="${sh.adminId}"`:''}>${escapeHtml(adminName(sh.adminId))}<span>${sh.start}–${sh.end}${ab?' · замена':''}</span></div>`;}).join('');
    const absHtml=TEAM.filter(a=>a.home===sid && !scheduled.has(a.login)).map(a=>({a,ab:absOn(a.login,iso)})).filter(x=>x.ab)
      .map(x=>`<div class="sch-abs">${escapeHtml(shortName(x.a.name))}<span style="color:${absClr(x.ab.type)}">${absName(x.ab.type)}</span></div>`).join('');
    inner=(shHtml||absHtml)?(shHtml+absHtml):'<span class="sch-empty">—</span>';
  }
  const armed=(SCHsel&&editor)?' armed':'';
  const lbl=showLabel?`<span class="strip-lbl" style="color:${st.color}">${st.name[0]}</span>`:'';
  return `<div class="sch-strip${closed?' closed':''}${need?' need':''}${armed}" data-day="${d}" data-sid="${sid}" style="border-left:3px solid ${st.color}">${lbl}${inner}</div>`;
}
function renderSchCalendar(el){
  const editor=session.role==='owner'||session.senior;
  let sids=(SCH.sids&&SCH.sids.length)?SCH.sids.filter(id=>SMAP[id]):[];
  if(!sids.length) sids=[STUDIOS[0].id];
  sids=STUDIOS.map(s=>s.id).filter(id=>sids.includes(id));
  const multi=sids.length>1;
  const home=TEAM.filter(a=>sids.includes(a.home)), others=TEAM.filter(a=>!sids.includes(a.home));
  const chip=a=>`<button class="rchip${SCHsel===a.login?' sel':''}" data-adm="${a.login}" draggable="true" style="border-left:4px solid ${studioColor(a.home)}">${escapeHtml(shortName(a.name))}</button>`;
  const roster = editor ? `
    <div class="sch-roster">
      ${SCHsel?`<div class="rost-hint">Выбран: <b>${escapeHtml(adminName(SCHsel))}</b> — нажимайте на нужный филиал в дне. Ещё раз по имени — снять выбор.</div>`:''}
      ${home.length?`<div class="rost-group"><span class="rost-lbl">Свои</span>${home.map(chip).join('')}</div>`:''}
      ${others.length?`<div class="rost-group"><span class="rost-lbl">Другие</span>${others.map(chip).join('')}</div>`:''}
      ${(!home.length&&!others.length)?'<div class="hintline">Нет администраторов. Добавьте их и укажите филиал во вкладке «Администраторы».</div>':''}
    </div>` : '';
  const n=schDaysIn(SCH.y,SCH.m), list=SCH.calView==='list';
  const strips=(d,iso)=>sids.map(sid=>schStrip(d,iso,sid,editor,multi)).join('');
  let body='';
  if(list){
    let rows='';
    for(let d=1;d<=n;d++){
      const iso=schIso(SCH.y,SCH.m,d), dw=schDow(SCH.y,SCH.m,d), we=(dw===0||dw===6), today=(iso===todayStr());
      rows+=`<div class="sch-row${we?' we':''}${today?' today':''}${iso<todayStr()?' past':''}">
        <div class="sch-rd"><b>${d}</b><span>${SCH_DOW[(dw+6)%7]}</span></div>
        <div class="sch-rc">${strips(d,iso)}</div></div>`;
    }
    body=`<div class="sch-list-cal">${rows}</div>`;
  } else {
    let fd=(schDow(SCH.y,SCH.m,1)+6)%7, cells='';
    for(let i=0;i<fd;i++) cells+='<div class="sch-cell empty"></div>';
    for(let d=1;d<=n;d++){
      const iso=schIso(SCH.y,SCH.m,d);
      cells+=`<div class="sch-cell${iso<todayStr()?' past':''}"><div class="sch-d">${d}</div><div class="sch-strips">${strips(d,iso)}</div></div>`;
    }
    body=`<div class="sch-cal"><div class="sch-grid-head">${SCH_DOW.map(x=>`<div>${x}</div>`).join('')}</div><div class="sch-grid">${cells}</div></div>`;
  }
  el.innerHTML=`
    <div class="sch-studios">${STUDIOS.map(s=>`<button class="sch-st${sids.includes(s.id)?' on':''}" data-ssel="${s.id}" style="border-left:4px solid ${s.color}">${sdot(s.id)}${s.name}<span>${s.start}–${s.end}</span></button>`).join('')}</div>
    <div class="sch-viewtoggle"><button class="vt${list?'':' on'}" data-cv="grid">▦ Сетка</button><button class="vt${list?' on':''}" data-cv="list">☰ Список</button></div>
    ${roster}
    ${body}`;
  el.querySelectorAll('[data-ssel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.ssel; let arr=(SCH.sids||[]).slice();
    if(arr.includes(id)){ if(arr.length>1) arr=arr.filter(x=>x!==id); } else arr.push(id);
    SCH.sids=arr; renderSchCalendar(el);
  });
  el.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{ SCH.calView=b.dataset.cv; renderSchCalendar(el); });
  if(editor){
    el.querySelectorAll('.rchip').forEach(c=>{
      c.onclick=()=>{ SCHsel=(SCHsel===c.dataset.adm)?null:c.dataset.adm; renderSchCalendar(el); };
      c.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain','ADD:'+c.dataset.adm); e.dataTransfer.effectAllowed='copy'; });
    });
    el.querySelectorAll('.sch-strip[data-sid]').forEach(node=>{
      const day=+node.dataset.day, sid=node.dataset.sid;
      node.onclick=(ev)=>{ ev.stopPropagation(); if(SCHsel) schPlace(day, sid, SCHsel); else openDayModal(day, sid); };
      node.addEventListener('dragover',e=>{ e.preventDefault(); node.classList.add('drop'); });
      node.addEventListener('dragleave',()=>node.classList.remove('drop'));
      node.addEventListener('drop',e=>{ e.preventDefault(); node.classList.remove('drop'); const dt=e.dataTransfer.getData('text/plain'); if(dt&&dt.indexOf('ADD:')===0) schPlace(day, sid, dt.slice(4)); });
    });
    el.querySelectorAll('.sch-sh[data-shadm]').forEach(shel=>{
      shel.addEventListener('dragstart',e=>{ e.stopPropagation(); e.dataTransfer.setData('text/plain','DEL:'+shel.dataset.shd+':'+shel.dataset.shsid+':'+shel.dataset.shadm); e.dataTransfer.effectAllowed='move'; });
    });
    const rost=el.querySelector('.sch-roster');
    if(rost){
      rost.addEventListener('dragover',e=>{ e.preventDefault(); rost.classList.add('rost-drop'); });
      rost.addEventListener('dragleave',e=>{ if(!rost.contains(e.relatedTarget)) rost.classList.remove('rost-drop'); });
      rost.addEventListener('drop',e=>{ e.preventDefault(); rost.classList.remove('rost-drop'); const dt=e.dataTransfer.getData('text/plain'); if(dt&&dt.indexOf('DEL:')===0){ const p=dt.split(':'); schRemoveShift(+p[1], p[2], p[3]); } });
    }
  }
}
async function schRemoveShift(day, sid, login){
  const iso=schIso(SCH.y,SCH.m,day), r=dayRec(iso,sid);
  if(!r) return;
  r.shifts=(r.shifts||[]).filter(s=>s.adminId!==login);
  setDayRec(iso,sid,(r.shifts.length||r.closed)?r:null);
  try{ await saveMonth(); toast(adminName(login)+' убран из '+fmtLong(iso)); reflowSchedule(); }catch(e){ handleErr(e); }
}
function overlaps(s1,e1,s2,e2){ return toMin(s1)<toMin(e2) && toMin(s2)<toMin(e1); }
function adminTimeConflicts(iso, excludeSid, login, start, end){
  const out=[];
  STUDIOS.forEach(os=>{ if(os.id===excludeSid) return;
    const r=dayRec(iso,os.id); if(!r||r.closed) return;
    (r.shifts||[]).forEach(x=>{ if(x.adminId===login && overlaps(start,end,x.start,x.end)) out.push({otherSid:os.id, shift:x}); });
  });
  return out;
}
function findCrossConflicts(iso, sid, shifts){
  const out=[];
  (shifts||[]).forEach(s=>{ if(!s.adminId) return;
    adminTimeConflicts(iso, sid, s.adminId, s.start, s.end).forEach(c=>out.push({login:s.adminId, otherSid:c.otherSid})); });
  return out;
}
function moveConfirm(msg,onYes){
  const el=modal(`<h3>Администратор занят в это время</h3><p>${escapeHtml(msg)}</p>
    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn btn-primary" id="mvYes">Перенести сюда</button></div>`);
  el.querySelector('#mvYes').onclick=async()=>{ closeModal(el); await onYes(); };
}
function schPlace(day, sid, login){
  const iso=schIso(SCH.y,SCH.m,day), st=SMAP[sid];
  const cur=dayRec(iso,sid);
  if(cur&&!cur.closed&&(cur.shifts||[]).some(s=>s.adminId===login)){ toast(adminName(login)+' уже стоит в этом дне', true); return; }
  const conf=adminTimeConflicts(iso, sid, login, st.start, st.end);
  if(conf.length){ schConflict(login, iso, sid, conf[0].otherSid, day); return; }
  schDoAssign(iso, sid, login);
}
async function schDoAssign(iso, sid, login){
  const st=SMAP[sid], rec=dayRec(iso,sid)||{closed:false,shifts:[]};
  rec.closed=false; rec.shifts=rec.shifts||[]; rec.shifts.push({id:uid(),adminId:login,start:st.start,end:st.end});
  setDayRec(iso,sid,rec);
  try{ await saveMonth(); toast(adminName(login)+' → '+fmtLong(iso)); reflowSchedule(); }catch(e){ handleErr(e); }
}
function schConflict(login, iso, curSid, otherSid, day){
  const el=modal(`<h3>Администратор занят</h3>
    <p><b>${escapeHtml(adminName(login))}</b> уже в смене ${fmtLong(iso)} — ${studioName(otherSid)}.</p>
    <div class="actions" style="flex-direction:column;align-items:stretch;gap:8px">
      <button class="btn btn-primary" id="cfMove">Перенести сюда · убрать с «${studioName(otherSid)}»</button>
      <button class="btn" id="cfOther">Выбрать другого администратора</button>
      <button class="btn btn-ghost" data-x>Отмена</button>
    </div>`);
  el.querySelector('#cfMove').onclick=async()=>{
    const r=dayRec(iso,otherSid);
    if(r){ r.shifts=(r.shifts||[]).filter(s=>s.adminId!==login); setDayRec(iso,otherSid, r.shifts.length?r:null); }
    const st=SMAP[curSid], cur=dayRec(iso,curSid)||{closed:false,shifts:[]}; cur.closed=false; (cur.shifts=cur.shifts||[]).push({id:uid(),adminId:login,start:st.start,end:st.end}); setDayRec(iso,curSid,cur);
    try{ await saveMonth(); closeModal(el); toast('Перенесено на «'+studioName(curSid)+'»'); reflowSchedule(); }catch(e){ handleErr(e); }
  };
  el.querySelector('#cfOther').onclick=()=>{ closeModal(el); openDayModal(day, curSid); };
}

function teamOptions(sel,iso,sid){
  const home=TEAM.filter(a=>a.home===sid), others=TEAM.filter(a=>a.home!==sid);
  const opt=a=>{const ab=absOn(a.login,iso);const busy=assignedThatDay(a.login,iso)&&a.login!==sel;
    const stt=ab?'в отпуске':(busy?'занят':'свободен');
    return `<option value="${a.login}" ${a.login===sel?'selected':''}>${escapeHtml(a.name)} — ${stt}</option>`;};
  return '<option value="">— выберите —</option>'+
    (home.length?`<optgroup label="Свои">${home.map(opt).join('')}</optgroup>`:'')+
    (others.length?`<optgroup label="Замена с других">${others.map(opt).join('')}</optgroup>`:'');
}
function splitMid(s,e){let m=Math.round(((toMin(s)+toMin(e))/2)/30)*30;return schPad(Math.floor(m/60))+':'+schPad(m%60);}

function openDayModal(day, sid){
  const iso=schIso(SCH.y,SCH.m,day), st=SMAP[sid];
  const r=dayRec(iso,sid)||{closed:false,shifts:[]};
  let shifts=(r.shifts||[]).map(s=>({...s})), closed=!!r.closed;
  const el=modal(`<h3>${st.name} · ${day} ${MON2[SCH.m].toLowerCase()}</h3><div id="dmBody"></div>
    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn btn-primary" id="dmSave">Сохранить</button></div>`);
  const dm=el.querySelector('#dmBody');
  function draw(){
    dm.innerHTML=`
      <label class="chk" style="margin-bottom:12px"><input type="checkbox" id="dmClosed" ${closed?'checked':''}/> Студия закрыта в этот день</label>
      <div id="dmShifts" class="${closed?'dim':''}">
        ${shifts.length?shifts.map((s,i)=>`<div class="sch-erow" data-i="${i}">
           <select class="dm-adm">${teamOptions(s.adminId,iso,sid)}</select>
           <input class="dm-s" type="time" value="${s.start}"/><span>–</span><input class="dm-e" type="time" value="${s.end}"/>
           <button class="btn btn-ghost btn-sm dm-del">✕</button></div>`).join(''):'<div class="hintline">Смены не назначены</div>'}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <button class="btn btn-sm" id="dmAdd">+ Смена</button>
          <button class="btn btn-sm" id="dmSplit">Разделить на 2</button>
        </div>
      </div>`;
    dm.querySelector('#dmClosed').onchange=e=>{closed=e.target.checked;draw();};
    if(!closed){
      dm.querySelectorAll('.sch-erow').forEach(row=>{const i=+row.dataset.i;
        row.querySelector('.dm-adm').onchange=e=>shifts[i].adminId=e.target.value;
        row.querySelector('.dm-s').onchange=e=>shifts[i].start=e.target.value;
        row.querySelector('.dm-e').onchange=e=>shifts[i].end=e.target.value;
        row.querySelector('.dm-del').onclick=()=>{shifts.splice(i,1);draw();};});
      dm.querySelector('#dmAdd').onclick=()=>{const ha=homeAdmins(sid);shifts.push({id:uid(),adminId:(ha[0]||TEAM[0]||{login:''}).login,start:st.start,end:st.end});draw();};
      dm.querySelector('#dmSplit').onclick=()=>{const mid=splitMid(st.start,st.end),ha=homeAdmins(sid);
        shifts=[{id:uid(),adminId:(shifts[0]?shifts[0].adminId:(ha[0]||{login:''}).login),start:st.start,end:mid},
                {id:uid(),adminId:((ha[1]||ha[0]||{login:''}).login),start:mid,end:st.end}];draw();};
    }
  }
  draw();
  el.querySelector('#dmSave').onclick=()=>{
    const rec = closed?{closed:true,shifts:[]}:{closed:false,shifts:shifts.filter(s=>s.adminId)};
    const conflicts = closed ? [] : findCrossConflicts(iso, sid, rec.shifts);
    const finalize = async ()=>{
      const pairs=[...new Set(conflicts.map(c=>c.login+'|'+c.otherSid))];
      pairs.forEach(k=>{ const p=k.split('|'), os=p[1]; const r=dayRec(iso,os); if(r){ r.shifts=(r.shifts||[]).filter(x=>x.adminId!==p[0]); setDayRec(iso,os, r.shifts.length?r:null); } });
      setDayRec(iso,sid,(!closed && rec.shifts.length===0)?null:rec);
      try{ await saveMonth(); closeModal(el); toast(conflicts.length?'Сохранено · перенесено с других филиалов':'Сохранено'); reflowSchedule(); }catch(e){ handleErr(e); }
    };
    if(conflicts.length){
      const names=[...new Set(conflicts.map(c=>adminName(c.login)+' — уже на «'+studioName(c.otherSid)+'»'))].join('; ');
      moveConfirm(names+'. Перенести сюда (убрать с других филиалов)?', finalize);
    } else finalize();
  };
}

function isoDiff(a,b){ return Math.round((Date.parse(b)-Date.parse(a))/86400000); }
function absDaysInMonth(login, type){
  const first=schIso(SCH.y,SCH.m,1), last=schIso(SCH.y,SCH.m,schDaysIn(SCH.y,SCH.m));
  let days=0;
  (SCHDATA.absences||[]).filter(a=>a.adminId===login && (!type||a.type===type)).forEach(a=>{
    const s=a.start>first?a.start:first, e=a.end<last?a.end:last;
    if(s>e) return; days += isoDiff(s,e)+1;
  });
  return days;
}
function renderSchOverview(el){
  const n=schDaysIn(SCH.y,SCH.m);
  let head='<th class="rowh">Филиал</th>';
  for(let d=1;d<=n;d++){const we=[6,0].includes(schDow(SCH.y,SCH.m,d));head+=`<th class="${we?'we':''}">${d}</th>`;}
  let rows='';
  STUDIOS.forEach(s=>{let cells='';
    for(let d=1;d<=n;d++){const iso=schIso(SCH.y,SCH.m,d),r=dayRec(iso,s.id),we=[6,0].includes(schDow(SCH.y,SCH.m,d));let c=we?'we':'',t='';
      if(r&&r.closed){c='cl';t='×';}
      else if(r&&(r.shifts||[]).length){const need=r.shifts.some(sh=>absOn(sh.adminId,iso));c=need?'nd':'ok';t=need?'!':r.shifts.map(sh=>initials(adminName(sh.adminId))).join('/');}
      cells+=`<td class="cov ${c}" title="${escapeHtml(t)}">${escapeHtml(t)}</td>`;}
    rows+=`<tr><td class="rowh">${sdot(s.id)}${s.name}</td>${cells}</tr>`;});
  const warns=TEAM.filter(a=>consecutiveMax(a.login)>3);
  const hrows=TEAM.map(a=>`<tr><td class="rowh">${escapeHtml(shortName(a.name))}</td><td>${fmtH(adminHours(a.login))} ч</td><td>${adminMonthShifts(a.login).length}</td><td>${consecutiveMax(a.login)>3?'<span class="warnpill">'+consecutiveMax(a.login)+' подряд</span>':'—'}</td></tr>`).join('');
  el.innerHTML=`
    ${warns.length?`<div class="banner" style="background:var(--gold-soft);border-color:#E7CF9F"><div class="bt" style="color:var(--gold)">⚠ Более 3 смен подряд (${warns.length})</div><div class="bi">${warns.map(a=>`<span class="bchip" style="cursor:default;border-color:#E7CF9F">${escapeHtml(shortName(a.name))} — ${consecutiveMax(a.login)}</span>`).join('')}</div></div>`:''}
    <div class="section-title">Покрытие по дням</div>
    <div class="sch-scroll"><table class="sch-cov"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="section-title">Часы за месяц</div>
    <div class="sch-scroll"><table class="sch-hrs"><thead><tr><th>Администратор</th><th>Часы</th><th>Смен</th><th>Серии</th></tr></thead><tbody>${hrows||'<tr><td colspan="4" style="color:var(--ink-faint)">Нет администраторов. Добавьте их и укажите филиал.</td></tr>'}</tbody></table></div>
    <div class="section-title">Отсутствия за месяц (дней)</div>
    <div class="sch-scroll"><table class="sch-hrs"><thead><tr><th>Администратор</th><th>Отпуск</th><th>Больн.</th><th>Отгул</th><th>Всего</th></tr></thead><tbody>${TEAM.map(a=>{const o=absDaysInMonth(a.login,'otpusk'),b=absDaysInMonth(a.login,'bol'),g=absDaysInMonth(a.login,'otgul'),t=o+b+g;return `<tr><td class="rowh">${escapeHtml(shortName(a.name))}</td><td>${o||'—'}</td><td>${b||'—'}</td><td>${g||'—'}</td><td><b>${t||'—'}</b></td></tr>`;}).join('')||'<tr><td colspan="5" style="color:var(--ink-faint)">Нет данных</td></tr>'}</tbody></table></div>
    <div class="section-title">Отсутствия за год (дней)</div>
    <div class="sch-viewtoggle" style="margin-bottom:8px">
      <button class="vt${ABS_MODE!=='work'?' on':''}" data-am="cal">Календарный ${SCH.y}</button>
      <button class="vt${ABS_MODE==='work'?' on':''}" data-am="work">Рабочий год (от приёма)</button>
    </div>
    <div id="yearAbs" class="sch-scroll"><div class="hintline" style="padding:10px">Загрузка…</div></div>`;
  el.querySelectorAll('[data-am]').forEach(b=>b.onclick=()=>{ ABS_MODE=b.dataset.am; el.querySelectorAll('[data-am]').forEach(x=>x.classList.toggle('on',x.dataset.am===ABS_MODE)); fillYearAbsences(el.querySelector('#yearAbs')); });
  fillYearAbsences(el.querySelector('#yearAbs'));
}
function dISO(dt){ return dt.getFullYear()+'-'+schPad(dt.getMonth()+1)+'-'+schPad(dt.getDate()); }
function d2(iso){ const p=(iso||'').split('-'); return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:iso; }
function workYear(hire, ref){
  const p=hire.split('-').map(Number), hm=p[1], hd=p[2];
  const r=new Date(ref+'T00:00:00'); let ay=r.getFullYear();
  if(new Date(ay, hm-1, hd) > r) ay-=1;
  const start=new Date(ay, hm-1, hd), end=new Date(ay+1, hm-1, hd); end.setDate(end.getDate()-1);
  return {start:dISO(start), end:dISO(end)};
}
async function fillYearAbsences(box){
  if(!box) return;
  let all; try{ all=await apiAllAbsences(); }catch(e){ box.innerHTML='<div class="hintline" style="padding:10px">Не удалось загрузить</div>'; return; }
  const seen=new Set(), list=[];
  (all||[]).forEach(a=>{ const k=a.id||JSON.stringify([a.adminId,a.type,a.start,a.end]); if(!seen.has(k)){ seen.add(k); list.push(a); } });
  const daysIn=(login,type,first,last)=>{ let d=0; list.filter(a=>a.adminId===login && a.type===type).forEach(a=>{ const s=(a.start>first?a.start:first), e=(a.end<last?a.end:last); if(s<=e) d+=isoDiff(s,e)+1; }); return d; };
  let rows;
  if(ABS_MODE==='work'){
    const today=todayStr();
    rows=TEAM.map(a=>{
      if(!a.hire) return `<tr><td class="rowh">${escapeHtml(shortName(a.name))}</td><td colspan="4" style="color:var(--ink-faint)">укажите дату приёма в «Администраторы»</td></tr>`;
      const wy=workYear(a.hire, today);
      const o=daysIn(a.login,'otpusk',wy.start,wy.end),b=daysIn(a.login,'bol',wy.start,wy.end),g=daysIn(a.login,'otgul',wy.start,wy.end),t=o+b+g;
      return `<tr><td class="rowh">${escapeHtml(shortName(a.name))}<br><small class="ent">${d2(wy.start)}–${d2(wy.end)}</small></td><td>${o||'—'}</td><td>${b||'—'}</td><td>${g||'—'}</td><td><b>${t||'—'}</b></td></tr>`;
    }).join('');
  } else {
    const y=SCH.y, first=y+'-01-01', last=y+'-12-31';
    rows=TEAM.map(a=>{const o=daysIn(a.login,'otpusk',first,last),b=daysIn(a.login,'bol',first,last),g=daysIn(a.login,'otgul',first,last),t=o+b+g;
      return `<tr><td class="rowh">${escapeHtml(shortName(a.name))}</td><td>${o||'—'}</td><td>${b||'—'}</td><td>${g||'—'}</td><td><b>${t||'—'}</b></td></tr>`;}).join('');
  }
  box.innerHTML=`<table class="sch-hrs"><thead><tr><th>Администратор</th><th>Отпуск</th><th>Больн.</th><th>Отгул</th><th>Всего</th></tr></thead><tbody>${rows||'<tr><td colspan="5" style="color:var(--ink-faint)">Нет данных</td></tr>'}</tbody></table>`;
}

function renderSchPersonal(el){
  const me=session.login;
  const shifts=adminMonthShifts(me).sort((a,b)=>a.iso<b.iso?-1:1);
  const today=todayStr(), next=shifts.find(x=>x.iso>=today);
  const myAbs=(SCHDATA.absences||[]).filter(a=>a.adminId===me);
  const cm=consecutiveMax(me);
  el.innerHTML=`
    <div class="sch-tiles">
      <div class="tile"><div class="tk">Часов за месяц</div><div class="tv">${fmtH(adminHours(me))}</div></div>
      <div class="tile"><div class="tk">Смен за месяц</div><div class="tv">${shifts.length}</div></div>
      <div class="tile"><div class="tk">Ближайшая смена</div><div class="tv sm">${next?fmtLong(next.iso)+' · '+studioName(next.sid):'—'}</div></div>
      <div class="tile ${cm>3?'warn':''}"><div class="tk">Макс. подряд</div><div class="tv">${cm}</div></div>
    </div>
    <div class="section-title">Мои смены${SCHDATA.approved?'':' <small style="color:var(--gold);font-family:Golos Text;font-weight:600">(график ещё черновик)</small>'}</div>
    ${shifts.length?`<div class="sch-list">${shifts.map(x=>`<div class="sch-li">${sdot(x.sid)}<b>${fmtLong(x.iso)}</b> · ${studioName(x.sid)} · ${x.shift.start}–${x.shift.end} <span>${fmtH(shiftHours(x.shift.start,x.shift.end))} ч</span></div>`).join('')}</div>`:'<div class="empty">Смен в этом месяце пока нет.</div>'}
    ${myAbs.length?`<div class="section-title">Мои отсутствия</div><div class="sch-list">${myAbs.map(a=>`<div class="sch-li">${absName(a.type)} · ${fmtLong(a.start)} – ${fmtLong(a.end)}</div>`).join('')}</div>`:''}`;
}

function openAbsenceModal(){
  let list=(SCHDATA.absences||[]).map(a=>({...a}));
  const el=modal(`<h3>Отпуска и больничные</h3><div id="abBody"></div>
    <div class="actions"><button class="btn" data-x>Закрыть</button><button class="btn btn-primary" id="abSave">Сохранить</button></div>`);
  const ab=el.querySelector('#abBody');
  function draw(){
    ab.innerHTML=`
      <div class="sch-list" style="margin-bottom:12px">${list.length?list.map((a,i)=>`<div class="sch-li"><b>${escapeHtml(adminName(a.adminId))}</b> · ${absName(a.type)} · ${a.start} – ${a.end} <button class="btn btn-ghost btn-sm" data-abdel="${i}" style="float:right;margin-top:-4px">✕</button></div>`).join(''):'<div class="hintline">Пока нет записей</div>'}</div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">
        <select id="abAdm">${TEAM.map(a=>`<option value="${a.login}">${escapeHtml(shortName(a.name))}</option>`).join('')}</select>
        <select id="abType"><option value="otpusk">Отпуск</option><option value="bol">Больничный</option><option value="otgul">Отгул</option></select>
        <input id="abStart" type="date"/><input id="abEnd" type="date"/>
      </div>
      <button class="btn btn-sm" id="abAdd" style="margin-top:8px">+ Добавить</button>`;
    ab.querySelectorAll('[data-abdel]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.abdel,1);draw();});
    ab.querySelector('#abAdd').onclick=()=>{const s=ab.querySelector('#abStart').value,e=ab.querySelector('#abEnd').value;
      if(!s||!e){toast('Укажите даты',true);return;}
      list.push({id:uid(),adminId:ab.querySelector('#abAdm').value,type:ab.querySelector('#abType').value,start:s,end:(e<s?s:e)});draw();};
  }
  draw();
  el.querySelector('#abSave').onclick=async()=>{ SCHDATA.absences=list; try{ await saveMonth(); closeModal(el); toast('Сохранено'); reflowSchedule(); }catch(e){ handleErr(e); } };
}

function currentBlock(){ return (SCHDATA.pattern&&SCHDATA.pattern.block)||1; }
function openSeedModal(){
  const cur=currentBlock();
  const el=modal(`<h3>Заполнить черновик</h3><p>Смены расставляются ротацией между администраторами филиала (у кого указан «домашний филиал»). Уже назначенные дни не меняются.</p>
    <div class="field"><div class="lbl">Принцип чередования</div>
      <select id="seedPat">
        <option value="1" ${cur===1?'selected':''}>Через день (1/1)</option>
        <option value="2" ${cur===2?'selected':''}>2 через 2</option>
        <option value="3" ${cur===3?'selected':''}>3 через 3</option>
        <option value="custom">Своё…</option>
      </select></div>
    <div class="field" id="seedCustomWrap" style="display:none"><div class="lbl">По сколько дней подряд на одного</div><input id="seedCustom" type="number" min="1" max="14" value="${cur}"/></div>
    <div class="actions"><button class="btn" data-x>Отмена</button><button class="btn btn-primary" id="seedGo">Заполнить</button></div>`);
  const sel=el.querySelector('#seedPat'), cw=el.querySelector('#seedCustomWrap');
  sel.onchange=()=>{ cw.style.display = sel.value==='custom' ? 'block' : 'none'; };
  el.querySelector('#seedGo').onclick=async()=>{
    let block = sel.value==='custom' ? Math.max(1,Math.min(14,parseInt(el.querySelector('#seedCustom').value)||1)) : parseInt(sel.value);
    closeModal(el); await seedMonth(block);
  };
}
async function seedMonth(block){
  block = block || currentBlock() || 1;
  const n=schDaysIn(SCH.y,SCH.m);
  STUDIOS.forEach(s=>{const homes=TEAM.filter(a=>a.home===s.id); if(!homes.length) return;
    for(let d=1;d<=n;d++){const iso=schIso(SCH.y,SCH.m,d),k=iso+'_'+s.id;
      if(SCHDATA.assignments[k])continue;
      const idx=Math.floor((d-1)/block)%homes.length, who=homes[idx];
      if(adminTimeConflicts(iso, s.id, who.login, s.start, s.end).length) continue; // не двоим админа
      SCHDATA.assignments[k]={closed:false,shifts:[{id:uid(),adminId:who.login,start:s.start,end:s.end}]};}});
  SCHDATA.seeded=true; SCHDATA.pattern={block};
  try{ await saveMonth(); toast('Черновик заполнен ('+(block===1?'через день':block+' через '+block)+')'); reflowSchedule(); }catch(e){ handleErr(e); }
}
function clearDraft(){
  confirmModal('Очистить черновик за '+MON2[SCH.m].toLowerCase()+' '+SCH.y+'? Все назначения смен за месяц удалятся (отпуска сохранятся).', async()=>{
    SCHDATA.assignments={}; SCHDATA.seeded=false;
    try{ await saveMonth(); toast('Черновик очищен'); reflowSchedule(); }catch(e){ handleErr(e); }
  });
}
async function toggleApprove(){
  SCHDATA.approved=!SCHDATA.approved;
  try{ await saveMonth(); toast(SCHDATA.approved?'Месяц утверждён':'Утверждение снято'); reflowSchedule(); }catch(e){ handleErr(e); }
}

/* ================= Start ================= */
boot();
</script>
